apiVersion: v1
kind: Service
metadata:
  name: portal-data
  labels:
    app: portal-data
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- if  .Values.global.additionalAnnotations }}
  annotations:
  {{- range $key, $val := .Values.global.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- end }}  
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: portal-data-http
  selector:
    app: portal-data
  type: ClusterIP
  sessionAffinity: ClientIP