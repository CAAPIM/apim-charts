{{- if .Values.portal.intelligence.enabled }}
{{- if and .Values.intelligence.rbac.create .Values.intelligence.serviceAccount.create (not .Values.global.serviceAccountName) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intelligence-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: intelligence-server
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intelligence-server
subjects:
  - kind: ServiceAccount
    name: {{ include "intelligence.serviceAccountName" . }}
{{- end }}
{{- end }}
