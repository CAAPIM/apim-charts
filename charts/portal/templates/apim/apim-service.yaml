apiVersion: v1
kind: Service
metadata:
  name: apim
  labels:
    app: apim
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: apim-http
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: apim-https
    - port: 9443
      targetPort: 9443
      protocol: TCP
      name: apim-pm
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: apim-analytics
    - port: 9449
      targetPort: 9449
      protocol: TCP
      name: apim-datalake
    - port: 9446
      targetPort: 9446
      protocol: TCP
      name: tssg-enroll
    - port: 1885
      targetPort: 1885
      protocol: TCP
      name: apim-broker
    - port: 9448
      targetPort: 9448
      protocol: TCP
      name: apim-sso
{{- if .Values.portal.intelligence.enabled }}
    - port: {{ .Values.portal.intelligence.kafkaProxy.listenPort | default 9192 }}
      targetPort: {{ .Values.portal.intelligence.kafkaProxy.listenPort | default 9192 }}
      protocol: TCP
      name: kafka-proxy-bootstrap
{{- $brokerStartPort := int (.Values.portal.intelligence.kafkaProxy.brokerStartPort | default 9193) }}
{{- $replicaCount := int (.Values.kafka.kafka.replicaCount | default 1) }}
{{- $ordinalStart := 0 }}
{{- if and .Values.kafka.kafka.ordinals (hasKey .Values.kafka.kafka.ordinals "start") }}
{{- $ordinalStart = int .Values.kafka.kafka.ordinals.start }}
{{- end }}
{{- range $i := until $replicaCount }}
{{- $brokerPort := add $brokerStartPort (add $ordinalStart $i) }}
    - port: {{ $brokerPort }}
      targetPort: {{ $brokerPort }}
      protocol: TCP
      name: kafka-proxy-broker-{{ add $ordinalStart $i }}
{{- end }}
{{- end }}
  selector:
    app: apim
  type: ClusterIP
  sessionAffinity: ClientIP