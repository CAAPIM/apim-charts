{{- if .Values.ingress.type.openshift }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: apim-route
  labels:
    app: {{ template "portal.name" . }}
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.ingress.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  annotations:
  {{- range $key, $val := .Values.ingress.annotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
spec:
  host: {{ include "default-tenant-host" . | quote }}
  port:
    targetPort: portal-https
  tls:
    termination: passthrough
  to:
    kind: Service
    name: dispatcher
    weight: 100
  wildcardPolicy: None
