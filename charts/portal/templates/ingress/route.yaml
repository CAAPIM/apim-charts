{{- range .Values.ingress.customRoutes }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .subdomain }}-route
  labels:
    app: {{ template "portal.name" $ }}
    chart: {{ template "portal.chart" $ }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    {{- range $key, $val := $.Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := $.Values.ingress.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  annotations:
  {{- range $key, $val := $.Values.ingress.annotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
spec:
  host: "{{ .subdomain }}.{{ $.Values.portal.domain }}"
  port:
    targetPort: {{ .service.port }}
  tls:
    termination: passthrough
  to:
    kind: Service
    name: {{ .service.name }}
    weight: 100
  wildcardPolicy: None
{{- end }}
{{- range .Values.ingress.tenantIds }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ . }}-route
  labels:
    app: {{ template "portal.name" $ }}
    chart: {{ template "portal.chart" $ }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    {{- range $key, $val := $.Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := $.Values.ingress.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  annotations:
  {{- range $key, $val := $.Values.ingress.annotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
spec:
  host: "{{ . }}.{{ $.Values.portal.domain }}"
  port:
    targetPort: portal-https
  tls:
    termination: passthrough
  to:
    kind: Service
    name: dispatcher
    weight: 100
  wildcardPolicy: None
{{- end }}
{{- end }}
