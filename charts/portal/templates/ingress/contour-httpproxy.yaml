    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.ingress.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
spec:
  virtualhost:
    fqdn: {{ include "kafka-proxy-host" . | quote }}
    tls:
      passthrough: true
