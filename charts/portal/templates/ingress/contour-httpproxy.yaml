{{ if and (.Values.ingress.type.contour) ($.Capabilities.APIVersions.Has "projectcontour.io/v1") }}
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: portal-dispatcher-httpproxy
  labels:
    app: {{ template "portal.name" . }}
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.ingress.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
spec:
  virtualhost:
    fqdn: {{ include "default-tenant-host" . | quote }}
    tls:
      passthrough: true
  tcpproxy:
    services:
    - name: dispatcher
      port: 443
---
