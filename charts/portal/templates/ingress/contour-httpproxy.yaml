{{- if .Values.portal.intelligence.enabled }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: portal-kafka-proxy-httpproxy
  labels:
    app: {{ template "portal.name" . }}
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
