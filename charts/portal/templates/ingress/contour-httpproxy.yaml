{{- range $i,$tenantId := $.Values.ingress.tenantIds }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: portal-dispatcher-httpproxy-{{ $tenantId }}
  labels:
    app: {{ template "portal.name" $ }}
    chart: {{ template "portal.chart" $ }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    {{- range $key, $val := $.Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := $.Values.ingress.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
spec:
  virtualhost:
    fqdn: "{{ . }}.{{ $.Values.portal.domain }}"
    tls:
      passthrough: true
  tcpproxy:
    services:
    - name: dispatcher
      port: 443
---
{{- end }}

{{- range $i,$customRoute := .Values.ingress.customRoutes }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: portal-dispatcher-httpproxy
  labels:
    app: {{ template "portal.name" $ }}
    chart: {{ template "portal.chart" $ }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    {{- range $key, $val := $.Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := $.Values.ingress.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
spec:
  virtualhost:
    fqdn: "{{ $customRoute.subdomain }}.{{ $.Values.portal.domain }}"
    tls:
      passthrough: true
  tcpproxy:
    services:
    - name: {{ $customRoute.service.name }}
      port: {{ $customRoute.service.port }}

---
{{- end }}

{{ end }}