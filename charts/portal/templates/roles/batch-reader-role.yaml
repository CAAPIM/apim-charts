{{- if and .Values.rbac.create (not .Values.global.serviceAccountName) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "portal.fullname" . }}-batch-reader
  labels:
    app: {{ template "portal.name" . }}
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- if  .Values.global.additionalAnnotations }}
  annotations:
  {{- range $key, $val := .Values.global.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- end }}  
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get"]
{{- end }}