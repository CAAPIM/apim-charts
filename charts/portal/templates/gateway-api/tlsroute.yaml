{{- if .Values.ingress.type.gatewayAPI }}
{{- if $.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1alpha2" }}
{{- $root := . -}}
{{- $annotations := default (dict) .Values.ingress.gatewayAPI.annotations -}}
{{/*
  ============================================================
  Fixed TLSRoutes - auto-generated from portal hostname helpers
  ============================================================
*/}}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: portal-tlsroute-default-tenant
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "portal.name" . }}
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.ingress.gatewayAPI.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if $annotations }}
  annotations:
    {{- range $key, $val := $annotations }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- include "portal.gatewayAPI.defaultParentRefs" . | nindent 4 }}
  hostnames:
    - {{ include "default-tenant-host" . | quote }}
  rules:
    - backendRefs:
        - name: dispatcher
          port: 443
---
