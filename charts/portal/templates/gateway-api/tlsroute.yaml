{{/*
  ============================================================
  Dynamic TLSRoutes - generated from ingress.tenantIds
  ============================================================
*/}}
{{- range $i, $tenantId := .Values.ingress.tenantIds }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: portal-tlsroute-tenant-{{ $tenantId }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ template "portal.name" $root }}
    chart: {{ template "portal.chart" $root }}
    release: {{ $root.Release.Name }}
    heritage: {{ $root.Release.Service }}
    {{- range $key, $val := $root.Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := $root.Values.ingress.gatewayAPI.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if $annotations }}
  annotations:
    {{- range $key, $val := $annotations }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- include "portal.gatewayAPI.defaultParentRefs" $root | nindent 4 }}
  hostnames:
    - {{ printf "%s.%s" $tenantId $root.Values.portal.domain | quote }}
  rules:
    - backendRefs:
        - name: dispatcher
          port: 443
{{- end }}
{{/*
  ============================================================
  Dynamic TLSRoutes - generated from ingress.customRoutes
  ============================================================
*/}}
{{- range $i, $customRoute := .Values.ingress.customRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: portal-tlsroute-custom-{{ $customRoute.subdomain | replace "." "-" | lower | trunc 48 }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ template "portal.name" $root }}
    chart: {{ template "portal.chart" $root }}
    release: {{ $root.Release.Name }}
    heritage: {{ $root.Release.Service }}
    {{- range $key, $val := $root.Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := $root.Values.ingress.gatewayAPI.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if $annotations }}
  annotations:
    {{- range $key, $val := $annotations }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- include "portal.gatewayAPI.defaultParentRefs" $root | nindent 4 }}
  hostnames:
    - {{ printf "%s.%s" $customRoute.subdomain $root.Values.portal.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ $customRoute.service.name }}
          port: {{ $customRoute.service.port }}
{{- end }}
{{- else }}
{{- fail "Gateway API TLSRoute CRDs (gateway.networking.k8s.io/v1alpha2) are not available on this cluster. Install experimental Gateway API CRDs before enabling ingress.type.gatewayAPI." }}
{{- end }}
{{- end }}
