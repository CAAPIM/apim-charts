##
## Subchart Configuration
##
seaweedfs:
  image: seaweedfs:5.4.2
  persistence:
    storage:
      seaweedfs: 50Gi
  replicaCount: 1
  bucketName: api-metrics
  minio:
    bucketName: api-metrics
  restartPolicy: Always
  imagePullPolicy: Always
  loggingLevel: 1
  imageOverride: null
  clusterDomain: cluster.local

  forceRedeploy: true

   # Core configuration
  idleTimeout: 30  # Connection idle seconds
  dataCenter: ""  # Current volume server's data center name
  rack: ""  # Current volume server's rack name
  whiteList: ""  # Comma separated IP addresses having write permission
  disableHttp: false  # Disable HTTP requests, only gRPC operations are allowed
  metricsPort: 9324  # Prometheus metrics listen port
  metricsIp: ""  # Metrics listen IP. If empty, defaults to bindAddress
  loggingOverrideLevel: null  # Override logging level

  auth:
    secretName: seaweedfs-s3-secret
  # Leave access_key and secret_key empty to auto-generate values.
  # access_key:
  # secret_key:

   # Service configuration
  s3:
    enabled: true  # Whether to enable S3 gateway
    port: 8333
    enableAuth: true
    existingConfigSecret: seaweedfs-s3-secret
  sftp:
    enabled: false  # Whether to enable SFTP server

  filer:
    port: 8888
    grpcPort: 18888
    defaultReplicaPlacement: "000"
    dirListLimit: 100000
    s3:
      enableAuth: true
      createBuckets:
        - name: api-metrics
          anonymousRead: false
        - name: file-storage
          anonymousRead: false
    config: |
      [leveldb2]
      enabled = false

  volume:
    port: 8080
    grpcPort: 18080
    compactionMBps: 50
    minFreeSpacePercent: 7
    dataDirs:
      - name: data-0
        type: "persistentVolumeClaim"
        size: "50Gi"
        maxVolumes: 50

  master:
    port: 9333
    grpcPort: 19333
    config: ""
    volumeSizeLimitMB: 1024

   # Service settings
  service:
    annotations: {}  # Annotations for the service
    type: ClusterIP  # Service type (ClusterIP, NodePort, LoadBalancer)

   # Storage configuration
  data:
    type: "emptyDir"  # Options: "hostPath", "persistentVolumeClaim", "emptyDir"
    hostPathPrefix: /mnt/data  # Path prefix for hostPath volumes
    claimName: seaweedfs-data-pvc  # Name of the PVC to use
    size: ""  # Size of the PVC
    storageClass: ""  # Storage class for the PVC

   # Health checks
  readinessProbe:
    enabled: true
    httpGet:
      path: /cluster/status
      port: 9333
    scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 40
    successThreshold: 1
    failureThreshold: 6
    timeoutSeconds: 40

  livenessProbe:
    enabled: true
    httpGet:
      path: /cluster/status
      port: 9333
    scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 40
    successThreshold: 1
    failureThreshold: 6
    timeoutSeconds: 40

   # Enable if replica count > 1
  startupProbe:
    enabled: true
    httpGet:
      path: /cluster/status
      port: 9333
    scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 15
    timeoutSeconds: 40

   # Additional resources
  extraEnvironmentVars: {}  # Additional environment variables
  extraVolumeMounts: ""  # Additional volume mounts
  extraVolumes: ""  # Additional volumes
  initContainers: ""  # Init containers
  sidecars: ""  # Sidecar containers
  annotations: {}  # Annotations for the deployment
  podAnnotations: {}  # Annotations for the pods
  podLabels: {}  # Labels for the pods

   # Scheduling configuration
  # Affinity Settings
  # Commenting out or setting as empty the affinity variable, will allow
