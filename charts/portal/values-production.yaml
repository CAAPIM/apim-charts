# Configuration for the custom Kafka subchart.
# Kafka is the messaging backbone for Portal and is always deployed. The kafka pod's internal listener (9092) is never exposed
# externally - all external Kafka traffic flows through the APIM Kafka Proxy assertion.
kafka:
  enabled: true

  # Global configuration passed to Kafka subchart
  global:
    # Set to your portal subdomain for advertised listeners
    subdomainPrefix: ""

  # Image configuration
  image:
    kafka: kafka:5.4.2
    autoDiscovery: tls-automator:5.4.2  # Used for Kafka broker discovery (overridden by parent chart's image.autoDiscovery)
    pullPolicy: IfNotPresent

  # Kafka deployment configuration
  kafka:
    # Number of Kafka broker replicas
    # Set to 3 for production deployments with intelligence enabled
    replicaCount: 3

    # Ordinals configuration (Kubernetes 1.27+)
    # Set start ordinal for StatefulSet pods
    # Useful for upgrades from Kafka 3.x (Zookeeper) to 4.0 (KRaft)
    # where old meta.properties had broker.id=1
    ordinals:
      # Start ordinal (default: 0, set to 1 for upgrades from single-pod Zookeeper mode)
      start: 1

    # Additional labels for Kafka pods
    additionalLabels: {}
    # Pod annotations
    podAnnotations: {}
    # Force redeploy by adding timestamp annotation
    forceRedeploy: false
    # Pod affinity rules
    affinity: {}
    # Node selector
    nodeSelector: {}
    # Tolerations
    tolerations: []
    # Pod security context
    podSecurityContext: {}
    # Container security context
    containerSecurityContext: {}
    # Resource requests and limits
    resources: {}
      # requests:
      #   cpu: 100m
      #   memory: 750Mi
      # limits:
      #   cpu: 1000m
      #   memory: 1.5Gi

    # KRaft Mode Configuration (Kafka 4.0.0+)
    kraft:
      # Enable KRaft mode (Zookeeper-less)
      enabled: true
      # Cluster ID for KRaft (auto-generated if empty)
      clusterId: ""
      # Process roles (broker, controller, or both)
      processRoles: "broker,controller"
      # Controller quorum voters (auto-generated based on replicas if empty)
      controllerQuorumVoters: ""

    # Listener Configuration
    listeners:
      # Internal listener for inter-broker and client communication
      internal:
        enabled: true
        port: 9092
        protocol: PLAINTEXT
      # Controller listener for KRaft mode
      controller:
        enabled: true
        port: 9093
        protocol: PLAINTEXT
      # Inter-broker listener name
      interBrokerListenerName: INTERNAL

    # Log retention configuration
    logRetentionHours: 6

    # SASL Authentication Configuration
    sasl:
      # Enable SASL authentication
      enabled: false
      # SASL mechanisms (PLAIN, SCRAM-SHA-256, SCRAM-SHA-512)
      mechanisms: PLAIN
      # Inter-broker SASL mechanism
      interBrokerProtocol: PLAIN
      # JAAS configuration file path
      jaasConfigPath: /opt/ca/kafka/config/kafka_server_jaas.conf

  # Zookeeper configuration (not used in KRaft mode, kept for compatibility)
  zookeeper:
    hostname: zookeeper
    port: 2181

  # Persistence configuration
  persistence:
    storage:
      kafka: 10Gi

  # Service Account
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automountServiceAccountToken: true

# Settings for RabbitMQ - https://github.com/bitnami/charts/tree/master/bitnami/rabbitmq
rabbitmq:
  enabled: true
  host: rabbitmq
  fullnameOverride: rabbitmq
  image:
    registry: caapim
    repository: message-broker
    tag: "5.4.2"
    pullSecrets:
      - broadcom-apim
  pdb:
    create: false
    maxUnavailable: ""
    minAvailable: ""
  serviceAccount:
    create: true
  # name:
  rbac:
    create: true
  persistence:
    enabled: true
  # size: 8Gi
  # Preferred replicas for HA is 3 or odd counts. It should maintain a quorum.
  replicaCount: 3
## Affinity for pod assignment. Evaluated as a template
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## This default will ensure that additional pods are scheduled onto different nodes in your k8s cluster
## For nodes in different availability zones, this means losing one does not impact on availability.
# affinity:
#   podAntiAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#     - labelSelector:
#         matchExpressions:
#         - key: app.kubernetes.io/name
#           operator: In
#           values:
#           - rabbitmq
#       topologyKey: kubernetes.io/hostname
# If RabbitMQ is shut down unintentionally and is stuck in a waiting state set force boot to true
  clustering:
    forceBoot: false
  # MQTT Port.
  service:
    port: 5672
    extraPorts:
    - name: mqtt
      port: 1883
      targetPort: mqtt
  extraContainerPorts:
  - name: mqtt
    containerPort: 1883
  # podSecurityContext:
  #   fsGroup: 1025
  #   runAsUser: 1025
  auth:
    username: user
    # creates a secret for RabbitMQ - this is a custom field
    secretName: rabbitmq-secret
    existingPasswordSecret: rabbitmq-secret
    existingErlangSecret: rabbitmq-secret
    # Set username/password if you don't them to be randomly generated or if you're using an existing RabbitMQ installation.
  # password: 7layereyal7
  # erlangCookie: L7Secure
  extraPlugins: "rabbitmq_web_mqtt"
  loadDefinition:
    enabled: true
    existingSecret: rabbitmq-load-definition
  extraConfiguration: |-
    management.load_definitions = /app/load_definition.json
    mqtt.exchange = portal-external
    mqtt.subscription_ttl = 86400000
    mqtt.prefetch = 1
    disk_free_limit.absolute = 2GB
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  customLivenessProbe:
    exec:
      command:
        - sh
        - -ec
        - curl -f  --user {{ .Values.auth.username }}:$RABBITMQ_PASSWORD 127.0.0.1:{{ .Values.containerPorts.manager }}/api/health/checks/virtual-hosts
  customReadinessProbe:
    exec:
      command:
        - sh
        - -ec
        - curl -f  --user {{ .Values.auth.username }}:$RABBITMQ_PASSWORD 127.0.0.1:{{ .Values.containerPorts.manager }}/api/health/checks/local-alarms

