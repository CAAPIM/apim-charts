# We recommend that MySQL is externalised, the default implementation here is for reference only and is NOT suitable for use
# MySQL Configuration for Portal Chart
# This configuration enables the standalone MySQL StatefulSet
# instead of using the Bitnami MySQL subchart
mysql:
  # Maximum size of one packet or any generated/string string.
  maxAllowedPacket: 128M
  # Image configuration
  image:
    repository: docker.io/mysql
    tag: "8.4.5"
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    type: ClusterIP
    port: 3306
    annotations: {}
    sessionAffinity: ""
    sessionAffinityConfig: {}
    nodePort: ""
    extraPorts: []
    externalTrafficPolicy: ""

  pdb:
    create: false
    maxUnavailable: ""
    minAvailable: ""

  # Persistence configuration
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    subPath: ""
    existingClaim: ""
    selector: {}
    annotations: {}

  # Pod configuration
  podManagementPolicy: "OrderedReady"
  revisionHistoryLimit: 10
  podAnnotations: {}
  podLabels: {}
  schedulerName: ""
  priorityClassName: ""
  terminationGracePeriodSeconds: 30

  # Security contexts
  podSecurityContext:
    fsGroup: 1001
  # runAsUser: 1001
  # runAsNonRoot: true


  containerSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001

  # Resource limits
  resources: {}
  #   requests:
  #     cpu: 250m
  #     memory: 1Gi
  #   limits:
  #     cpu: 1000m
  #     memory: 2Gi

  # Affinity, node selector, and tolerations
  affinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []

  # Probes configuration
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 3

  startupProbe:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30

  # MySQL configuration file (my.cnf)
  # Leave empty to use the default configuration
  configuration: ""
  # Example custom configuration:
  # configuration: |-
  #   [client]
  #   port=3306
  #   socket=/var/lib/mysql/mysql.sock
  #   default-character-set=UTF8MB4
  #   [mysqld]
  #   port=3306
  #   bind-address=0.0.0.0
  #   character-set-server=UTF8MB4
  #   max_allowed_packet=20M

  # Init scripts
  # Scripts to run when MySQL starts for the first time
  # NOTE: This is templated in the ConfigMap, not here
  # The actual SQL is rendered with the correct username value
  initdbScripts: {}


  # Use an existing ConfigMap for init scripts
  initdbScriptsConfigMap: ""

  # Extra environment variables
  extraEnvVars: []
  # Example:
  # extraEnvVars:
  #   - name: TZ
  #     value: "America/New_York"

  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""

  # Extra volumes and volume mounts
  extraVolumes: []
  extraVolumeMounts: []

  # Sidecar containers
  sidecars: []

  # Init containers
  initContainers: []

  # Additional labels for all MySQL resources
  additionalLabels: {}

  # Common annotations for all MySQL resources
  commonAnnotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
