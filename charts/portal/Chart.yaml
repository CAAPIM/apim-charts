apiVersion: v2
appVersion: "5.4.1.3"
description: CA API Developer Portal
name: portal
version: 2.4.7
type: application
home: https://github.com/CAAPIM/apim-charts
maintainers:
  - name: Gazza7205
sources:
  - https://github.com/CAAPIM/apim-charts
dependencies:
- name: druid
  version: ^1.0.0
  condition: portal.analytics.enabled
  repository: "file://../druid"
- name: rabbitmq
  version: 12.0.3
  condition: rabbitmq.enabled
- name: seaweedfs
  version: ^1.0.0
  condition: portal.seaweedFs.enabled
  repository: "file://../seaweedfs"
- name: kafka
  version: ^1.0.2
  condition: kafka.enabled
  repository: "file://../kafka"
- name: ingress-nginx
  repository: "https://kubernetes.github.io/ingress-nginx/"
  version: 4.15.1
  condition: ingress.create
