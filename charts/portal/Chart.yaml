apiVersion: v2
appVersion: "5.4"
description: CA API Developer Portal
name: portal
version: 2.3.27
type: application
home: https://github.com/CAAPIM/apim-charts
maintainers:
  - name: Gazza7205
sources:
  - https://github.com/CAAPIM/apim-charts
dependencies:
- name: druid
  version: ^1.0.0
  condition: portal.analytics.enabled
  repository: "file://../druid"
- name: seaweedfs
  version: ^1.0.0
  condition: global.deepStorage.seaweedfs,portal.intelligence.enabled
  repository: "file://../seaweedfs"
- name: mysql
  version: 12.3.5
  repository: "https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami"
  condition: global.setupDemoDatabase
- name: rabbitmq
  version: 12.0.3
  repository: "https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami"
  condition: rabbitmq.enabled
- name: apim-intelligence
  version: ^1.0.0
  condition: portal.intelligence.enabled
  repository: "file://../intelligence"
- name: kafka
  version: ^1.3.3
  condition: kafka.enabled
  repository: "file://../kafka"
- name: ingress-nginx
  repository: "https://kubernetes.github.io/ingress-nginx/"
  version: 4.12.1
  condition: ingress.create
