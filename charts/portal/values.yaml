##
## Subchart Configuration
##
seaweedfs:
  image: seaweedfs:5.4.1
  persistence:
    storage:
      seaweedfs: 50Gi
  replicaCount: 1
  bucketName: api-metrics
  minio:
    bucketName: api-metrics
  restartPolicy: Always
  imagePullPolicy: Always
  loggingLevel: 1
  imageOverride: null
  clusterDomain: cluster.local

  forceRedeploy: true

   # Core configuration
  idleTimeout: 30  # Connection idle seconds
  dataCenter: ""  # Current volume server's data center name
  rack: ""  # Current volume server's rack name
  whiteList: ""  # Comma separated IP addresses having write permission
  disableHttp: false  # Disable HTTP requests, only gRPC operations are allowed
  metricsPort: 9324  # Prometheus metrics listen port
  metricsIp: ""  # Metrics listen IP. If empty, defaults to bindAddress
  loggingOverrideLevel: null  # Override logging level

  auth:
    secretName: seaweedfs-s3-secret
  # Leave access_key and secret_key empty to auto-generate values.
  # access_key:
  # secret_key:

   # Service configuration
  s3:
    enabled: true  # Whether to enable S3 gateway
    port: 8333
    enableAuth: true
    existingConfigSecret: seaweedfs-s3-secret
  sftp:
    enabled: false  # Whether to enable SFTP server

  filer:
    port: 8888
    grpcPort: 18888
    defaultReplicaPlacement: "000"
    dirListLimit: 100000
    s3:
      enableAuth: true
      createBuckets:
        - name: api-metrics
          anonymousRead: false
        - name: file-storage
          anonymousRead: false
    config: |
      [leveldb2]
      enabled = false

  volume:
    port: 8080
    grpcPort: 18080
    compactionMBps: 50
    minFreeSpacePercent: 7
    dataDirs:
      - name: data-0
        type: "persistentVolumeClaim"
        size: "50Gi"
        maxVolumes: 50

  master:
    port: 9333
    grpcPort: 19333
    config: ""
    volumeSizeLimitMB: 1024

   # Service settings
  service:
    annotations: {}  # Annotations for the service
    type: ClusterIP  # Service type (ClusterIP, NodePort, LoadBalancer)

   # Storage configuration
  data:
    type: "emptyDir"  # Options: "hostPath", "persistentVolumeClaim", "emptyDir"
    hostPathPrefix: /mnt/data  # Path prefix for hostPath volumes
    claimName: seaweedfs-data-pvc  # Name of the PVC to use
    size: ""  # Size of the PVC
    storageClass: ""  # Storage class for the PVC

   # Health checks
  readinessProbe:
    enabled: true
    httpGet:
      path: /cluster/status
      port: 9333
    scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 40
    successThreshold: 1
    failureThreshold: 6
    timeoutSeconds: 40

  livenessProbe:
    enabled: true
    httpGet:
      path: /cluster/status
      port: 9333
    scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 40
    successThreshold: 1
    failureThreshold: 6
    timeoutSeconds: 40

   # Enable if replica count > 1
  startupProbe:
    enabled: true
    httpGet:
      path: /cluster/status
      port: 9333
    scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 15
    timeoutSeconds: 40

   # Additional resources
  extraEnvironmentVars: {}  # Additional environment variables
  extraVolumeMounts: ""  # Additional volume mounts
  extraVolumes: ""  # Additional volumes
  initContainers: ""  # Init containers
  sidecars: ""  # Sidecar containers
  annotations: {}  # Annotations for the deployment
  podAnnotations: {}  # Annotations for the pods
  podLabels: {}  # Labels for the pods

   # Scheduling configuration
  # Affinity Settings
  # Commenting out or setting as empty the affinity variable, will allow
  # deployment to single node services such as Minikube
  # affinity: |
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - labelSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: seaweedfs"
  #             app.kubernetes.io/instance: {{ .Release.Name }}
  #             app.kubernetes.io/component: master
  #         topologyKey: kubernetes.io/hostname

   # Topology Spread Constraints Settings
  # This should map directly to the value of the topologySpreadConstraints
  # for a PodSpec. By Default no constraints are set.
  topologySpreadConstraints: ""

   # Toleration Settings for master pods
  # This should be a multi-line string matching the Toleration array
  # in a PodSpec.
  tolerations: ""

   # nodeSelector labels for master pod assignment, formatted as a muli-line string.
  # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
  nodeSelector: {}

   # Used to assign priority to master pods
  # ref: https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/
  priorityClassName: ""

   # Used to assign a service account.
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  serviceAccountName: ""

   # Configure security context for Pod
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # Example:
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  # podSecurityContext: {}

   # Configure security context for Container
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # Example:
  # containerSecurityContext:
  #   enabled: true
  #   runAsUser: 2000
  #   allowPrivilegeEscalation: false
  containerSecurityContext: {}

   # Resource management
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

# Settings for Druid - this is a local sub chart
druid:
  enabled: true
  # Service Account for Druid services
  serviceAccount:
    create: true
  # name:
  persistence:
    storage:
      historical: 50Gi
      minio: 40Gi
      zookeeper: 10Gi
  # Kafka configuration for druid ingestion service
  kafka:
    # Reference to Kafka broker service name (deployed as separate subchart)
    brokerService: kafka
    # Kafka broker port
    brokerPort: 9092
    # Kafka replication count (should match kafka.kafka.replicaCount)
    replicaCount: 1

  minio:
    forceRedeploy: false
    pdb:
      create: false
      maxUnavailable: ""
      minAvailable: ""
    # consider changing to mode... standalone/distributed.
    # Once Portal is installed, minio can not be scaled up or down.
    replicaCount: 1
    # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    podAnnotations: {}
    # ref:https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
    podSecurityContext: {}
    # ref:https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
    containerSecurityContext: {}
    image:
      pullPolicy: IfNotPresent
    auth:
      secretName: minio-secret
    # Leave access_key and secret_key empty to auto-generate values.
    # access_key:
    # secret_key:
    cloudStorage: false
    bucketName: api-metrics

## Use minio as Amazon S3 (Simple Storage Service) gateway
## https://docs.minio.io/docs/minio-gateway-for-s3
    s3gateway:
      enabled: false
      serviceEndpoint: ""
      accessKey: ""
      secretKey: ""

## Use minio as GCS (Google Cloud Storage) gateway
## https://docs.minio.io/docs/minio-gateway-for-gcs
    gcsgateway:
      enabled: false
      # credential json file of service account key
      gcsKeyJson: ""
      # Google cloud project-id
      projectId: ""

