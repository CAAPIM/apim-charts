# Configuration for the custom Kafka subchart
kafka: &kafka_config
  # Enable/disable Kafka deployment
  # Automatically enabled when analytics or intelligence is enabled
  # Set to false to explicitly disable Kafka even when analytics/intelligence are enabled
  enabled: true

  # Override the full name to make Kafka accessible as 'kafka' instead of '<release>-portal-kafka'
  #fullnameOverride: kafka

  # Global configuration passed to Kafka subchart
  global:
    # Set to your portal subdomain for advertised listeners
    subdomainPrefix: ""

  # Image configuration
  image:
    kafka: kafka:5.4.1
    autoDiscovery: tls-automator:5.4.1  # Used for Kafka broker discovery (overridden by parent chart's image.autoDiscovery)
    pullPolicy: IfNotPresent

  # Kafka deployment configuration
  kafka:
    # Number of Kafka broker replicas
    # Set to 3 for production deployments with intelligence enabled
    replicaCount: 1

    # Ordinals configuration (Kubernetes 1.27+)
    # Set start ordinal for StatefulSet pods
    # Useful for upgrades from Kafka 3.x (Zookeeper) to 4.0 (KRaft)
    # where old meta.properties had broker.id=1
    ordinals:
      # Start ordinal (default: 0, set to 1 for upgrades from single-pod Zookeeper mode)
      start: 1

    # Additional labels for Kafka pods
    additionalLabels: {}
    # Pod annotations
    podAnnotations: {}
    # Force redeploy by adding timestamp annotation
    forceRedeploy: false
    # Pod affinity rules
    affinity: {}
    # Node selector
    nodeSelector: {}
    # Tolerations
    tolerations: []
    # Pod security context
    podSecurityContext: {}
    # Container security context
    containerSecurityContext: {}
    # Resource requests and limits
    resources: {}
      # requests:
      #   cpu: 100m
      #   memory: 750Mi
      # limits:
      #   cpu: 1000m
      #   memory: 1.5Gi

    # KRaft Mode Configuration (Kafka 4.0.0+)
    kraft:
      # Enable KRaft mode (Zookeeper-less)
      enabled: true
      # Cluster ID for KRaft (auto-generated if empty)
      clusterId: ""
      # Process roles (broker, controller, or both)
      processRoles: "broker,controller"
      # Controller quorum voters (auto-generated based on replicas if empty)
      controllerQuorumVoters: ""

    # Listener Configuration
    listeners:
      # Internal listener for inter-broker and client communication
      internal:
        enabled: true
        port: 9092
        protocol: PLAINTEXT
      # External listener for clients outside the cluster (third-party agents)
      # NOTE: Automatically controlled by kafka.externalAccess.enabled
      # External listener is created only when intelligence is enabled
      external:
        port: 9094
        protocol: SSL
      # Controller listener for KRaft mode
      controller:
        enabled: true
        port: 9093
        protocol: PLAINTEXT
      # Inter-broker listener name
      interBrokerListenerName: INTERNAL

    # Log retention configuration
    logRetentionHours: 6

    # TLS/SSL Configuration
    tls:
      # Enable TLS/SSL - enabled by default for external SSL support
      enabled: true
      # TLS type (PEM or JKS)
      type: PEM
      # Client authentication (none, requested, required)
      clientAuth: required
      # Secret containing TLS certificates (via environment variables)
      # Leave empty to use volume-mounted certificates from internalSecretName instead
      secretName: ""
      # Keys in the secret
      keystoreKeyKey: "keystore.key"
      truststoreCertKey: "truststore.pem"
      # Password secret for encrypted keys
      passwordSecretName: ""
      passwordSecretKey: "keypass.txt"

    # SASL Authentication Configuration
    sasl:
      # Enable SASL authentication
      enabled: false
      # SASL mechanisms (PLAIN, SCRAM-SHA-256, SCRAM-SHA-512)
      mechanisms: PLAIN
      # Inter-broker SASL mechanism
      interBrokerProtocol: PLAIN
      # JAAS configuration file path
      jaasConfigPath: /opt/ca/kafka/config/kafka_server_jaas.conf

  # Zookeeper configuration (not used in KRaft mode, kept for compatibility)
  zookeeper:
    hostname: zookeeper
    port: 2181

  # Persistence configuration
  persistence:
    storage:
      kafka: 10Gi

  # Service Account
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automountServiceAccountToken: true

  # External access configuration for autodiscovery
  # NOTE: External access is automatically enabled when portal.intelligence.enabled is true
  # Intelligence requires external Kafka access for third-party agents
  # Default is false. Set to true manually or enable intelligence feature.
  externalAccess:
    enabled: false
    # Service type for external access (LoadBalancer or NodePort)
    serviceType: LoadBalancer
    # Port for external access
    port: 9094
    # Hostname/domain for external access (used in advertised listeners)
    hostname: ""
    # Annotations for external services
    annotations:
      cloud.google.com/load-balancer-type: Internal
    # LoadBalancer IPs (optional, for static IPs)
    loadBalancerIPs: []
    # NodePort values (optional, for NodePort service type)
    nodePorts: []
    # Auto-generate advertised listeners based on service IPs
    autoAdvertisedListeners: true
    # Discovery configuration for LoadBalancer/NodePort IP detection
    # NOTE: This only applies when externalAccess.enabled is true (i.e., when intelligence is enabled)
    # When intelligence is disabled, Kafka uses internal-only listeners and will start normally
    discovery:
      # Maximum time to wait for LoadBalancer IP (in seconds)
      # Increase this if your cloud provider takes longer to provision LoadBalancers
      timeoutSeconds: 120
      # Retry interval (in seconds)
      retryIntervalSeconds: 5
      # Fail fast: If true, pod will fail when LoadBalancer IP cannot be discovered
      # This prevents Kafka from starting with incorrect advertised listeners
      # IMPORTANT: Only affects behavior when intelligence is enabled
      # Recommended: true (prevents connection issues for external clients)
      failOnDiscoveryFailure: true

# Settings for RabbitMQ - https://github.com/bitnami/charts/tree/master/bitnami/rabbitmq
rabbitmq: &rabbitmq_config
  enabled: true
  host: rabbitmq
  fullnameOverride: rabbitmq
  image:
    registry: caapim
    repository: message-broker
    tag: "5.4.1"
    pullSecrets:
      - broadcom-apim
  pdb:
    create: false
    maxUnavailable: ""
    minAvailable: ""
  serviceAccount:
    create: true
  # name:
  rbac:
    create: true
  persistence:
    enabled: true
  # size: 8Gi
  replicaCount: 1
## Affinity for pod assignment. Evaluated as a template
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## This default will ensure that additional pods are scheduled onto different nodes in your k8s cluster
## For nodes in different availability zones, this means losing one does not impact on availability.
# affinity: {}
# If RabbitMQ is shut down unintentionally and is stuck in a waiting state set force boot to true
  clustering:
    forceBoot: false
# MQTT Port.
  service:
    port: 5672
    extraPorts:
    - name: mqtt
      port: 1883
      targetPort: mqtt
  extraContainerPorts:
  - name: mqtt
    containerPort: 1883
  # podSecurityContext:
  #   fsGroup: 1025
  #   runAsUser: 1025
  auth:
    username: user
    # creates a secret for RabbitMQ - this is a custom field
    secretName: rabbitmq-secret
    existingPasswordSecret: rabbitmq-secret
    existingErlangSecret: rabbitmq-secret
    # Set username/password if you don't them to be randomly generated or if you're using an existing RabbitMQ installation.
  # password: 7layereyal7
  # erlangCookie: L7Secure
  extraPlugins: "rabbitmq_web_mqtt"
  loadDefinition:
    enabled: true
    existingSecret: rabbitmq-load-definition
  extraConfiguration: |-
    management.load_definitions = /app/load_definition.json
    mqtt.exchange = portal-external
    mqtt.subscription_ttl = 86400000
    mqtt.prefetch = 1
    disk_free_limit.absolute = 2GB
  resources:
    limits: {}
    # cpu: 1000m
    # memory: 2Gi
    requests: {}
    # cpu: 1000m
    # memory: 2Gi
  customLivenessProbe:
    exec:
      command:
        - sh
        - -ec
        - curl -f  --user {{ .Values.auth.username }}:$RABBITMQ_PASSWORD 127.0.0.1:{{ .Values.containerPorts.manager }}/api/health/checks/virtual-hosts
  customReadinessProbe:
    exec:
      command:
        - sh
        - -ec
        - curl -f  --user {{ .Values.auth.username }}:$RABBITMQ_PASSWORD 127.0.0.1:{{ .Values.containerPorts.manager }}/api/health/checks/local-alarms

# Settings for the intelligence subchart
apim-intelligence:
  # Use a YAML alias (*) to reference the Kafka configuration from above.
  # This avoids duplicating the configuration and ensures the intelligence
  # subchart has the correct values for broker discovery.
  kafka: *kafka_config
  rabbitmq: *rabbitmq_config

  # NOTE: Do NOT set portal.domain here - it will override user values
  # Intelligence will automatically use portal.domain from parent chart if available
  # Jenkins must set: portal.domain AND apim-intelligence.portal.domain to the same value

  # Image configuration
  image:
    autoDiscovery: tls-automator:5.4.1  # Used for Kafka broker discovery init container (Overridden by Jenkins with TAG_TLS_MANAGER)
    intelligenceServer: intelligence-server:5.4.1
    pullPolicy: IfNotPresent

  # RBAC configuration
  rbac:
    create: true

  # Service Account configuration
  serviceAccount:
    create: true
    automountServiceAccountToken: true
    name: ""

  intelligenceServer:
    # Configuration for the Intelligence Server.
    kafka:
      # A list of external advertised Kafka brokers.
      # externalAdvertisedBrokers:
      # Configuration for Kafka broker auto-discovery.
      autoDiscovery:
        # Enables or disables Kafka broker auto-discovery.
        enabled: true
        image:
          # The repository of the auto-discovery image.
          repository: "docker.io/bitnami/kubectl"
          # The tag of the auto-discovery image.
          tag: "1.33.3-debian-12-r0"
          # The pull policy for the auto-discovery image.
          pullPolicy: IfNotPresent
        # Resource requests and limits for the auto-discovery init container
        # resources: {}
      # Configuration for the Kafka CA certificate.
      kafkaCa:
        # The name of the secret containing the Kafka CA certificate.
        caSecretName: *externalSecretName
        # The name of the secret containing the password for the Kafka CA certificate.
        passwordSecretName: *externalSecretName
        # The key in the password secret that contains the password.
        passwordSecretKey: "keypass.txt"
    forceRedeploy: false
    pdb:
      create: false
      maxUnavailable: ""
      minAvailable: ""
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    podAnnotations: {}
    # ref:https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
    podSecurityContext: {}
    # ref:https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
    containerSecurityContext: {}
    resources:
      requests: {}
      # memory: 4Gi
      limits: {}
      # memory: 4Gi
    # nodeSelector: {}
    # tolerations: []
    # affinity: {}

# Settings for Nginx-Ingress - https://github.com/kubernetes/ingress-nginx/tree/master/charts/ingress-nginx
ingress-nginx:
  podSecurityPolicy:
    enabled: true
  serviceAccount:
    create: true
  # name:
  rbac:
    create: true
  controller:
    config:
      # 30MB is the max file size we allow for the custom pages and 15MB for GW Bundle.so max is set to 32
      proxy-body-size: "32m"
    publishService:
      enabled: true
    extraArgs:
      enable-ssl-passthrough: true
