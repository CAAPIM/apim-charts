{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka.fullname" . }}-controller-config
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.controller.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    app.kubernetes.io/component: controller
data:
  SERVICE_NAME: {{ include "kafka.fullname" . }}-controller
  
  # Portal subdomain for advertised listeners
  {{- if .Values.global.subdomainPrefix }}
  APIM_PORTAL_SUBDOMAIN: {{ .Values.global.subdomainPrefix | quote }}
  {{- end }}
  
  # ============================================
  # KRaft Mode Configuration (Controller Only)
  # ============================================
  
  # KRaft cluster ID (must match broker cluster ID)
  {{- if .Values.kafka.kraft.clusterId }}
  KAFKA_CLUSTER_ID: {{ .Values.kafka.kraft.clusterId | quote }}
  {{- end }}
  
  # Process roles (controller only)
  KAFKA_CFG_PROCESS_ROLES: {{ .Values.controller.kraft.processRoles | quote }}
  
  # Controller listener names
  KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  
  # Controller quorum voters (includes both brokers and controllers in combined mode, or controllers only in separate mode)
  {{- if .Values.controller.kraft.controllerQuorumVoters }}
  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: {{ .Values.controller.kraft.controllerQuorumVoters | quote }}
  {{- else }}
  # Auto-generate controller quorum voters for separate controller nodes
  {{- $fullName := include "kafka.fullname" . }}
  {{- $controllerReplicaCount := int .Values.controller.replicaCount }}
  {{- $brokerReplicaCount := int .Values.kafka.replicaCount }}
  {{- $controllerPort := int .Values.kafka.listeners.controller.port }}
  {{- $voters := list }}
  {{- range $i := until $controllerReplicaCount }}
  {{- $nodeId := add $i $brokerReplicaCount }}
  {{- $voters = append $voters (printf "%d@%s-controller-%d.%s-controller:%d" $nodeId $fullName $i $fullName $controllerPort) }}
  {{- end }}
  KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: {{ join "," $voters | quote }}
  {{- end }}
  
  # ============================================
  # Listener Configuration (Controller Only)
  # ============================================
  
  # Controller listener only
  KAFKA_CFG_LISTENERS: "CONTROLLER://0.0.0.0:{{ .Values.kafka.listeners.controller.port }}"
  
  # Listener security protocol map
  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:{{ .Values.kafka.listeners.controller.protocol }}"
  
  # ============================================
  # Log Retention Configuration
  # ============================================
  KAFKA_CFG_LOG_RETENTION_HOURS: {{ .Values.kafka.logRetentionHours | quote }}
  
  # ============================================
  # SSL/TLS Configuration
  # ============================================
  {{- if .Values.kafka.tls.enabled }}
  KAFKA_TLS_TYPE: {{ .Values.kafka.tls.type | quote }}
  KAFKA_CFG_SSL_CLIENT_AUTH: {{ .Values.kafka.tls.clientAuth | quote }}
  KAFKA_CFG_SSL_KEYSTORE_TYPE: {{ .Values.kafka.tls.type | quote }}
  KAFKA_CFG_SSL_TRUSTSTORE_TYPE: {{ .Values.kafka.tls.type | quote }}
  
  # Certificate content (inline environment variables)
  {{- if .Values.kafka.tls.truststoreCertContent }}
  KAFKA_CFG_SSL_TRUSTSTORE_CERTIFICATES: {{ .Values.kafka.tls.truststoreCertContent | quote }}
  {{- end }}
  {{- if .Values.kafka.tls.keystoreKeyContent }}
  KAFKA_CFG_SSL_KEYSTORE_KEY: {{ .Values.kafka.tls.keystoreKeyContent | quote }}
  {{- end }}
  
  # Alternative: CA certificate variables
  {{- if .Values.kafka.tls.caKey }}
  KAFKA_CA_KEY: {{ .Values.kafka.tls.caKey | quote }}
  {{- end }}
  {{- if .Values.kafka.tls.caCertificate }}
  KAFKA_CA_CERTIFICATE: {{ .Values.kafka.tls.caCertificate | quote }}
  {{- end }}
  {{- if .Values.kafka.tls.caTruststoreCertificate }}
  KAFKA_CA_TRUSTSTORE_CERTIFICATE: {{ .Values.kafka.tls.caTruststoreCertificate | quote }}
  {{- end }}
  {{- end }}
  
  # ============================================
  # SASL Authentication Configuration
  # ============================================
  {{- if .Values.kafka.sasl.enabled }}
  KAFKA_CFG_SASL_ENABLED_MECHANISMS: {{ .Values.kafka.sasl.mechanisms | quote }}
  KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: {{ .Values.kafka.sasl.interBrokerProtocol | quote }}
  KAFKA_CFG_OPTS: "-Djava.security.auth.login.config={{ .Values.kafka.sasl.jaasConfigPath }}"
  {{- end }}
{{- end }}

