{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.fullname" . }}-controller
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.controller.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    app.kubernetes.io/component: controller
spec:
  serviceName: {{ include "kafka.fullname" . }}-controller
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
        {{- range $key, $val := .Values.global.additionalLabels }}
        {{ $key }}: "{{ $val }}"
        {{- end }}
        {{- range $key, $val := .Values.controller.additionalLabels }}
        {{ $key }}: "{{ $val }}"
        {{- end }}
        app.kubernetes.io/component: controller
      annotations:
        {{- if .Values.controller.forceRedeploy }}
        rollme: {{ randAlphaNum 5 | quote }}
        {{- end }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kafka.serviceAccountName" . }}
      containers:
      - name: kafka-controller
        image: {{ .Values.global.portalRepository }}{{ .Values.image.kafka }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: controller
          containerPort: {{ .Values.kafka.listeners.controller.port }}
          protocol: TCP
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Override process roles for controller-only nodes
        - name: KAFKA_CFG_PROCESS_ROLES
          value: {{ .Values.controller.kraft.processRoles | quote }}
        # Controller-specific node ID calculation
        - name: KAFKA_CFG_NODE_ID_COMMAND
          value: |
            CONTROLLER_ORDINAL=$(echo $HOSTNAME | rev | cut -d "-" -f 1)
            # Controller node IDs start after broker node IDs
            echo $((CONTROLLER_ORDINAL + {{ .Values.kafka.replicaCount }}))
        envFrom:
        - configMapRef:
            name: {{ include "kafka.fullname" . }}-controller-config
        {{- if .Values.kafka.tls.enabled }}
        {{- if .Values.kafka.tls.secretName }}
        - secretRef:
            name: {{ .Values.kafka.tls.secretName }}
        {{- end }}
        {{- if .Values.kafka.tls.passwordSecretName }}
        - secretRef:
            name: {{ .Values.kafka.tls.passwordSecretName }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: controller-data
          mountPath: /opt/ca/kafka/data
        {{- if .Values.kafka.tls.enabled }}
        {{- if .Values.kafka.tls.secretName }}
        - name: tls-certs
          mountPath: /opt/ca/kafka/certs
          readOnly: true
        {{- end }}
        {{- end }}
        {{- with .Values.controller.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.controller.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          tcpSocket:
            port: controller
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: controller
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      {{- if .Values.kafka.tls.enabled }}
      {{- if .Values.kafka.tls.secretName }}
      - name: tls-certs
        secret:
          secretName: {{ .Values.kafka.tls.secretName }}
      {{- end }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: controller-data
      labels:
        {{- include "kafka.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.global.storageClass }}
      storageClassName: {{ .Values.global.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.storage.controller | default "5Gi" }}
{{- end }}

