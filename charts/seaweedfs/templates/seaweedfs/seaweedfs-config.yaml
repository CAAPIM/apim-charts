apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: seaweedfs-s3
    chart: {{ template "druid.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- if .Values.master.annotations }}
  annotations:
    {{- toYaml .Values.master.annotations | nindent 4 }}
{{- end }}
data:
  master.toml: |-
    {{ .Values.master.config | nindent 4 }}
  filer.toml: |-
    [filer.options]
    recursive_delete = false

    [mysql]
    enabled = true
{{ if .Values.global.setupDemoDatabase}}
    hostname = "{{ .Release.Name }}-mysql-headless"
{{ else }}
    hostname = "{{ .Values.global.databaseHost }}"
{{ end }}
    port = {{ include "database-port" . }}
    user = "{{ required "Please fill in databaseUsername in values.yaml" .Values.global.databaseUsername }}"
    password = "${WEED_MYSQL_PASSWORD}"
    database = "{{ include "portal-db-name" . }}"
    connection_max_idle = 10
    connection_max_open = 100
    connection_max_lifetime_seconds = 0
    interpolateParams = true
    allowFallbackToPlaintext = true
  