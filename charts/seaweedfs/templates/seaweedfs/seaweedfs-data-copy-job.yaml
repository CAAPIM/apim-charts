{{- if (eq .Values.global.deepStorage.enableDataMigration true) }}
# Data Migration Job: MinIO → SeaweedFS (Sidecar MinIO SNMD + S3-to-S3)
#
# How it works:
#   1. init container: waits for SeaweedFS master to be ready (TCP probe).
#   2. sidecar container (minio-local): starts the MinIO binary in Single-Node
#      Multi-Drive (SNMD) mode with all original MinIO PVCs mounted. MinIO
#      reconstructs erasure-coded objects and serves them via S3 at localhost:9000.
#      Exits cleanly when data-copier writes /shared/migration-done.
#   3. main container (data-copier): waits for localhost:9000 to be healthy, then
#      uses rclone S3-to-S3 (local MinIO → SeaweedFS), verifies integrity, deletes
#      all MinIO PVCs, and signals the sidecar to stop.
#
# This works for BOTH standalone (minio.replicaCount: 1) and distributed MinIO
# (minio.replicaCount: 4). SNMD mode uses the same on-disk XL erasure format as
# distributed mode and can reconstruct objects from the original drive set.
# No original MinIO credentials or Kubernetes Service needed.
#
# Prerequisites:
#   - druid.minio.enabled: false  (MinIO StatefulSet not running; RWO PVCs released)
#   - seaweedfs.minio.replicaCount must match the original druid.minio.replicaCount
#   - seaweedfs.minio.image must match druid.image.minio
#   - For fresh 5.4.2 installs (no prior MinIO data), keep enableDataMigration: false
#
# Upgrade command:
#   helm upgrade <release> <chart> \
#     --set druid.minio.enabled=false \
#     --set global.deepStorage.enableDataMigration=true \
#     --set seaweedfs.minio.replicaCount=<original-replica-count> \
#     --set seaweedfs.minio.image=minio:5.4.1
#
# After migration completes:
#   helm upgrade <release> <chart> --set global.deepStorage.enableDataMigration=false
#
# Monitoring:
#   kubectl get job {{ .Release.Name }}-seaweedfs-data-copy-job -n {{ .Release.Namespace }}
#   kubectl logs job/{{ .Release.Name }}-seaweedfs-data-copy-job -c wait-for-seaweedfs -n {{ .Release.Namespace }}
#   kubectl logs job/{{ .Release.Name }}-seaweedfs-data-copy-job -c minio-local -n {{ .Release.Namespace }}
#   kubectl logs job/{{ .Release.Name }}-seaweedfs-data-copy-job -c data-copier -n {{ .Release.Namespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "seaweedfs.fullname" . }}-seaweedfs-data-copy-job
  labels:
    app: {{ template "seaweedfs.name" . }}
    chart: {{ template "seaweedfs.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: data-migration
    migration-source: minio-pvc
    migration-target: seaweedfs
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 5
  suspend: false
  parallelism: 1
  template:
    metadata:
    spec:
      serviceAccountName: {{ include "seaweedfs.serviceAccountName" . }}
      restartPolicy: "OnFailure"
      {{- if .Values.global.pullSecret }}
      imagePullSecrets:
      - name: "{{ .Values.global.pullSecret }}"
      {{- end }}
      initContainers:
        - name: wait-for-seaweedfs
          image: "{{ .Values.global.portalRepository }}{{ .Values.image }}"
          command:
            - /bin/bash
            - -c
            - |
              MAX_WAIT={{ .Values.global.deepStorage.migrationInitialDelaySeconds }}
              RETRY_INTERVAL=10
              ELAPSED=0

              echo "Waiting for SeaweedFS master at seaweedfs-s3:{{ .Values.readinessProbe.httpGet.port }}..."
              while [ $ELAPSED -lt $MAX_WAIT ]; do
                if timeout 5 bash -c ">/dev/tcp/seaweedfs-s3/{{ .Values.readinessProbe.httpGet.port }}" 2>/dev/null; then
                  echo "SeaweedFS is ready."
                  exit 0
                fi
                echo "Not ready yet, retrying in ${RETRY_INTERVAL}s... (elapsed: ${ELAPSED}s / max: ${MAX_WAIT}s)"
                sleep $RETRY_INTERVAL
                ELAPSED=$((ELAPSED + RETRY_INTERVAL))
              done

              echo "ERROR: SeaweedFS did not become ready within ${MAX_WAIT} seconds."
              exit 1
      containers:
        # Sidecar: starts MinIO in SNMD mode reading from original PVC(s).
        # Serves reconstructed objects via S3 at localhost:9000.
        # Watches /shared/migration-done and exits when data-copier signals completion.
        - name: minio-local
          image: "{{ .Values.global.portalRepository }}{{ .Values.minio.image }}"
          command:
            - /bin/sh
            - -c
            - |
              COUNT={{ .Values.minio.replicaCount }}
              DRIVES=""
              for i in $(seq 0 $((COUNT - 1))); do
                DRIVES="$DRIVES /mnt/minio-$i"
              done

              echo "Starting MinIO SNMD with drives:${DRIVES}"
              minio server $DRIVES &
              MINIO_PID=$!

              echo "MinIO started (PID: ${MINIO_PID}). Waiting for migration-done signal..."
              while [ ! -f /shared/migration-done ]; do
                sleep 5
              done

              echo "Signal received. Stopping MinIO (PID: ${MINIO_PID})."
              kill $MINIO_PID 2>/dev/null
              wait $MINIO_PID 2>/dev/null || true
              exit 0
          env:
            - name: MINIO_ACCESS_KEY
              value: migration-user
            - name: MINIO_SECRET_KEY
              value: migration-pass-tmp
          volumeMounts:
            - name: migration-signal
              mountPath: /shared
            {{- range $i := until (int .Values.minio.replicaCount) }}
            - name: minio-data-{{ $i }}
              mountPath: /mnt/minio-{{ $i }}
            {{- end }}

        # Main: waits for local MinIO, copies S3-to-S3, verifies, deletes PVC(s), signals sidecar.
        - name: data-copier
          image: "{{ .Values.global.portalRepository }}{{ .Values.image }}"
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # --- Step 0: Wait for local MinIO sidecar ---
              echo "Waiting for local MinIO to become healthy at localhost:9000..."
              MAX_MINIO_WAIT=300
              ELAPSED=0
              until curl -sf http://localhost:9000/minio/health/live 2>/dev/null; do
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                if [ $ELAPSED -ge $MAX_MINIO_WAIT ]; then
                  echo "ERROR: Local MinIO did not become healthy within ${MAX_MINIO_WAIT}s."
                  echo "Check the minio-local container logs for startup errors."
                  exit 1
                fi
                echo "MinIO not ready yet... (${ELAPSED}s / ${MAX_MINIO_WAIT}s)"
              done
              echo "Local MinIO is healthy."

              echo "========================================"
              echo "  MinIO → SeaweedFS Migration"
              echo "  Source : minio:/{{ .Values.minio.bucketName }} (localhost:9000)"
              echo "  Target : seaweedfs:/{{ .Values.global.deepStorage.analytics.bucketName }}"
              echo "  Drives : {{ .Values.minio.replicaCount }} PVC(s)"
              echo "========================================"

              # --- Step 1: Copy ---
              echo "--- Step 1: Copy ---"
              rclone copy \
                "minio:/{{ .Values.minio.bucketName }}" \
                "seaweedfs:/{{ .Values.global.deepStorage.analytics.bucketName }}" \
                --checksum \
                --transfers 16 \
                --retries 30 \
                --retries-sleep 10s \
                --low-level-retries 10 \
                --stats 5s \
                --stats-one-line \
                -vv \
                --progress

              # --- Step 2: Verify (one-way check source ⊆ destination) ---
              echo "--- Step 2: Verify (one-way check) ---"
              rclone check \
                "minio:/{{ .Values.minio.bucketName }}" \
                "seaweedfs:/{{ .Values.global.deepStorage.analytics.bucketName }}" \
                --one-way \
                -v

              # --- Step 3: Delete all MinIO PVC(s) ---
              echo "--- Step 3: Delete MinIO PVC(s) ---"
              COUNT={{ .Values.minio.replicaCount }}
              for i in $(seq 0 $((COUNT - 1))); do
                kubectl delete pvc "{{ .Values.minio.pvcBaseName }}-${i}" \
                  -n {{ .Release.Namespace }} \
                  --ignore-not-found \
                  && echo "Deleted {{ .Values.minio.pvcBaseName }}-${i}." \
                  || echo "WARNING: {{ .Values.minio.pvcBaseName }}-${i} may already be removed."
              done

              # --- Step 4: Signal sidecar to stop ---
              echo "--- Step 4: Signalling minio-local sidecar to exit ---"
              touch /shared/migration-done

              echo "========================================"
              echo "  Migration completed successfully!"
              echo "  Run: helm upgrade <release> <chart>"
              echo "    --set global.deepStorage.enableDataMigration=false"
              echo "========================================"
          env:
            - name: SEAWEEDFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_access_key_id
            - name: SEAWEEDFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_secret_access_key
            - name: RCLONE_CONFIG_MINIO_TYPE
              value: s3
            - name: RCLONE_CONFIG_MINIO_PROVIDER
              value: Minio
            - name: RCLONE_CONFIG_MINIO_ENDPOINT
              value: http://localhost:9000
            - name: RCLONE_CONFIG_MINIO_ACCESS_KEY_ID
              value: migration-user
            - name: RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY
              value: migration-pass-tmp
            - name: RCLONE_CONFIG_MINIO_ENV_AUTH
              value: "false"
            - name: RCLONE_CONFIG_SEAWEEDFS_TYPE
              value: s3
            - name: RCLONE_CONFIG_SEAWEEDFS_PROVIDER
              value: SeaweedFS
            - name: RCLONE_CONFIG_SEAWEEDFS_ENDPOINT
              value: http://seaweedfs-s3:8333
            - name: RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID
              value: $(SEAWEEDFS_ACCESS_KEY)
            - name: RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY
              value: $(SEAWEEDFS_SECRET_KEY)
            - name: RCLONE_CONFIG_SEAWEEDFS_ENV_AUTH
              value: "false"
          volumeMounts:
            - name: migration-signal
              mountPath: /shared
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 4Gi
      restartPolicy: "OnFailure"
{{ end }}