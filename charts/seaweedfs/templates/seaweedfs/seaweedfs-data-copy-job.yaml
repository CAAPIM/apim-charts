{{- if (eq .Values.global.deepStorage.enableDataMigration true) }}
# Data Migration Job: MinIO PVC → SeaweedFS (filesystem-to-S3)
#
# This Job migrates analytics data from a legacy MinIO PVC directly into SeaweedFS
# WITHOUT requiring the MinIO service to be running. The old MinIO PVC
# (minio-vol-claim-minio-0) is mounted read-only and rclone copies its content
# into SeaweedFS over the S3 gateway. After a successful copy + verification,
# the MinIO PVC is deleted automatically.
#
# Prerequisites:
#   - druid.minio.enabled must be false (MinIO StatefulSet must not be running
#     so the RWO PVC is released and can be mounted by this Job)
#   - The MinIO PVC (minio-vol-claim-minio-0) must exist from a previous install
#     For fresh 5.4.2 installs, set enableDataMigration: false — no PVC will exist.
#   - Standalone MinIO only (replicaCount: 1). Distributed MinIO (replicaCount > 1)
#     uses erasure coding across multiple PVCs; see MINIO-TO-SEAWEEDFS-MIGRATION.md
#     for the recommended path in that case.
#
# Usage:
#   Upgrade from 5.3 or 5.4 (with MinIO data):
#     helm upgrade <release> <chart> --set druid.minio.enabled=false \
#       --set global.deepStorage.enableDataMigration=true
#   After migration completes:
#     helm upgrade <release> <chart> --set global.deepStorage.enableDataMigration=false
#
# Monitoring:
#   kubectl get job <release>-seaweedfs-data-copy-job -n <namespace>
#   kubectl logs job/<release>-seaweedfs-data-copy-job -n <namespace> -c wait-for-seaweedfs
#   kubectl logs job/<release>-seaweedfs-data-copy-job -n <namespace> -c data-copier
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "portal.fullname" . }}-seaweedfs-data-copy-job
  labels:
    app: {{ template "portal.name" . }}
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: data-migration
    migration-source: minio-pvc
    migration-target: seaweedfs
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 5
  suspend: false
  parallelism: 1
  template:
    metadata:
    spec:
      serviceAccountName: {{ include "seaweedfs.serviceAccountName" . }}
      restartPolicy: "OnFailure"
      {{- if .Values.global.pullSecret }}
      imagePullSecrets:
      - name: "{{ .Values.global.pullSecret }}"
      {{- end }}
      initContainers:
        - name: wait-for-seaweedfs
          image: "{{ .Values.global.portalRepository }}{{ .Values.image }}"
          command:
            - /bin/bash
            - -c
            - |
              MAX_WAIT={{ .Values.global.deepStorage.migrationInitialDelaySeconds }}
              RETRY_INTERVAL=10
              ELAPSED=0

              echo "Waiting for SeaweedFS master to become ready at seaweedfs-s3:{{ .Values.readinessProbe.httpGet.port }}..."
              while [ $ELAPSED -lt $MAX_WAIT ]; do
                if timeout 5 bash -c ">/dev/tcp/seaweedfs-s3/{{ .Values.readinessProbe.httpGet.port }}" 2>/dev/null; then
                  echo "SeaweedFS is ready."
                  break
                fi
                echo "SeaweedFS not ready yet, retrying in ${RETRY_INTERVAL}s... (elapsed: ${ELAPSED}s / max: ${MAX_WAIT}s)"
                sleep $RETRY_INTERVAL
                ELAPSED=$((ELAPSED + RETRY_INTERVAL))
              done

              if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "ERROR: SeaweedFS did not become ready within ${MAX_WAIT} seconds."
                exit 1
              fi

              # Check whether there is any data to migrate.
              # If the MinIO PVC mount is empty, the migration has already been
              # completed or there is nothing to copy; skip gracefully.
              BUCKET_PATH="/mnt/minio-old/{{ .Values.minio.bucketName }}"
              if [ ! -d "$BUCKET_PATH" ] || [ -z "$(ls -A $BUCKET_PATH 2>/dev/null)" ]; then
                echo "No data found at ${BUCKET_PATH}. Nothing to migrate — exiting."
                exit 0
              fi

              echo "Data found at ${BUCKET_PATH}. Proceeding with migration."
          volumeMounts:
            - name: minio-old-data
              mountPath: /mnt/minio-old
              readOnly: true
      containers:
        - name: data-copier
          image: "{{ .Values.global.portalRepository }}{{ .Values.image }}"
          command:
            - /bin/bash
            - -c
            - |
              set -e

              BUCKET_PATH="/mnt/minio-old/{{ .Values.minio.bucketName }}"

              # Guard: skip if source bucket is missing or empty (init container
              # already logged this case, but also handle restarts)
              if [ ! -d "$BUCKET_PATH" ] || [ -z "$(ls -A $BUCKET_PATH 2>/dev/null)" ]; then
                echo "Source path ${BUCKET_PATH} is empty or absent. Migration already complete."
                exit 0
              fi

              echo "========================================"
              echo "  Starting MinIO → SeaweedFS migration"
              echo "  Source : ${BUCKET_PATH}"
              echo "  Target : seaweedfs:/{{ .Values.global.deepStorage.analytics.bucketName }}"
              echo "========================================"

              echo "--- Step 1: Copy ---"
              rclone copy \
                "${BUCKET_PATH}" \
                "seaweedfs:/{{ .Values.global.deepStorage.analytics.bucketName }}" \
                --checksum \
                --transfers 16 \
                --retries 30 \
                --retries-sleep 10s \
                --low-level-retries 10 \
                --stats 5s \
                --stats-one-line \
                -vv \
                --progress

              echo "--- Step 2: Verify (one-way check) ---"
              rclone check \
                "${BUCKET_PATH}" \
                "seaweedfs:/{{ .Values.global.deepStorage.analytics.bucketName }}" \
                --one-way \
                -v

              echo "--- Step 3: Cleanup MinIO PVC ---"
              kubectl delete pvc minio-vol-claim-minio-0 \
                -n {{ .Release.Namespace }} \
                --ignore-not-found \
                && echo "MinIO PVC deleted successfully." \
                || echo "WARNING: PVC deletion returned non-zero; it may have already been removed."

              echo "========================================"
              echo "  Migration completed successfully!"
              echo "  Set global.deepStorage.enableDataMigration=false"
              echo "  in your values file for future upgrades."
              echo "========================================"
          env:
            - name: SEAWEEDFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_access_key_id
            - name: SEAWEEDFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_secret_access_key
            - name: RCLONE_CONFIG_SEAWEEDFS_TYPE
              value: s3
            - name: RCLONE_CONFIG_SEAWEEDFS_PROVIDER
              value: SeaweedFS
            - name: RCLONE_CONFIG_SEAWEEDFS_ENDPOINT
              value: http://seaweedfs-s3:8333
            - name: RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID
              value: $(SEAWEEDFS_ACCESS_KEY)
            - name: RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY
              value: $(SEAWEEDFS_SECRET_KEY)
          volumeMounts:
            - name: minio-old-data
              mountPath: /mnt/minio-old
              readOnly: true
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 4Gi
      volumes:
        - name: minio-old-data
          persistentVolumeClaim:
            claimName: minio-vol-claim-minio-0
            readOnly: true
{{ end }}
