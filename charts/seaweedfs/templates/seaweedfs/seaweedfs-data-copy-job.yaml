{{- if (eq .Values.global.deepStorage.enableDataMigration true) }}
# Data Migration Job for Minio to SeaweedFS
# 
# This is a regular Kubernetes Job (not a Helm hook), so:
# - Helm upgrade completes immediately without waiting
# - Job is created/deleted based on enableDataMigration flag
# - InitContainer actively checks for service readiness before starting migration
# - Rclone handles retries if connection issues occur during migration
#
# Usage:
#   1. Enable migration: --set global.deepStorage.enableDataMigration=true
#   2. Run helm upgrade (completes immediately)
#   3. Monitor: kubectl get job <release>-seaweedfs-data-copy-job -n <namespace>
#   4. Check logs: kubectl logs job/<release>-seaweedfs-data-copy-job -n <namespace> -c wait-for-services
#   5. Check migration logs: kubectl logs job/<release>-seaweedfs-data-copy-job -n <namespace> -c data-copier
#   6. For subsequent upgrades: --set global.deepStorage.enableDataMigration=false
#
# The initContainer will check Minio and SeaweedFS every 10s until both are accessible.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "portal.fullname" . }}-seaweedfs-data-copy-job
  labels:
    app: {{ template "portal.name" . }}
    chart: {{ template "portal.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: data-migration
    migration-source: minio
    migration-target: seaweedfs
spec:
  ttlSecondsAfterFinished: 86400  # Keep Job for 24 hours for inspection
  backoffLimit: 5  # Allow 5 pod restarts on failure
  suspend: false
  parallelism: 1
  template:
    metadata:
    spec:
    {{- if .Values.global.pullSecret }}
      imagePullSecrets:
      - name: "{{ .Values.global.pullSecret }}"
      {{- end }}
      initContainers:
        - name: wait-for-services
          image: "{{ .Values.global.portalRepository }}{{ .Values.image.seaweedfs }}"
          command:
            - /bin/bash
            - -c
            - |
              echo "Checking Minio and SeaweedFS readiness..."
              
              MAX_WAIT={{ .Values.global.deepStorage.migrationInitialDelaySeconds }}
              RETRY_INTERVAL=10
              ELAPSED=0
              
              # Function to check S3 endpoint
              check_s3_endpoint() {
                local endpoint=$1
                local access_key=$2
                local secret_key=$3
                local service_name=$4
                
                echo "Checking ${service_name} at ${endpoint}..."
                
                # Use rclone to test connectivity
                if rclone lsd "${service_name}:" --config=/dev/null \
                  --s3-provider="${service_name}" \
                  --s3-endpoint="${endpoint}" \
                  --s3-access-key-id="${access_key}" \
                  --s3-secret-access-key="${secret_key}" \
                  --timeout=5s >/dev/null 2>&1; then
                  echo "✓ ${service_name} is accessible"
                  return 0
                else
                  echo "✗ ${service_name} not ready yet"
                  return 1
                fi
              }
              
              # Wait for both services
              while [ $ELAPSED -lt $MAX_WAIT ]; do
                MINIO_READY=false
                SEAWEEDFS_READY=false
                
                # Check Minio
                if check_s3_endpoint \
                  "http://minio:9000" \
                  "$MINIO_ACCESS_KEY" \
                  "$MINIO_SECRET_KEY" \
                  "Minio"; then
                  MINIO_READY=true
                fi
                
                # Check SeaweedFS
                if check_s3_endpoint \
                  "http://seaweedfs-s3:8333" \
                  "$SEAWEEDFS_ACCESS_KEY" \
                  "$SEAWEEDFS_SECRET_KEY" \
                  "SeaweedFS"; then
                  SEAWEEDFS_READY=true
                fi
                
                # Both ready?
                if [ "$MINIO_READY" = true ] && [ "$SEAWEEDFS_READY" = true ]; then
                  echo ""
                  echo "✓✓ All services are ready! Starting data migration..."
                  exit 0
                fi
                
                # Wait and retry
                echo "Waiting ${RETRY_INTERVAL}s before retry... (elapsed: ${ELAPSED}s / max: ${MAX_WAIT}s)"
                sleep $RETRY_INTERVAL
                ELAPSED=$((ELAPSED + RETRY_INTERVAL))
              done
              
              echo ""
              echo "ERROR: Services did not become ready within ${MAX_WAIT} seconds"
              exit 1
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_SECRET_KEY
            - name: SEAWEEDFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_access_key_id
            - name: SEAWEEDFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_secret_access_key
      volumes:
        - name: empty-dir
          emptyDir: {}
      containers:
        - name: data-copier
          image: "{{ .Values.global.portalRepository }}{{ .Values.image.seaweedfs }}"
          command:
            - rclone
            - --stats-one-line
            - --stats
            - "2s"
            - --retries
            - "30"
            - --retries-sleep
            - "10s"
            - --low-level-retries
            - "10"
            - -vv
            - --progress
            - copy
            - "minio:/{{ .Values.minio.bucketName }}"
            - "seaweedfs:/{{ .Values.global.deepStorage.analytics.bucketName }}"
          env:
           - name: MINIO_ACCESS_KEY
             valueFrom:
               secretKeyRef:
                 name: minio-secret
                 key: MINIO_ACCESS_KEY
           - name: MINIO_SECRET_KEY
             valueFrom:
               secretKeyRef:
                 name: minio-secret
                 key: MINIO_SECRET_KEY
           - name: SEAWEEDFS_ACCESS_KEY
             valueFrom:
               secretKeyRef:
                 name: seaweedfs-s3-secret
                 key: admin_access_key_id
           - name: SEAWEEDFS_SECRET_KEY
             valueFrom:
               secretKeyRef:
                 name: seaweedfs-s3-secret
                 key: admin_secret_access_key
           - name: RCLONE_CONFIG_MINIO_TYPE
             value: s3
           - name: RCLONE_CONFIG_MINIO_PROVIDER
             value: Minio
           - name: RCLONE_CONFIG_MINIO_ENDPOINT
             value: http://minio:9000
           - name: RCLONE_CONFIG_MINIO_ACCESS_KEY_ID
             value: $(MINIO_ACCESS_KEY)
           - name: RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY
             value: $(MINIO_SECRET_KEY)
           - name: RCLONE_CONFIG_SEAWEEDFS_TYPE
             value: s3
           - name: RCLONE_CONFIG_SEAWEEDFS_PROVIDER
             value: SeaweedFS
           - name: RCLONE_CONFIG_SEAWEEDFS_ENDPOINT
             value: http://seaweedfs-s3:8333
           - name: RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID
             value: $(SEAWEEDFS_ACCESS_KEY)
           - name: RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY
             value: $(SEAWEEDFS_SECRET_KEY)
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 4Gi
      restartPolicy: "OnFailure"
{{ end }}