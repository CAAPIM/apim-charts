apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app: seaweedfs-s3
    chart: {{ template "seaweedfs.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if .Values.annotations }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: seaweedfs-s3
  serviceName: seaweedfs-s3
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: seaweedfs-s3
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.forceRedeploy }}
        timestamp: {{ now | quote }}
        {{- end }}
    spec:
      restartPolicy: {{ default .Values.global.restartPolicy .Values.restartPolicy }}
      {{- if .Values.global.pullSecret }}
      imagePullSecrets:
      - name: "{{ .Values.global.pullSecret }}"
      {{- end }}
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      serviceAccountName: {{ include "seaweedfs.serviceAccountName" . }}
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 12 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- toYaml .Values.tolerations | nindent 12 }}
      {{- end }}
      {{- if .Values.podSecurityContext }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
      {{- else if .Values.global.podSecurityContext }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 12 }}
      {{- else }}
      securityContext:
        fsGroup: 1010
      {{- end }}
      containers:
        - name: seaweedfs
          image: "{{ .Values.global.portalRepository }}{{ .Values.image.seaweedfs }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.imagePullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SEAWEEDFS_FULLNAME
              value: "seaweedfs"
            {{- if .Values.extraEnvironmentVars }}
            {{- range $key, $value := .Values.extraEnvironmentVars }}
            - name: {{ $key }}
              {{- if kindIs "string" $value }}
              value: {{ $value | quote }}
              {{- else }}
              valueFrom:
                {{ toYaml $value | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.global.extraEnvironmentVars }}
            {{- range $key, $value := .Values.global.extraEnvironmentVars }}
            - name: {{ $key }}
              {{- if kindIs "string" $value }}
              value: {{ $value | quote }}
              {{- else }}
              valueFrom:
                {{ toYaml $value | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            - name: WEED_MYSQL_ENABLED
              value: "true"
            - name: WEED_MYSQL_HOSTNAME
              {{- if .Values.global.setupDemoDatabase }}
              value: "{{ .Release.Name }}-mysql-headless"
              {{- else }}
              value: "{{ .Values.global.databaseHost }}"
              {{- end }}
            - name: WEED_MYSQL_PORT
              value: {{ include "database-port" . | quote }}
            - name: WEED_MYSQL_USERNAME
              value: "{{ required "Please fill in databaseUsername in values.yaml" .Values.global.databaseUsername }}"
            - name: WEED_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.databaseSecret }}
            {{- if eq .Values.global.databaseType "mysql" }}
                  key: mysql-password
            {{- end }}
            - name: WEED_MYSQL_DATABASE
              value: {{ include "portal-db-name" . | quote }}
            - name: WEED_MYSQL_CONNECTION_MAX_IDLE
              value: "10"
            - name: WEED_MYSQL_CONNECTION_MAX_OPEN
              value: "100"
            - name: WEED_MYSQL_CONNECTION_MAX_LIFETIME_SECONDS
              value: "0"
            - name: WEED_MYSQL_INTERPOLATEPARAMS
              value: "true"
            - name: WEED_MYSQL_TLS
              value: "true"
            - name: WEED_MYSQL_ALLOW_FALLBACK_TO_PLAINTEXT
              value: "true"
            - name: RCLONE_CONFIG_MINIO_TYPE
              value: s3
            - name: RCLONE_CONFIG_MINIO_PROVIDER
              value: Minio
            - name: RCLONE_CONFIG_MINIO_ENDPOINT
              value: http://minio:9000
            - name: RCLONE_CONFIG_MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ACCESS_KEY
            - name: RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_SECRET_KEY
            - name: RCLONE_CONFIG_SEAWEEDFS_TYPE
              value: s3
            - name: RCLONE_CONFIG_SEAWEEDFS_PROVIDER
              value: SeaweedFS
            - name: RCLONE_CONFIG_SEAWEEDFS_ENDPOINT
              value: http://seaweedfs-s3:8333
            - name: RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_access_key_id
            - name: RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_secret_access_key
          envFrom:
          - configMapRef:
              name: seaweedfs-config
          command:
            - "/usr/bin/weed"
          args:
            - "-v={{ .Values.loggingLevel }}"
            - "server"
            - "-dir=/opt/data"
            - "-master"
              {{ if gt (.Values.replicaCount | int) 1 -}}
            - "-master.peers={{ include "seaweedfs.master.servers" . }}"
            - "-ip=$(POD_NAME).seaweedfs-s3.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"
              {{ end -}}
            - "-volume"
              {{- if .Values.idleTimeout }}
            - "-idleTimeout={{ .Values.idleTimeout }}"
              {{- end }}
              {{- if .Values.dataCenter }}
            - "-dataCenter={{ .Values.dataCenter }}"
              {{- end }}
              {{- if .Values.rack }}
            - "-rack={{ .Values.rack }}"
              {{- end }}
              {{- if .Values.whiteList }}
            - "-whiteList={{ .Values.whiteList }}"
              {{- end }}
              {{- if .Values.disableHttp }}
            - "-disableHttp={{ .Values.disableHttp }}"
              {{- end }}
              {{- if and (.Values.volume.dataDirs) (index .Values.volume.dataDirs 0 "maxVolumes") }}
            - "-volume.max={{ index .Values.volume.dataDirs 0 "maxVolumes" }}"
              {{- end }}
            - "-master.port={{ .Values.master.port }}"
              {{- if .Values.global.enableReplication }}
            - "-master.defaultReplication={{ .Values.global.replicationPlacement }}"
              {{- else }}
            - "-master.defaultReplication={{ .Values.master.defaultReplication }}"
              {{- end }}
              {{- if .Values.master.volumePreallocate }}
            - "-master.volumePreallocate"
              {{- end }}
            - "-master.volumeSizeLimitMB={{ .Values.master.volumeSizeLimitMB }}"
              {{- if .Values.master.garbageThreshold }}
            - "-master.garbageThreshold={{ .Values.master.garbageThreshold }}"
              {{- end }}
            - "-volume.port={{ .Values.volume.port }}"
            - "-volume.readMode={{ .Values.volume.readMode }}"
              {{- if .Values.volume.imagesFixOrientation }}
            - "-volume.images.fix.orientation"
              {{- end }}
              {{- if .Values.volume.index }}
            - "-volume.index={{ .Values.volume.index }}"
              {{- end }}
              {{- if .Values.volume.fileSizeLimitMB }}
            - "-volume.fileSizeLimitMB={{ .Values.volume.fileSizeLimitMB }}"
              {{- end }}
            - "-volume.minFreeSpacePercent={{ .Values.volume.minFreeSpacePercent }}"
            - "-volume.compactionMBps={{ .Values.volume.compactionMBps }}"
              {{- if .Values.metricsPort }}
            - "-metricsPort={{ .Values.metricsPort }}"
              {{- else if .Values.master.metricsPort }}
            - "-metricsPort={{ .Values.master.metricsPort }}"
              {{- end }}
            - "-filer"
            - "-filer.port={{ .Values.filer.port }}"
              {{- if .Values.filer.disableDirListing }}
            - "-filer.disableDirListing"
              {{- end }}
            - "-filer.dirListLimit={{ .Values.filer.dirListLimit }}"
              {{- if .Values.global.enableReplication }}
            - "-filer.defaultReplicaPlacement={{ .Values.global.replicationPlacement }}"
              {{- else }}
            - "-filer.defaultReplicaPlacement={{ .Values.filer.defaultReplicaPlacement }}"
              {{- end }}
              {{- if .Values.filer.maxMB }}
            - "-filer.maxMB={{ .Values.filer.maxMB }}"
              {{- end }}
              {{- if .Values.filer.encryptVolumeData }}
            - "-filer.encryptVolumeData"
              {{- end }}
              {{- if .Values.filer.filerGroup}}
            - "-filer.filerGroup={{ .Values.filer.filerGroup}}"
              {{- end }}
              {{- if .Values.filer.rack }}
            - "-filer.rack={{ .Values.filer.rack }}"
              {{- end }}
              {{- if .Values.filer.dataCenter }}
            - "-filer.dataCenter={{ .Values.filer.dataCenter }}"
              {{- end }}
              {{- if .Values.s3.enabled }}
            - "-s3"
            - "-s3.port={{ .Values.s3.port }}"
              {{- if .Values.s3.domainName }}
            - "-s3.domainName={{ .Values.s3.domainName }}"
              {{- end }}
              {{- if .Values.global.enableSecurity }}
              {{- if .Values.s3.httpsPort }}
            - "-s3.port.https={{ .Values.s3.httpsPort }}"
              {{- end }}
            - "-s3.cert.file=/usr/local/share/ca-certificates/client/tls.crt"
            - "-s3.key.file=/usr/local/share/ca-certificates/client/tls.key"
              {{- end }}
              {{- if eq (typeOf .Values.s3.allowEmptyFolder) "bool" }}
            - "-s3.allowEmptyFolder={{ .Values.s3.allowEmptyFolder }}"
              {{- end }}
              {{- if .Values.s3.enableAuth }}
            - "-s3.config=/etc/sw/s3/seaweedfs_s3_config"
              {{- end }}
              {{- if .Values.s3.auditLogConfig }}
            - "-s3.auditLogConfig=/etc/sw/s3/s3_auditLogConfig.json"
              {{- end }}
              {{- end }}
              {{- if .Values.sftp.enabled }}
            - "-sftp"
            - "-sftp.port={{ .Values.sftp.port }}"
              {{- if .Values.sftp.sshPrivateKey }}
            - "-sftp.sshPrivateKey={{ .Values.sftp.sshPrivateKey }}"
              {{- end }}
              {{- if .Values.sftp.hostKeysFolder }}
            - "-sftp.hostKeysFolder={{ .Values.sftp.hostKeysFolder }}"
              {{- end }}
              {{- if .Values.sftp.authMethods }}
            - "-sftp.authMethods={{ .Values.sftp.authMethods }}"
              {{- end }}
              {{- if .Values.sftp.maxAuthTries }}
            - "-sftp.maxAuthTries={{ .Values.sftp.maxAuthTries }}"
              {{- end }}
              {{- if .Values.sftp.bannerMessage }}
            - "-sftp.bannerMessage={{ .Values.sftp.bannerMessage }}"
              {{- end }}
              {{- if .Values.sftp.loginGraceTime }}
            - "-sftp.loginGraceTime={{ .Values.sftp.loginGraceTime }}"
              {{- end }}
              {{- if .Values.sftp.clientAliveInterval }}
            - "-sftp.clientAliveInterval={{ .Values.sftp.clientAliveInterval }}"
              {{- end }}
              {{- if .Values.sftp.clientAliveCountMax }}
            - "-sftp.clientAliveCountMax={{ .Values.sftp.clientAliveCountMax }}"
              {{- end }}
            - "-sftp.userStoreFile=/etc/sw/sftp/seaweedfs_sftp_config"
              {{- end }}

          volumeMounts:
            - name: seaweedfs-vol-claim
              mountPath: /opt/data
            {{- if and .Values.s3.enabled (or .Values.s3.enableAuth .Values.filer.s3.enableAuth) }}
            - name: config-s3-users
              mountPath: /etc/sw/s3
              readOnly: true
            {{- end }}
            {{- if .Values.sftp.enabled }}
            - name: config-ssh
              mountPath: /etc/sw/ssh
              readOnly: true
            - mountPath: /etc/sw/sftp
              name: config-users
              readOnly: true
            {{- end }}
            {{- if .Values.filer.notificationConfig }}
            - name: notification-config
              mountPath: /etc/seaweedfs/notification.toml
              subPath: notification.toml
              readOnly: true
            {{- end }}
            - name: master-config
              mountPath: /etc/seaweedfs/master.toml
              subPath: master.toml
              readOnly: true
            - name: filer-config
              mountPath: /etc/seaweedfs/filer.toml
              subPath: filer.toml
              readOnly: true
            {{- if .Values.global.enableSecurity }}
            - name: security-config
              mountPath: /etc/seaweedfs/security.toml
              subPath: security.toml
              readOnly: true
            - name: ca-cert
              mountPath: /usr/local/share/ca-certificates/ca/
              readOnly: true
            - name: master-cert
              mountPath: /usr/local/share/ca-certificates/master/
              readOnly: true
            - name: volume-cert
              mountPath: /usr/local/share/ca-certificates/volume/
              readOnly: true
            - name: filer-cert
              mountPath: /usr/local/share/ca-certificates/filer/
              readOnly: true
            - name: client-cert
              mountPath: /usr/local/share/ca-certificates/client/
              readOnly: true
            {{- end }}
            {{ tpl .Values.extraVolumeMounts . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.master.port }}
              name: swfs-mas
            - containerPort: {{ .Values.master.grpcPort }}
              name: swfs-mas-grpc
            - containerPort: {{ .Values.volume.port }}
              name: swfs-vol
            - containerPort: {{ .Values.volume.grpcPort }}
              name: swfs-vol-grpc
            - containerPort: {{ .Values.filer.port }}
              name: swfs-fil
            - containerPort: {{ .Values.filer.grpcPort }}
              name: swfs-fil-grpc
            {{- if .Values.s3.enabled }}
            - containerPort: {{ .Values.s3.port }}
              name: swfs-s3
              {{- if .Values.s3.httpsPort }}
            - containerPort: {{ .Values.s3.httpsPort }}
              name: swfs-s3-tls
              {{- end }}
            {{- end }}
            {{- if .Values.sftp.enabled }}
            - containerPort: {{ .Values.sftp.port }}
              name: swfs-sftp
            {{- end }}
            {{- if .Values.metricsPort }}
            - containerPort: {{ .Values.metricsPort }}
              name: server-metrics
            {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.master.port }}
              scheme: {{ .Values.readinessProbe.scheme }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.master.port }}
              scheme: {{ .Values.livenessProbe.scheme }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: {{ .Values.master.port }}
              scheme: {{ .Values.startupProbe.scheme }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
      {{- if .Values.sidecars }}
      {{- include "common.tplvalues.render" (dict "value" .Values.sidecars "context" $) | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and .Values.s3.enabled (or .Values.s3.enableAuth .Values.filer.s3.enableAuth) }}
        - name: config-s3-users
          secret:
            defaultMode: 420
            secretName: {{ default (printf "seaweedfs-s3-secret" ) (or .Values.s3.existingConfigSecret .Values.filer.s3.existingConfigSecret) }}
        {{- end }}
        {{- if .Values.sftp.enabled }}
        - name: config-ssh
          secret:
            defaultMode: 420
            secretName: {{ default (printf "seaweedfs-sftp-ssh-secret" ) .Values.sftp.existingSshConfigSecret }}
        - name: config-users
          secret:
            defaultMode: 420
            secretName: {{ default (printf "seaweedfs-sftp-secret" ) .Values.sftp.existingConfigSecret }}
        {{- end }}
        {{- if .Values.filer.notificationConfig }}
        - name: notification-config
          configMap:
            name: seaweedfs-notification-config
        {{- end }}
        - name: master-config
          configMap:
            name: seaweedfs-config
            items:
              - key: master.toml
                path: master.toml
        - name: filer-config
          configMap:
            name: seaweedfs-config
            items:
              - key: filer.toml
                path: filer.toml
        {{- if .Values.global.enableSecurity }}
        - name: security-config
          configMap:
            name: seaweedfs-security-config
        - name: ca-cert
          secret:
            secretName: seaweedfs-ca-cert
        - name: master-cert
          secret:
            secretName: seaweedfs-master-cert
        - name: volume-cert
          secret:
            secretName: seaweedfs-volume-cert
        - name: filer-cert
          secret:
            secretName: seaweedfs-filer-cert
        - name: client-cert
          secret:
            secretName: seaweedfs-client-cert
        {{- end }}
        {{ tpl .Values.extraVolumes . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-vol-claim
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.global.storageClass}}
        storageClassName: "{{ .Values.global.storageClass }}"
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.storage.seaweedfs }}