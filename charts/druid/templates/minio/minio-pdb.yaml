{{ if .Values.minio.pdb.create }}
{{- if or (not .Values.global.deepStorage.seaweedfs ) ( and .Values.global.deepStorage.seaweedfs .Values.global.deepStorage.enableDataMigration )}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app: minio
  name: minio-pdb
spec:
  {{- if .Values.minio.pdb.minAvailable }}
  minAvailable: {{ .Values.minio.pdb.minAvailable }}
  {{- end }}
  {{- if .Values.minio.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.minio.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      app: minio
{{ end }}
{{- end }}
