{{- if (eq .Values.seaweedfs.enabled true) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app: seaweedfs-s3
    chart: {{ template "druid.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- if .Values.seaweedfs.annotations }}
  annotations:
    {{- toYaml .Values.seaweedfs.annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.seaweedfs.replicaCount }}
  selector:
    matchLabels:
      app: seaweedfs-s3
  serviceName: seaweedfs-s3
  template:
    metadata:
      labels:
        app: seaweedfs-s3
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.seaweedfs.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.seaweedfs.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ default .Values.global.restartPolicy .Values.seaweedfs.restartPolicy }}
      {{- if .Values.seaweedfs.affinity }}
      affinity:
        {{ tpl .Values.seaweedfs.affinity . | nindent 8 | trim }}
      {{- end }}
      {{- if .Values.seaweedfs.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{ tpl .Values.seaweedfs.topologySpreadConstraints . | nindent 8 | trim }}
      {{- end }}
      {{- if .Values.seaweedfs.tolerations }}
      tolerations:
        {{- tpl .Values.seaweedfs.tolerations . | nindent 8 }}
      {{- end }}
      {{- if .Values.global.pullSecret }}
      imagePullSecrets:
      - name: "{{ .Values.global.pullSecret }}"
      {{- end }}
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      {{- if .Values.seaweedfs.priorityClassName }}
      priorityClassName: {{ .Values.seaweedfs.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.seaweedfs.serviceAccountName }}
      serviceAccountName: {{ .Values.seaweedfs.serviceAccountName | quote }}
      {{- end }}
      {{- if .Values.seaweedfs.initContainers }}
      initContainers:
        {{- tpl .Values.seaweedfs.initContainers . | nindent 8 }}
      {{- end }}
      {{- if .Values.seaweedfs.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.seaweedfs.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: seaweedfs
          image: "{{ .Values.global.portalRepository }}{{ .Values.image.seaweedfs }}"
          #image: docker.io/chrislusf/seaweedfs:3.57_full
          imagePullPolicy: {{ default "IfNotPresent" .Values.seaweedfs.imagePullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SEAWEEDFS_FULLNAME
              value: "seaweedfs"
            {{- if .Values.seaweedfs.extraEnvironmentVars }}
            {{- range $key, $value := .Values.seaweedfs.extraEnvironmentVars }}
            - name: {{ $key }}
              {{- if kindIs "string" $value }}
              value: {{ $value | quote }}
              {{- else }}
              valueFrom:
                {{ toYaml $value | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.global.extraEnvironmentVars }}
            {{- range $key, $value := .Values.global.extraEnvironmentVars }}
            - name: {{ $key }}
              {{- if kindIs "string" $value }}
              value: {{ $value | quote }}
              {{- else }}
              valueFrom:
                {{ toYaml $value | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- end }}
            - name: WEED_MYSQL_ENABLED
              value: "true"
            - name: WEED_MYSQL_DATABASE
              value: {{ include "druid-db-name" . | quote }}
            - name: WEED_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.databaseSecret }}
            {{ if eq .Values.global.databaseType "mysql" }}
                  key: mysql-password
            {{ end }}
            - name: WEED_MYSQL_CONNECTION_MAX_IDLE
              value: "5"
            - name: WEED_MYSQL_CONNECTION_MAX_OPEN
              value: "75"
            - name: WEED_MYSQL_CONNECTION_MAX_LIFETIME_SECONDS
              value: "600"
            - name: WEED_MYSQL_INTERPOLATEPARAMS
              value: "true"
          envFrom:
          - configMapRef:
              name: seaweedfs-config
          command:
            - "/bin/bash"
            - "-ec"
            {{ if gt (.Values.seaweedfs.replicaCount | int) 1 }}
            - |
              POD_ORDINAL=${HOSTNAME##*-}
              if [ "$POD_ORDINAL" = "0" ]; then
                # Specific args for pod-0
                PEERS=PEERS=seaweedfs-s3-2.seaweedfs-s3.fs-1-sm895441.svc.cluster.local:9333,seaweedfs-s3-1.seaweedfs-s3.fs-1-sm895441.svc.cluster.local:9333
              elif [ "$POD_ORDINAL" = "1" ]; then
                # Specific args for pod-1
                PEERS=seaweedfs-s3-0.seaweedfs-s3.fs-1-sm895441.svc.cluster.local:9333,seaweedfs-s3-2.seaweedfs-s3.fs-1-sm895441.svc.cluster.local:9333
              else
                # Default args for other pods
                PEERS=seaweedfs-s3-0.seaweedfs-s3.fs-1-sm895441.svc.cluster.local:9333,seaweedfs-s3-1.seaweedfs-s3.fs-1-sm895441.svc.cluster.local:9333
              fi
            {{ else }}
            {{ end }}
            - |
              /opt/bitnami/seaweedfs/bin/weed \
              -v={{ .Values.seaweedfs.loggingLevel }} \
              server \
              -dir=/opt/data \
              -master \
              -master.peers=$PEERS \
              -volume \
              {{- if .Values.seaweedfs.idleTimeout }}
              -idleTimeout={{ .Values.seaweedfs.idleTimeout }} \
              {{- end }}
              {{- if .Values.seaweedfs.dataCenter }}
              -dataCenter={{ .Values.seaweedfs.dataCenter }} \
              {{- end }}
              {{- if .Values.seaweedfs.rack }}
              -rack={{ .Values.seaweedfs.rack }} \
              {{- end }}
              {{- if .Values.seaweedfs.whiteList }}
              -whiteList={{ .Values.seaweedfs.whiteList }} \
              {{- end }}
              {{- if .Values.seaweedfs.disableHttp }}
              -disableHttp={{ .Values.seaweedfs.disableHttp }} \
              {{- end }}
              {{- if and (.Values.seaweedfs.volume.dataDirs) (index .Values.seaweedfs.volume.dataDirs 0 "maxVolumes") }}
              -volume.max={{ index .Values.seaweedfs.volume.dataDirs 0 "maxVolumes" }} \
              {{- end }}
              -master.port={{ .Values.seaweedfs.master.port }} \
              {{- if .Values.global.enableReplication }}
              -master.defaultReplication={{ .Values.global.replicationPlacement }} \
              {{- else }}
              -master.defaultReplication={{ .Values.seaweedfs.master.defaultReplication }} \
              {{- end }}
              {{- if .Values.seaweedfs.master.volumePreallocate }}
              -master.volumePreallocate \
              {{- end }}
              -master.volumeSizeLimitMB={{ .Values.seaweedfs.master.volumeSizeLimitMB }} \
              {{- if .Values.seaweedfs.master.garbageThreshold }}
              -master.garbageThreshold={{ .Values.seaweedfs.master.garbageThreshold }} \
              {{- end }}
              -volume.port={{ .Values.seaweedfs.volume.port }} \
              -volume.readMode={{ .Values.seaweedfs.volume.readMode }} \
              {{- if .Values.seaweedfs.volume.imagesFixOrientation }}
              -volume.images.fix.orientation \
              {{- end }}
              {{- if .Values.seaweedfs.volume.index }}
              -volume.index={{ .Values.seaweedfs.volume.index }} \
              {{- end }}
              {{- if .Values.seaweedfs.volume.fileSizeLimitMB }}
              -volume.fileSizeLimitMB={{ .Values.seaweedfs.volume.fileSizeLimitMB }} \
              {{- end }}
              -volume.minFreeSpacePercent={{ .Values.seaweedfs.volume.minFreeSpacePercent }} \
              -volume.compactionMBps={{ .Values.seaweedfs.volume.compactionMBps }} \
              {{- if .Values.seaweedfs.metricsPort }}
              -metricsPort={{ .Values.seaweedfs.metricsPort }} \
              {{- else if .Values.seaweedfs.master.metricsPort }}
              -metricsPort={{ .Values.seaweedfs.master.metricsPort }} \
              {{- end }}
              -filer \
              -filer.port={{ .Values.seaweedfs.filer.port }} \
              {{- if .Values.seaweedfs.filer.disableDirListing }}
              -filer.disableDirListing \
              {{- end }}
              -filer.dirListLimit={{ .Values.seaweedfs.filer.dirListLimit }} \
              {{- if .Values.global.enableReplication }}
              -filer.defaultReplicaPlacement={{ .Values.global.replicationPlacement }} \
              {{- else }}
              -filer.defaultReplicaPlacement={{ .Values.seaweedfs.filer.defaultReplicaPlacement }} \
              {{- end }}
              {{- if .Values.seaweedfs.filer.maxMB }}
              -filer.maxMB={{ .Values.seaweedfs.filer.maxMB }} \
              {{- end }}
              {{- if .Values.seaweedfs.filer.encryptVolumeData }}
              -filer.encryptVolumeData \
              {{- end }}
              {{- if .Values.seaweedfs.filer.filerGroup}}
              -filer.filerGroup={{ .Values.seaweedfs.filer.filerGroup}} \
              {{- end }}
              {{- if .Values.seaweedfs.filer.rack }}
              -filer.rack={{ .Values.seaweedfs.filer.rack }} \
              {{- end }}
              {{- if .Values.seaweedfs.filer.dataCenter }}
              -filer.dataCenter={{ .Values.seaweedfs.filer.dataCenter }} \
              {{- end }}
              {{- if .Values.seaweedfs.s3.enabled }}
              -s3 \
              -s3.port={{ .Values.seaweedfs.s3.port }} \
              {{- if .Values.seaweedfs.s3.domainName }}
              -s3.domainName={{ .Values.seaweedfs.s3.domainName }} \
              {{- end }}
              {{- if .Values.global.enableSecurity }}
              {{- if .Values.seaweedfs.s3.httpsPort }}
              -s3.port.https={{ .Values.seaweedfs.s3.httpsPort }} \
              {{- end }}
              -s3.cert.file=/usr/local/share/ca-certificates/client/tls.crt \
              -s3.key.file=/usr/local/share/ca-certificates/client/tls.key \
              {{- end }}
              {{- if eq (typeOf .Values.seaweedfs.s3.allowEmptyFolder) "bool" }}
              -s3.allowEmptyFolder={{ .Values.seaweedfs.s3.allowEmptyFolder }} \
              {{- end }}
              {{- if .Values.seaweedfs.s3.enableAuth }}
              -s3.config=/etc/sw/s3/seaweedfs_s3_config \
              {{- end }}
              {{- if .Values.seaweedfs.s3.auditLogConfig }}
              -s3.auditLogConfig=/etc/sw/s3/s3_auditLogConfig.json \
              {{- end }}
              {{- end }}
              {{- if .Values.seaweedfs.sftp.enabled }}
              -sftp \
              -sftp.port={{ .Values.sftp.port }} \
              {{- if .Values.sftp.sshPrivateKey }}
              -sftp.sshPrivateKey={{ .Values.sftp.sshPrivateKey }} \
              {{- end }}
              {{- if .Values.sftp.hostKeysFolder }}
              -sftp.hostKeysFolder={{ .Values.sftp.hostKeysFolder }} \
              {{- end }}
              {{- if .Values.sftp.authMethods }}
              -sftp.authMethods={{ .Values.sftp.authMethods }} \
              {{- end }}
              {{- if .Values.sftp.maxAuthTries }}
              -sftp.maxAuthTries={{ .Values.sftp.maxAuthTries }} \
              {{- end }}
              {{- if .Values.sftp.bannerMessage }}
              -sftp.bannerMessage="{{ .Values.sftp.bannerMessage }}" \
              {{- end }}
              {{- if .Values.sftp.loginGraceTime }}
              -sftp.loginGraceTime={{ .Values.sftp.loginGraceTime }} \
              {{- end }}
              {{- if .Values.sftp.clientAliveInterval }}
              -sftp.clientAliveInterval={{ .Values.sftp.clientAliveInterval }} \
              {{- end }}
              {{- if .Values.sftp.clientAliveCountMax }}
              -sftp.clientAliveCountMax={{ .Values.sftp.clientAliveCountMax }} \
              {{- end }}
              -sftp.userStoreFile=/etc/sw/sftp/seaweedfs_sftp_config \
              {{- end }}

          volumeMounts:
            - name: seaweedfs-vol-claim
              mountPath: /opt/data
            {{- if and .Values.seaweedfs.s3.enabled (or .Values.seaweedfs.s3.enableAuth .Values.seaweedfs.filer.s3.enableAuth) }}
            - name: config-s3-users
              mountPath: /etc/sw/s3
              readOnly: true
            {{- end }}
            {{- if .Values.seaweedfs.sftp.enabled }}
            - name: config-ssh
              mountPath: /etc/sw/ssh
              readOnly: true
            - mountPath: /etc/sw/sftp
              name: config-users
              readOnly: true
            {{- end }}
            {{- if .Values.seaweedfs.filer.notificationConfig }}
            - name: notification-config
              mountPath: /etc/seaweedfs/notification.toml
              subPath: notification.toml
              readOnly: true
            {{- end }}
            - name: master-config
              mountPath: /etc/seaweedfs/master.toml
              subPath: master.toml
              readOnly: true
            - name: filer-config
              mountPath: /etc/seaweedfs/filer.toml
              subPath: filer.toml
            {{- if .Values.global.enableSecurity }}
            - name: security-config
              mountPath: /etc/seaweedfs/security.toml
              subPath: security.toml
              readOnly: true
            - name: ca-cert
              mountPath: /usr/local/share/ca-certificates/ca/
              readOnly: true
            - name: master-cert
              mountPath: /usr/local/share/ca-certificates/master/
              readOnly: true
            - name: volume-cert
              mountPath: /usr/local/share/ca-certificates/volume/
              readOnly: true
            - name: filer-cert
              mountPath: /usr/local/share/ca-certificates/filer/
              readOnly: true
            - name: client-cert
              mountPath: /usr/local/share/ca-certificates/client/
              readOnly: true
            {{- end }}
            {{ tpl .Values.seaweedfs.extraVolumeMounts . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.seaweedfs.master.port }}
              name: swfs-mas
            - containerPort: {{ .Values.seaweedfs.master.grpcPort }}
              name: swfs-mas-grpc
            - containerPort: {{ .Values.seaweedfs.volume.port }}
              name: swfs-vol
            - containerPort: {{ .Values.seaweedfs.volume.grpcPort }}
              name: swfs-vol-grpc
            - containerPort: {{ .Values.seaweedfs.filer.port }}
              name: swfs-fil
            - containerPort: {{ .Values.seaweedfs.filer.grpcPort }}
              name: swfs-fil-grpc
            {{- if .Values.seaweedfs.s3.enabled }}
            - containerPort: {{ .Values.seaweedfs.s3.port }}
              name: swfs-s3
              {{- if .Values.seaweedfs.s3.httpsPort }}
            - containerPort: {{ .Values.seaweedfs.s3.httpsPort }}
              name: swfs-s3-tls
              {{- end }}
            {{- end }}
            {{- if .Values.seaweedfs.sftp.enabled }}
            - containerPort: {{ .Values.sftp.port }}
              name: swfs-sftp
            {{- end }}
            {{- if .Values.seaweedfs.metricsPort }}
            - containerPort: {{ .Values.seaweedfs.metricsPort }}
              name: server-metrics
            {{- end }}
          {{- if .Values.seaweedfs.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.seaweedfs.readinessProbe.httpGet.path }}
              port: {{ .Values.seaweedfs.master.port }}
              scheme: {{ .Values.seaweedfs.readinessProbe.scheme }}
            initialDelaySeconds: {{ .Values.seaweedfs.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.seaweedfs.readinessProbe.periodSeconds }}
            successThreshold: {{ .Values.seaweedfs.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.seaweedfs.readinessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.seaweedfs.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.seaweedfs.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.seaweedfs.livenessProbe.httpGet.path }}
              port: {{ .Values.seaweedfs.master.port }}
              scheme: {{ .Values.seaweedfs.livenessProbe.scheme }}
            initialDelaySeconds: {{ .Values.seaweedfs.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.seaweedfs.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.seaweedfs.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.seaweedfs.livenessProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.seaweedfs.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- with .Values.seaweedfs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.seaweedfs.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.seaweedfs.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
      {{- if .Values.seaweedfs.sidecars }}
      {{- include "common.tplvalues.render" (dict "value" .Values.seaweedfs.sidecars "context" $) | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and .Values.seaweedfs.s3.enabled (or .Values.seaweedfs.s3.enableAuth .Values.seaweedfs.filer.s3.enableAuth) }}
        - name: config-s3-users
          secret:
            defaultMode: 420
            secretName: {{ default (printf "seaweedfs-s3-secret" ) (or .Values.seaweedfs.s3.existingConfigSecret .Values.seaweedfs.filer.s3.existingConfigSecret) }}
        {{- end }}
        {{- if .Values.seaweedfs.sftp.enabled }}
        - name: config-ssh
          secret:
            defaultMode: 420
            secretName: {{ default (printf "seaweedfs-sftp-ssh-secret" ) .Values.sftp.existingSshConfigSecret }}
        - name: config-users
          secret:
            defaultMode: 420
            secretName: {{ default (printf "seaweedfs-sftp-secret" ) .Values.sftp.existingConfigSecret }}
        {{- end }}
        {{- if .Values.seaweedfs.filer.notificationConfig }}
        - name: notification-config
          configMap:
            name: seaweedfs-notification-config
        {{- end }}
        - name: master-config
          configMap:
            name: seaweedfs-config
            path: master.toml
        - name: filer-config
          configMap:
            name: seaweedfs-config
            path: filer.toml
        {{- if .Values.global.enableSecurity }}
        - name: security-config
          configMap:
            name: seaweedfs-security-config
        - name: ca-cert
          secret:
            secretName: seaweedfs-ca-cert
        - name: master-cert
          secret:
            secretName: seaweedfs-master-cert
        - name: volume-cert
          secret:
            secretName: seaweedfs-volume-cert
        - name: filer-cert
          secret:
            secretName: seaweedfs-filer-cert
        - name: client-cert
          secret:
            secretName: seaweedfs-client-cert
        {{- end }}
        {{ tpl .Values.seaweedfs.extraVolumes . | nindent 8 }}
      {{- if .Values.seaweedfs.nodeSelector }}
      nodeSelector:
        {{ tpl .Values.seaweedfs.nodeSelector . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-vol-claim
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.global.storageClass}}
        storageClassName: "{{ .Values.global.storageClass }}"
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.storage.seaweedfs }}
{{- end }}