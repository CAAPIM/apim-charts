# Analytics stack configuration - Apache Druid
# This Chart is designed to be deployed as a SubChart of the
# Broadcom API Developer Portal

# Global values
global:
  portalRepository: caapim/
  pullSecret: broadcom-apim
  # these default to mysql settings above, change if connecting to an external database.
# setupDemoDatabase: true
  databaseType: mysql
  databaseHost: mysql
  databasePort: 3306
  databaseUseSSL: true
  databaseRequireSSL: false
  databaseUsername: admin
  databaseSecret:
  subdomainPrefix: dev-portal
  legacyHostnames: false
  legacyDatabaseNames: false
# databasePassword: 7layer
  deepStorage:
    analytics:
      bucketName: api-metrics

image:
  zookeeper: zookeeper:5.4
  broker: druid:5.4
  coordinator: druid:5.4
  middlemanager: druid:5.4
  minio: minio:5.4
  historical: druid:5.4
  ingestion: ingestion-server:5.4

persistence:
  storage:
    historical: 50Gi
    minio: 40Gi
    zookeeper: 10Gi

# Service Account for Druid services
serviceAccount:
  create: true
# name:

minio:
  # Set to true to re-enable the MinIO StatefulSet (legacy mode).
  # MinIO is disabled by default in 5.4.2; SeaweedFS is the only supported deep storage.
  enabled: false
  auth:
    secretName: minio-secret
    # Auto-generated minio-auth
  # access_key:
  # secret_key:
# The minio bucket that holds historical data for your portal.
# By default this is apim-data, if using AWS, GCP, Azure, this will need to match a bucket you have access to.
  bucketName: api-metrics
# cloudStorage: false
  s3gateway:
    enabled: false
    serviceEndpoint: ""
    accessKey: ""
    secretKey: ""
  gcsgateway:
    enabled: false
    # credential json file of service account key
    gcsKeyJson: ""
    # Google cloud project-id
    projectId: ""
  azuregateway:
    enabled: false
  replicaCount: 1
  port: 9000
  image:
    pullPolicy: IfNotPresent
  resources:
    requests: {}
    # memory: 256Mi
    limits: {}
    # memory: 256Mi
# nodeSelector: {}
# affinity:


zookeeper:
  hostname: zookeeper
  port: 2181
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    limits: {}
    # memory: 256Mi
    requests: {}
    # memory: 256Mi
# nodeSelector: {}
# affinity:

middlemanager:
  replicaCount: 1
  loglevel: WARN
  indexer:
    startPort: 8100
    endPort: 65535
  image:
    pullPolicy: IfNotPresent
  resources:
    requests: {}
    # memory: 4Gi
    limits: {}
    # memory: 4Gi
# nodeSelector: {}
# affinity:

broker:
  replicaCount: 1
  loglevel: WARN
  image:
    pullPolicy: IfNotPresent
  resources:
    requests: {}
    # memory: 1Gi
    limits: {}
    # memory: 2Gi
# nodeSelector: {}
# affinity:

coordinator:
  hostname: coordinator
  loglevel: WARN
  port: 8081
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  resources:
    requests: {}
    # memory: 512Mi
    limits: {}
    # memory: 512Mi
# nodeSelector: {}
# affinity:

historical:
  livenessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 1
    failureThreshold: 3
    periodSeconds: 15
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 90
    timeoutSeconds: 1
    failureThreshold: 3
    periodSeconds: 15
    successThreshold: 1
  replicaCount: 1
  loglevel: WARN
  image:
    pullPolicy: IfNotPresent
  resources:
    requests: {}
    # memory: 2Gi
    limits: {}
    # memory: 2Gi
# nodeSelector: {}
# affinity:

ingestion:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  config:
    partitionCount: 1
  portName: ingestion-server
  resources:
    requests: {}
    # cpu: 100m
    # memory: 512Mi
    limits: {}
    # cpu: 1000m
    # memory: 1.5Gi
# nodeSelector: {}
# affinity:

# Kafka configuration (provided by parent chart when Kafka is deployed separately)
kafka:
  # Kafka broker service name
  brokerService: kafka
  # Kafka broker port
  brokerPort: 9092
  # Kafka replication count
  replicaCount: 1
