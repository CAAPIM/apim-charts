{{- if .Values.config.redis.subChart.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "gateway.fullname" . }}-redis-config
  labels:
    app: {{ template "gateway.name" . }}-redis
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    app.kubernetes.io/component: redis
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  {{- if or .Values.additionalAnnotations .Values.redis.commonAnnotations }}
  {{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- range $key, $val := .Values.redis.commonAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- end }}
data:
  redis.conf: |
    {{- if .Values.redis.configuration }}
{{ .Values.redis.configuration | indent 4 }}
    {{- else }}
    # Redis standalone configuration
    port 6379
    bind 0.0.0.0
    protected-mode {{ if .Values.redis.auth.enabled }}yes{{ else }}no{{ end }}
    # General
    daemonize no
    pidfile /var/run/redis.pid
    loglevel notice
    # Snapshotting
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    # Replication
    replica-serve-stale-data yes
    replica-read-only yes
    # Security
    {{- if .Values.redis.auth.enabled }}
    {{- if .Values.redis.auth.username }}
    # ACL-based authentication (Redis 6+)
    aclfile /etc/redis/users.acl
    {{- else }}
    # Legacy password authentication
    requirepass {{ .Values.redis.auth.password }}
    {{- end }}
    {{- end }}
    # Limits
    maxmemory {{ .Values.redis.maxmemory | default "256mb" }}
    maxmemory-policy {{ .Values.redis.maxmemoryPolicy | default "allkeys-lru" }}
    # Append only mode
    appendonly {{ if .Values.redis.appendonly }}yes{{ else }}no{{ end }}
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    {{- if .Values.redis.tls.enabled }}
    # TLS/SSL
    tls-port 6379
    port 0
    {{- if .Values.redis.tls.autoGenerated }}
    tls-cert-file /opt/redis/certs/tls.crt
    tls-key-file /opt/redis/certs/tls.key
    tls-ca-cert-file /opt/redis/certs/ca.crt
    {{- else }}
    tls-cert-file /opt/redis/certs/{{ .Values.redis.tls.certFilename }}
    tls-key-file /opt/redis/certs/{{ .Values.redis.tls.certKeyFilename }}
    {{- if .Values.redis.tls.certCAFilename }}
    tls-ca-cert-file /opt/redis/certs/{{ .Values.redis.tls.certCAFilename }}
    {{- end }}
    {{- end }}
    tls-auth-clients {{ if .Values.redis.tls.authClients }}yes{{ else }}no{{ end }}
    {{- end }}
    {{- end }}
{{- end }}

