{{- if and (.Values.config.redis.subChart.enabled) (.Values.redis.tls.enabled) (.Values.redis.tls.autoGenerated) }}
{{- $cn := printf "%s-redis.%s.svc.cluster.local" (include "gateway.fullname" .) .Release.Namespace }}
{{- $ca := genCA "redis-ca" 3650 }}
{{- $altNames := list $cn (printf "%s-redis" (include "gateway.fullname" .)) (printf "%s-redis.%s" (include "gateway.fullname" .) .Release.Namespace) (printf "%s-redis.%s.svc" (include "gateway.fullname" .) .Release.Namespace) (printf "%s-redis-headless" (include "gateway.fullname" .)) (printf "%s-redis-headless.%s" (include "gateway.fullname" .) .Release.Namespace) (printf "%s-redis-headless.%s.svc" (include "gateway.fullname" .) .Release.Namespace) (printf "%s-redis-headless.%s.svc.cluster.local" (include "gateway.fullname" .) .Release.Namespace) (printf "%s-redis-0.%s-redis-headless" (include "gateway.fullname" .) (include "gateway.fullname" .)) (printf "%s-redis-0.%s-redis-headless.%s" (include "gateway.fullname" .) (include "gateway.fullname" .) .Release.Namespace) (printf "%s-redis-0.%s-redis-headless.%s.svc" (include "gateway.fullname" .) (include "gateway.fullname" .) .Release.Namespace) (printf "%s-redis-0.%s-redis-headless.%s.svc.cluster.local" (include "gateway.fullname" .) (include "gateway.fullname" .) .Release.Namespace) "localhost" "127.0.0.1" }}
{{- $cert := genSignedCert $cn nil $altNames 3650 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "gateway.fullname" . }}-redis-tls
  labels:
    app: {{ template "gateway.name" . }}-redis
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    app.kubernetes.io/component: redis
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  {{- if or .Values.additionalAnnotations .Values.redis.commonAnnotations }}
  {{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- range $key, $val := .Values.redis.commonAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}