# Listener TLS Secret - Certificate presented to clients by the Kubernetes Gateway listener (frontend).
{{- if and .Values.kubernetesGateway.enabled .Values.kubernetesGateway.gateway.create (include "kubernetesGateway.createListenerTlsSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubernetesGateway.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
type: kubernetes.io/tls
data:
  {{- /* Auto-generate a self-signed certificate using Helm built-in functions */}}
  {{- /* Use lookup to reuse existing secret on upgrade - only generate on initial install */}}
  {{- $secretName := include "kubernetesGateway.tlsSecretName" . }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existingSecret $existingSecret.data }}
  tls.crt: {{ index $existingSecret.data "tls.crt" }}
  tls.key: {{ index $existingSecret.data "tls.key" }}
  {{- else }}
  {{- $fullname := include "gateway.fullname" . }}
  {{- $cn := printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace }}
  {{- $altNames := list $cn $fullname (printf "%s.%s" $fullname .Release.Namespace) (printf "%s.%s.svc" $fullname .Release.Namespace) }}
  {{- $ca := genCA (printf "%s-ca" $fullname) 365 }}
  {{- $cert := genSignedCert $cn nil $altNames 365 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
