# ConfigMap containing the bootstrap script that loads the backend TLS certificate
# as the Gateway's default SSL key via a Graphman key bundle.
{{- if and .Values.kubernetesGateway.enabled .Values.kubernetesGateway.backendTLSPolicy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "gateway.fullname" . }}-script-configmap
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
data:
  010-load-default-ssl-key: |-
    #!/bin/bash
    # Load the default SSL key from mounted PEM certificate/key files.
    # This script is auto-generated by the Gateway Helm Chart when
    # kubernetesGateway.backendTLSPolicy is enabled.
    #
    # Reads from /opt/docker/rc.d/certs/tls.key and tls.crt
    # Writes a Graphman key bundle to bootstrap the default SSL key.
    #
    # The key is only bootstrapped when:
    #   1. The chart is being installed (not upgraded) -- on a db-backed gateway,
    #      the key may have been rotated via an external pipeline or Policy Manager
    #      and bootstrapping would overwrite it.
    #   2. The gateway is running in ephemeral mode (no database) -- there is no
    #      persistent state, so the key must be bootstrapped on every pod start.
    #   3. The user has explicitly set force: true to override the safety check.

    CHART_ACTION="{{ if .Release.IsInstall }}install{{ else }}upgrade{{ end }}"
    DATABASE="{{ .Values.database.enabled }}"
    FORCE="{{ default false .Values.kubernetesGateway.backendTLSPolicy.forceBootstrap }}"

    if [ "$FORCE" != "true" ]; then
        if [ "$CHART_ACTION" = "upgrade" ] && [ "$DATABASE" = "true" ]; then
            echo "010_load_default_ssl_key: SKIPPED - upgrade on db-backed gateway."
            echo "  The SSL key may have been updated externally (e.g. Policy Manager, pipeline)."
            echo "  Bootstrapping would overwrite it. Set kubernetesGateway.backendTLSPolicy.forceBootstrap=true to override."
            exit 0
        fi
    fi

    echo "010_load_default_ssl_key: action=${CHART_ACTION} database=${DATABASE} force=${FORCE}"

    CERT_DIR="/opt/docker/rc.d/certs"
    KEY_FILE="${CERT_DIR}/tls.key"
    CRT_FILE="${CERT_DIR}/tls.crt"
    BUNDLE_DIR="/opt/SecureSpan/Gateway/node/default/etc/bootstrap/bundle"
    OUTPUT_FILE="${BUNDLE_DIR}/011_keybundle.json"

    if [ ! -f "$KEY_FILE" ]; then
        echo "010_load_default_ssl_key: ERROR - Private key file not found: $KEY_FILE"
        exit 1
    fi

    if [ ! -f "$CRT_FILE" ]; then
        echo "010_load_default_ssl_key: ERROR - Certificate file not found: $CRT_FILE"
        exit 1
    fi

    grep -q "BEGIN.*PRIVATE KEY" "$KEY_FILE"
    if [ $? -ne 0 ]; then
        echo "010_load_default_ssl_key: ERROR - $KEY_FILE does not contain a private key"
        exit 1
    fi

    grep -q "BEGIN CERTIFICATE" "$CRT_FILE"
    if [ $? -ne 0 ]; then
        echo "010_load_default_ssl_key: ERROR - $CRT_FILE does not contain a certificate"
        exit 1
    fi

    # Convert private key to single line with literal \n
    KEY_PEM=$(sed 's/\r$//' "$KEY_FILE" | tr '\n' '~' | sed 's/~$//' | sed 's/~/\\n/g')

    # Split tls.crt into individual certificates and build JSON array
    # tls.crt may contain multiple PEM certificates (leaf + intermediates)
    CERT_CHAIN_JSON=""
    LEAF_CERT_B64=""
    CURRENT_CERT=""
    CURRENT_BODY=""
    CERT_INDEX=0
    while IFS= read -r line || [ -n "$line" ]; do
        line=$(echo "$line" | sed 's/\r$//')
        if [ -z "$line" ]; then
            continue
        fi
        CURRENT_CERT="${CURRENT_CERT}${line}\n"
        # Collect the base64 body (skip BEGIN/END lines) - no separators for certBase64
        if ! echo "$line" | grep -q "BEGIN CERTIFICATE" && ! echo "$line" | grep -q "END CERTIFICATE"; then
            CURRENT_BODY="${CURRENT_BODY}${line}"
        fi
        if echo "$line" | grep -q "END CERTIFICATE"; then
            # Remove trailing \n from PEM single-line
            CURRENT_CERT=$(echo "$CURRENT_CERT" | sed 's/\\n$//')
            if [ -z "$CERT_CHAIN_JSON" ]; then
                CERT_CHAIN_JSON="\"${CURRENT_CERT}\""
            else
                CERT_CHAIN_JSON="${CERT_CHAIN_JSON},\"${CURRENT_CERT}\""
            fi
            # Capture the leaf certificate (first cert) base64 body for trustedCerts
            # certBase64 must be a single contiguous base64 string (no line breaks)
            if [ "$CERT_INDEX" -eq 0 ]; then
                LEAF_CERT_B64="${CURRENT_BODY}"
            fi
            CURRENT_CERT=""
            CURRENT_BODY=""
            CERT_INDEX=$((CERT_INDEX + 1))
        fi
    done < "$CRT_FILE"

    # Build the trustedCerts section from the leaf certificate
    TRUSTED_CERTS="{\"name\":\"defaultSsl\",\"verifyHostname\":false,\"trustAnchor\":true,\"revocationCheckPolicyType\":\"USE_DEFAULT\",\"trustedFor\":[\"SSL\",\"SAML_ISSUER\"],\"certBase64\":\"${LEAF_CERT_B64}\"}"

    # Write the Graphman key bundle with keys and trustedCerts
    echo "{\"keys\":[{\"keystoreId\":\"00000000000000000000000000000002\",\"alias\":\"defaultSsl\",\"keyType\":\"RSA\",\"usageTypes\":[\"SSL\"],\"pem\":\"${KEY_PEM}\",\"certChain\":[${CERT_CHAIN_JSON}]}],\"trustedCerts\":[${TRUSTED_CERTS}]}" > "$OUTPUT_FILE"

    echo "010_load_default_ssl_key: Key bundle written to $OUTPUT_FILE"
{{- end }}
