# Backend TLS Secret - Certificate served by the Layer7 Gateway pod to the Kubernetes Gateway controller.
# When auto-generating, the CA ConfigMap is also created here so both share the same CA.
{{- if and .Values.kubernetesGateway.enabled (include "kubernetesGateway.createBackendTlsSecret" .) }}
{{- $fullname := include "gateway.fullname" . }}
{{- $cn := printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace }}
{{- $altNames := list $cn $fullname (printf "%s.%s" $fullname .Release.Namespace) (printf "%s.%s.svc" $fullname .Release.Namespace) }}
{{- if and .Values.kubernetesGateway.backendTLSPolicy.tls.crt .Values.kubernetesGateway.backendTLSPolicy.tls.key }}
{{- /* Mode: User-provided cert/key */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubernetesGateway.backendTlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.kubernetesGateway.backendTLSPolicy.tls.crt | b64enc }}
  tls.key: {{ .Values.kubernetesGateway.backendTLSPolicy.tls.key | b64enc }}
{{- if and .Values.kubernetesGateway.backendTLSPolicy.caCrt (not .Values.kubernetesGateway.backendTLSPolicy.validation) (not .Values.kubernetesGateway.backendTLSPolicy.existingCACertConfigMapName) }}
---
# CA ConfigMap for BackendTLSPolicy validation (user-provided CA)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubernetesGateway.caCertConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
data:
  ca.crt: |
    {{- .Values.kubernetesGateway.backendTLSPolicy.caCrt | nindent 4 }}
{{- end }}
{{- else }}
{{- /* Mode: Auto-generate cert + CA using Helm built-in functions */}}
{{- /* Use lookup to reuse existing secret on upgrade - only generate on initial install */}}
{{- $secretName := include "kubernetesGateway.backendTlsSecretName" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingCM := lookup "v1" "ConfigMap" .Release.Namespace (include "kubernetesGateway.caCertConfigMapName" .) }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- $caCrt := "" }}
{{- if and $existingSecret $existingSecret.data }}
  {{- /* Reuse existing cert/key from the secret (upgrade path) */}}
  {{- $tlsCrt = index $existingSecret.data "tls.crt" }}
  {{- $tlsKey = index $existingSecret.data "tls.key" }}
  {{- if and $existingCM $existingCM.data }}
    {{- $caCrt = index $existingCM.data "ca.crt" }}
  {{- end }}
{{- else }}
  {{- /* Generate new cert + CA (install path) */}}
  {{- $ca := genCA (printf "%s-backend-ca" $fullname) 365 }}
  {{- $cert := genSignedCert $cn nil $altNames 365 $ca }}
  {{- $tlsCrt = $cert.Cert | b64enc }}
  {{- $tlsKey = $cert.Key | b64enc }}
  {{- $caCrt = $ca.Cert }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
{{- if and (not .Values.kubernetesGateway.backendTLSPolicy.validation) (not .Values.kubernetesGateway.backendTLSPolicy.existingCACertConfigMapName) $caCrt }}
---
# Auto-generated CA ConfigMap for BackendTLSPolicy validation
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubernetesGateway.caCertConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
data:
  ca.crt: |
    {{- $caCrt | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.kubernetesGateway.enabled .Values.kubernetesGateway.backendTLSPolicy.enabled .Values.kubernetesGateway.backendTLSPolicy.caCrt (not .Values.kubernetesGateway.backendTLSPolicy.tls.existingSecretName) (not .Values.kubernetesGateway.backendTLSPolicy.tls.crt) (not .Values.kubernetesGateway.backendTLSPolicy.tls.key) (not .Values.kubernetesGateway.backendTLSPolicy.validation) (not .Values.kubernetesGateway.backendTLSPolicy.existingCACertConfigMapName) }}
---
# CA-only mode: customer manages their own backend keys externally.
# Only the CA ConfigMap is created for BackendTLSPolicy validation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubernetesGateway.caCertConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
data:
  ca.crt: |
    {{- .Values.kubernetesGateway.backendTLSPolicy.caCrt | nindent 4 }}
{{- end }}
