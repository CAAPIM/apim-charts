{{- if and .Values.kubernetesGateway.enabled .Values.kubernetesGateway.backendTLSPolicy.enabled }}
{{- if $.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1" }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ template "gateway.fullname" . }}-backendtlspolicy
  namespace: {{ .Release.Namespace }}
  labels:
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kubernetesGateway.backendTLSPolicy.labels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- $annotations := merge (default (dict) .Values.kubernetesGateway.annotations) (default (dict) .Values.kubernetesGateway.backendTLSPolicy.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- range $key, $val := $annotations }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- end }}
spec:
  targetRefs:
    {{- $fullname := include "gateway.fullname" . -}}
    {{- $firstPort := index .Values.service.ports 0 }}
    - group: ""
      kind: Service
      name: {{ $fullname }}
      sectionName: {{ $firstPort.name }}
    {{- $hasMgmtRoute := false }}
    {{- range .Values.kubernetesGateway.httpRoute.rules }}
      {{- if and .backend (eq .backend "management") }}{{ $hasMgmtRoute = true }}{{ end }}
    {{- end }}
    {{- range .Values.kubernetesGateway.tlsRoute.rules }}
      {{- if and .backend (eq .backend "management") }}{{ $hasMgmtRoute = true }}{{ end }}
    {{- end }}
    {{- if $hasMgmtRoute }}
    {{- $mgmtPort := index .Values.management.service.ports 0 }}
    - group: ""
      kind: Service
      name: {{ $fullname }}-management
      sectionName: {{ $mgmtPort.name }}
    {{- end }}
  validation:
    {{- $v := .Values.kubernetesGateway.backendTLSPolicy.validation }}
    hostname: {{ default (printf "%s.%s.svc.cluster.local" (include "gateway.fullname" .) .Release.Namespace) $v.hostname | quote }}
    {{- if $v.wellKnownCACertificates }}
    wellKnownCACertificates: {{ $v.wellKnownCACertificates }}
    {{- else if $v.caCertificateRefs }}
    caCertificateRefs:
      {{- toYaml $v.caCertificateRefs | nindent 6 }}
    {{- else }}
    caCertificateRefs:
      - name: {{ include "kubernetesGateway.caCertConfigMapName" . }}
        group: ""
        kind: ConfigMap
    {{- end }}
{{- else }}
{{- fail "Gateway API CRDs (gateway.networking.k8s.io/v1) are not available on this cluster. Install Gateway API CRDs before enabling kubernetesGateway.backendTLSPolicy." }}
{{- end }}
{{- end }}
