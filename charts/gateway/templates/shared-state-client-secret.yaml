{{- if and (.Values.config.sharedStateClient.enabled) (not .Values.config.sharedStateClient.existingConfigSecret) (or (.Values.config.redis.enabled) (.Values.config.gemfire.external.enabled)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "sharedStateClientSecretName" . }}
  labels:
    app: {{ template "gateway.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if  .Values.additionalAnnotations }}
  annotations:
{{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
{{- end }}
{{- end }}
type: Opaque
stringData:
  sharedstate_client.yaml: |+
    {{- if .Values.config.redis.enabled }}
    redis:
      default:
        commandTimeout: {{ default 5000 .Values.config.redis.commandTimeout }}
        connectTimeout: {{ default 10000 .Values.config.redis.connectTimeout }}
        keyPrefixGroupName: {{ default "l7GW" .Values.config.redis.groupName }}
        testOnStart: {{  default "false" .Values.config.redis.testOnStart }}
        {{- if .Values.config.redis.auth.enabled }}
        {{- if .Values.config.redis.auth.username }}
        username: {{ .Values.config.redis.auth.username | quote }}
        {{- end }}
        {{- if .Values.config.redis.auth.password.encoded }}
        encodedPassword: {{ .Values.config.redis.auth.password.value | quote }}
        {{- else }}
        password: {{ .Values.config.redis.auth.password.value | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.config.redis.sentinel.enabled }}
        type: sentinel
        sentinel:
          master: {{ .Values.config.redis.sentinel.masterSet }}
          nodes:
          {{- if .Values.config.redis.subChart.enabled }}
          - host: {{ .Release.Name }}-redis-node-0.{{ .Release.Name }}-redis-headless.{{ .Release.Namespace }}.svc.cluster.local
            port: 26379
          - host: {{ .Release.Name }}-redis-node-1.{{ .Release.Name }}-redis-headless.{{ .Release.Namespace }}.svc.cluster.local
            port: 26379
          - host: {{ .Release.Name }}-redis-node-2.{{ .Release.Name }}-redis-headless.{{ .Release.Namespace }}.svc.cluster.local
            port: 26379
          {{- else }}
          {{- range .Values.config.redis.sentinel.nodes }}
          - host: {{ .host }}
            port: {{ .port }}
          {{- end }}
          {{- end }}
        {{- else }}
        type: standalone
        standalone:
          {{- if .Values.config.redis.subChart.enabled }}
          host: {{ .Release.Name }}-redis-master-0.{{ .Release.Name }}-redis-headless.{{ .Release.Namespace }}.svc.cluster.local
          port: 6379
          {{- else }}
          host: {{ .Values.config.redis.standalone.host }}
          port: {{ .Values.config.redis.standalone.port }}
          {{- end }}
          {{- end }}
        ssl:
          enabled: {{ .Values.config.redis.tls.enabled }}
          {{- if .Values.config.redis.tls.enabled }}
          verifyPeer: {{ .Values.config.redis.tls.verifyPeer }}
          {{- end }}
          {{- if .Values.config.redis.tls.verifyPeer }}
          cert: redis.crt
          {{- end }}
      {{- if  .Values.config.redis.additionalProviders }}
      {{- range .Values.config.redis.additionalProviders }}
      {{- toYaml .config | nindent 6 }}
      {{- end }}
      {{- end }}
    {{- if  .Values.config.sharedStateClient.additionalProviders }}
    {{- range .Values.config.sharedStateClient.additionalProviders }}
    {{- toYaml .config | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- end }}

    {{- if .Values.config.gemfire.external.enabled }}
    gemfire:
      testOnStart: {{  default "false" .Values.config.gemfire.external.testOnStart }}
      locators:
        {{- range .Values.config.gemfire.useExistingLocators }}
        - host: {{ .host }}
          port: {{ .port }}
        {{- end }}
      gwCounterRegionName: {{  default "layer7gw_counter" .Values.config.gemfire.external.gwCounterRegionName }}
      gwRateLimiterRegionName: {{  default "layer7gw_ratelimiter" .Values.config.gemfire.external.gwRateLimiterRegionName }}
      gwKeyValueRegionName: {{  default "layer7gw_keyvalue" .Values.config.gemfire.external.gwKeyValueRegionName }}
      gwSortedSetRegionName: {{  default "layer7gw_sortedset" .Values.config.gemfire.external.gwSortedSetRegionName }}
      {{- if .Values.config.gemfire.auth.enabled }}
      {{- if .Values.config.gemfire.auth.username }}
      username: {{ .Values.config.gemfire.auth.username | quote }}
      {{- end }}
      {{- if .Values.config.gemfire.auth.password }}
      password: {{ .Values.config.gemfire.auth.password | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.config.gemfire.tls.enabled }}
      ssl:
        enabled: true
        keystore: /opt/SecureSpan/Gateway/node/default/etc/bootstrap/providers/keystore.p12
        keystorePassword: {{ .Values.config.gemfire.tls.password }}
        truststore: /opt/SecureSpan/Gateway/node/default/etc/bootstrap/providers/truststore.p12
        truststorePassword: {{ .Values.config.gemfire.tls.password }}
      {{- end }}
      {{- if .Values.config.gemfire.external.dynamicProperties }}
      dynamicProperties:
{{ .Values.config.gemfire.external.dynamicProperties | indent 8 }}
      {{- end }}
    {{- end }}
{{- end }}