{{ if (eq (include "embedded.gemfire.enabled" .) "true") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-emb-gemfire-security-manager-configmap
  labels:
    app: {{ template "gateway.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if  .Values.additionalAnnotations }}
  annotations:
{{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
{{- end }}
{{- end }}
binaryData:
  layer7-gemfire-security-jar:  
immutable: true
{{- end }}
