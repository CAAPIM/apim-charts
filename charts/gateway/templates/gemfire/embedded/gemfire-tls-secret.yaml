{{- if and (.Values.config.gemfire.embedded.enabled) (not .Values.config.gemfire.embedded.tls.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-gemfire-cert
  labels:
    app: {{ template "gateway.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if  .Values.additionalAnnotations }}
  annotations:
  {{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- end }}
type: Opaque
stringData:
  password: {{ .Values.clusterPassword }}
{{- end }}