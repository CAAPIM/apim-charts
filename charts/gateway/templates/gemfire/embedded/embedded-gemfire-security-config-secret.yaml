{{- if or (.Values.config.gemfire.auth.enabled) (.Values.config.gemfire.tls.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-emb-gemfire-security-properties
  labels:
    app: {{ template "gateway.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if  .Values.additionalAnnotations }}
  annotations:
  {{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
  {{- end }}
  {{- end }}
type: Opaque
stringData:
  gfsecurity.properties: |+
    {{- if ( .Values.config.gemfire.auth.enabled) }}
    security-manager=com.l7tech.external.assertions.gemfire.BasicSecurityManager
    {{- if ( .Values.config.gemfire.auth.username) }}
    security-username={{ .Values.config.gemfire.auth.username }}
    {{- else }}
    security-username=default
    {{- end }}
    {{- if ( .Values.config.gemfire.auth.password )}}
    security-password={{ .Values.config.gemfire.auth.password }}
    {{- else }}
    security-password={{ .Values.clusterPassword }}
    {{- end }}
    {{- end }}
    
    {{- if (.Values.config.gemfire.tls.enabled) }}
    ssl-keystore=/opt/SecureSpan/Gateway/node/default/etc/bootstrap/assertions/EmbeddedGemfireSharedStateProviderAssertion/keystore.p12
    {{- if .Values.config.gemfire.tls.existingSecret }}
    ssl-keystore-password={{ .Values.config.gemfire.tls.password }}
    {{- else }}
    ssl-keystore-password={{ .Values.clusterPassword }}
    {{- end }}
    ssl-truststore=/opt/SecureSpan/Gateway/node/default/etc/bootstrap/assertions/EmbeddedGemfireSharedStateProviderAssertion/truststore.p12
    {{- if .Values.config.gemfire.tls.existingSecret }}
    ssl-truststore-password={{ .Values.config.gemfire.tls.password }}
    {{- else }}
    ssl-truststore-password={{ .Values.clusterPassword }}
    {{- end }}
{{ .Values.config.gemfire.tls.additionalProperties | indent 4 }}
    {{- end }}
{{- end }}