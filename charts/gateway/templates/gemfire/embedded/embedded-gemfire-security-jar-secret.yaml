{{- if and (.Values.config.gemfire) (.Values.config.gemfire.auth.enabled)  }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-emb-gemfire-security-manager-jar
  labels:
    app: {{ template "gateway.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if  .Values.additionalAnnotations }}
  annotations:
{{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
{{- end }}
{{- end }}
type: Opaque
data:
  layer7-gemfire-security.jar: 
{{- end }}