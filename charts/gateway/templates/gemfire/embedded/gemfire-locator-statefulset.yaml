{{- if and (eq (include "embedded.gemfire.enabled" .) "true") (empty .Values.config.gemfire.embedded.useExistingLocators) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Release.Name }}-gemfire-locator
  labels:
    app: {{ template "gateway.name" . }}-gemfire-locator
    chart: {{ template "gateway.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
  {{- if  .Values.additionalAnnotations }}
  annotations:
    "helm.sh/hook": pre-install,post-upgrade
    "helm.sh/hook-weight": "-5"
{{- range $key, $val := .Values.additionalAnnotations }}
    {{ $key }}: "{{ $val }}"
{{- end }}
{{- end }}
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  revisionHistoryLimit: 10
  replicas: {{ .Values.config.gemfire.embedded.externalLocators.replicas }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-gemfire-locator
  serviceName: {{ $.Release.Name }}-gemfire-locator
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-gemfire-locator
        release: {{ .Release.Name }}
    {{- if  .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
    {{- end }}
    {{- if  .Values.podAnnotations }}
      annotations: {{- toYaml .Values.podAnnotations | nindent 8 }}
    {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}-gemfire-locator
          image: {{ .Values.config.gemfire.embedded.externalLocators.image.registry }}/{{ .Values.config.gemfire.embedded.externalLocators.image.repository }}:{{ .Values.config.gemfire.embedded.externalLocators.image.tag }}
          imagePullPolicy: {{ .Values.config.gemfire.embedded.externalLocators.image.pullPolicy }}
          args: 
            - gfsh
            - start 
            - locator 
            - --name=$(POD_NAME) 
            - --hostname-for-clients=localhost
            - --J='-Dgemfire.jmx-manager-hostname-for-clients=localhost'
            - --locators={{ template "embedded.gemfire.locators" $ }}
          env:
            - name: ACCEPT_TERMS
              value: {{ include "gemfire.acceptedTerms" . }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              cpu: "8"
              memory: 16384Mi
            requests:
              cpu: "1"
              memory: 1024Mi
          volumeMounts:
            - name: data
              mountPath: /data
         
{{- end }}