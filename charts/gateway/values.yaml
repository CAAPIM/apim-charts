        tls:
          enabled: false
  redis:
    # enable or disable redis integration
    # please uncomment the 5 redis properties in config.systemProperties
    # view more configurable system properties here - https://techdocs.broadcom.com/us/en/ca-enterprise-software/layer7-api-management/api-gateway/congw11-1/policy-assertions/assertion-palette/service-availability-assertions/key-value-storage-assertions.html#_c8b71b7b-dd84-4ee6-9771-d0bc262c36e9_sys_prop_configs
    # Redis client properties for configuring Redis Standalone or Redis Sentinel connections
    # This configuration is parsed into redis.default in sharedstate_client.yaml
    enabled: false
    # We recommend using an existing secret for Redis configuration in production environments
    # for separation of concerns and to better secure Redis client property secrets.
    # redis configuration must have a key called redis.properties (see the Redis Configuration in the readme for more details)
    # existingConfigSecret: redis-config-secret
    # To configure the Redis client directly in this values file uncomment and/or set the following client properties
    groupName: l7GW
    commandTimeout: 5000
    connectTimeout: 10000
    testOnStart: false
    # The Gateway supports Redis master auth only.
    # If trying out auth using the subChart redis.auth.enabled should be true, and redis.auth.sentinel should be false (default)
    # If redis.auth.sentinel is enabled in the redis subChart or on your External Redis Sentinel Deployment, the Gateway will fail to start.
    auth:
      enabled: false
    # username: username
      password:
        encoded: false
        value: mypassword
    # In standalone mode auth and ssl/tls is only available starting from Gateway v11.1.00
    # this is for testing only and is not supported in
    # production environments
    sentinel:
      enabled: false
      masterSet: mymaster
      # If the subChart is not enabled sentinel nodes need to be set
      nodes:
      - host: <host>
        port: <port>
      - host: <host>
        port: <port>
      - host: <host>
        port: <port>
    standalone: {}
    #  host: redis-standalone
    #  port: 6379
    tls:
      enabled: true
      existingSecret: ""
      verifyPeer: true
      # redisCrt: |+
      #   -----BEGIN CERTIFICATE-----
      #   MIIEGzCCAwOgAwIBAgIRANzOj1Mgxk7VRFClPaQnUGgwDQYJKoZIhvcNAQELBQAw
      #   ....
      #   -----END CERTIFICATE-----
    # Enable subChart to have Helm optionally deploy Redis Standalone with your gateways.
    subChart:
      # This naming convention has remained the same for continuity with previous versions of the chart.
      # The Redis subChart has been replaced with a simple Redis StatefulSet implementation included in the Gateway Chart.
      # Using the provided Redis StatefulSet is a test/development only example. DO NOT use in production!! You will need your own Redis server for this integration.
      enabled: false
    additionalProviders: []
    # - name: myRegionalRedisInstance1
    #   redis:
    #     tls:
    #       existingSecret: myRegionalRedisCertSecret1
    #       key: redis.crt
    #       # path must match ssl.cert in your provider config
    #       path: myRegionalRedisCert.crt
    #   config: {}
    #   config:
    #     regional:
    #       type: sentinel
    #       keyPrefixGroupName: test
    #       username: abc
    #       password: "def"
    #       commandTimeout: 5000
    #       connectTimeout: 10000
    #       testOnStart: false
    #       ssl:
    #         enabled: true
    #         cert: myRegionalRedisCert.crt
    #         verifyPeer: false
    #       sentinel:
    #         master: mymaster
    #         nodes:
    #         - host: 127.0.0.1
    #           port: 26379
    #         - host: 192.168.0.1
    #           port: 26379

  # Configuration for GemFire, a distributed data management platform.
  gemfire:
    # Must be set to true to enable GemFire functionality, indicating that the GemFire terms of use have been accepted.
    acceptTerms: true
    # Authentication configuration for the GemFire peer.
    auth:
      enabled: false
    # username:
    # password:
    # SSL configuration for embedded GemFire.
    tls:
      enabled: false
      certificate:
        issuerRef:
          kind: ClusterIssuer
          name: myClusterIssuer
    # existingSecret:
    # password:
      # Additional SSL properties for embedded GemFire.
      additionalProperties: |-
        ssl-require-authentication=true
        ssl-ciphers=any
        ssl-protocols=any
        ssl-endpoint-identification-enabled=false
        ssl-enabled-components=all
        ssl-keystore-type=PKCS12
        ssl-truststore-type=PKCS12
    useExistingLocators: []
    # - locator1[port]
    # - locator2[port]
    # Configuration for embedded GemFire, where GemFire caches run within the Gateway process.
    embedded:
      enabled: false
      caches:
        # Additional properties for embedded GemFire caches.
        additionalProperties: |-
          statistic-sampling-enabled=false

      externalLocators:
        # The number of GemFire locator replicas to deploy when using embedded GemFire.
        replicas: 2
        image:
          registry: docker.io
          repository: gemfire/gemfire
          tag: 10.2.0-jdk21
          pullPolicy: IfNotPresent
        resources:
          limits: {}
          requests: {}
        persistence:
          size: 2Gi
      # A list of existing GemFire locators to use instead of deploying new ones. Each locator should be specified in the format "locator-host[port]".

    # Configuration for the Gateway's GemFire client, to connect to external GemFire caches and locators.
    external:
      enabled: false
      testOnStart: false
      gwCounterRegionName: layer7gw_counter
      gwRateLimiterRegionName: layer7gw_ratelimiter
      gwKeyValueRegionName: layer7gw_keyvalue
      gwSortedSetRegionName: layer7gw_sortedset
#      dynamicProperties: |-

    managementConsole:
      # Enable the GemFire Management Console, which provides a management dashboard.
      enabled: false
      service:
        port: 8080
        annotations: {}
      image:
        registry: docker.io
        repository: gemfire/gemfire-management-console
        tag: 1.4.1
        pullPolicy: IfNotPresent

  # In Gateway v11.1.1 shared state providers like redis (redis only currently) can be configured in a yaml file.
  # In Gateway v11.1.3 gemfire can be configured in a yaml file
  sharedStateClient:
    # Note: For this configuration to take effect config.redis.enabled or config.gemfire.external.enabled must be also be true
    enabled: true
  # If you are using an existingConfigSecret for more than one shared state client that requires a tls cert, please use the customConfig section to mount
  # existingConfigSecret: shared-state-client-secret
  # reserved for future use
    additionalProviders: []

## Reference an existing secret for sensitive Gateway fields
## Note that additionalSecret will no longer take effect when existingGatewaySecret is set.

# existingGatewaySecretName: ssg-secret

## The folllowing must be included
  # SSG_ADMIN_USERNAME
  # SSG_ADMIN_PASSWORD
  # SSG_CLUSTER_PASSWORD
## If using a Database
  # SSG_DATABASE_USER
  # SSG_DATABASE_PASSWORD

# Cluster Hostname
clusterHostname: my.localdomain

# Database configuration
database:
  # DB Backed or ephemeral
  enabled: true
  # A MySQL Database is configured with this Chart, set to false and set jdbcURL to use your own DB server
  # Do not use this demo database in production!!!
  create: true
  # jdbcURL: jdbc:mysql://<host>:<port>/<database> | jdbc:mysql://<host>:<port>,<host>:<port>/<database>,...
  # Configurable, update the mysql.auth.<settings> if you change this and would like to use the demo database server.
  username: gateway
  password: mypassword
  # Liquibase log level can be set to one of the following.
  # This configuration is only valid from Gateway v11.1.1 onwards.
  # severe/warning/info/fine(debug)/off
  liquibaseLogLevel: "off"
  name: ssg
  # This pre-upgrade job executes any pending database schema updates and exits. The job executes before the rollout of new Gateways.
  # Ensure the requirements are met before enabling.
  # Requirement: The Gateway must be 11.2.2 or newer which supports applying db schema changes and exiting without starting Gateway.
  # Warning, if this job fails, it may leave the DATABASECHANGELOGLOCK locked in which case
  # the lock must be manually removed before a retry can be attempted.
  migrationJob:
    # Opt-in: set to true only when running helm upgrade against a Gateway 11.2.2+ image.
    # This job does not run on helm install (it is a pre-upgrade hook only).
    enabled: false
    # Optional: Override the JDBC URL used by the migration job. Recommended to specify the primary writer endpoint
    # to avoid routing through a load balancer or proxy during schema updates. If not set, falls back to database.jdbcURL.
    jdbcUrl: ""

    # Set to true to force release of any stuck Liquibase db schema locks before running the schema updates.
    # Warning: use with caution as another simultaneous db schema update may corrupt the db schema.
    clearLocks: false
    # The maximum duration (in seconds) the job is allowed to run before being terminated.
    activeDeadlineSeconds: 300
  # Embedded database type selection. Leave empty to use the default (derby).
  # Set to "h2" to use the H2 embedded database. Requires database.enabled: false.
  # type: "h2"
  type: ""

## If loading a TLS Key/Pair
# This key will become the default ssl key. Can only have one.
# use with helm command: --set-file tls.key=/path/to/ssl.p12 --set tls.pass=keypass
## Reference an existing secret for the Gateway Private Key, the secret needs to contain the following.
  # SSG_SSL_KEY - decoded value needs to be base64 encoded. (cat ssl.p12 | base64 --wrap=0)
  # SSG_SSL_KEY_PASS
tls:
  useSignedCertificates: false
  # existingSecretName: ssg-tls
# It is not recommendeded to load private keys in values.yaml, use an existingTlsSecret.
  key:
  pass:

# Cluster Password
clusterPassword: mypassword

# Rollout Gateway deployment when the primary Gateway ConfigMap Changes.
# This does not apply to cluster wide properties, listen ports or the Gateway secret
restartOnConfigChange:
  enabled: false

# This enables/disables Policy Manager Access and sets the SSG_ADMIN username and password
# Credentials will be moved to a secret object in the next push..
management:
  enabled: true
  # Enable Restman, if DBbacked this setting will persist until manually deleted via Policy Manager.
  restman:
    enabled: false
  # Enable Graphman (placeholder)
  graphman:
    enabled: false
  # This is the username/password used for Policy Manager/Gateway Management.
  username: admin
  password: mypassword
  # This optionally loads the Kubernetes Service Account token as a secure password for use in Policy.
  kubernetes:
    loadServiceAccountToken: false
  service:
    enabled: true
    # Gateway Management Service ipFamilyPolicy
    # SingleStack, PreferDualStack or RequireDualStack
    # ipFamilyPolicy: PreferDualStack
    # Gateway Management Service ipFamilies
    # ["IPv4"], ["IPv6"], ["IPv4", "IPv6"] or ["IPv6", "IPv4"]
    ipFamilies: []
    type: LoadBalancer
    ## Load Balancer sources
    ## https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
    # loadBalancerSourceRanges:
    # - 10.10.10.0/24
    ## Set the ExternalIPs
    # externalIPs:
    ## Set the LoadBalancerIP
    # loadBalancerIP:
    # loadBalancerClass: "mylbclass"
    annotations: {}
      # cloud.google.com/load-balancer-type: "Internal"
    ports:
      # - name: https
      #   internal: 8443
      #   external: 8443
      #   protocol: TCP
      - name: management
        internal: 9443
        external: 9443
        protocol: TCP
    # Uncomment the following section to enable session affinity
    # sessionAffinity: ClientIP
    # sessionAffinityConfig:
    #   clientIP:
    #     timeoutSeconds: 10800

    # Internal Traffic Policy - https://kubernetes.io/docs/concepts/services-networking/service-traffic-policy/#using-service-internal-traffic-policy
    # internalTrafficPolicy: Cluster
    # External Traffic Policy - https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    # externalTrafficPolicy: Cluster

service:
  # Service Type, ClusterIP, NodePort, LoadBalancer
  type: LoadBalancer
  # Gateway Service ipFamilyPolicy
  # SingleStack, PreferDualStack or RequireDualStack
  # ipFamilyPolicy: PreferDualStack
  # Gateway Service ipFamilies
  # ["IPv4"], ["IPv6"], ["IPv4", "IPv6"] or ["IPv6", "IPv4"]
  ipFamilies: []
  ## Load Balancer sources
  ## https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
  # loadBalancerSourceRanges:
  # - 10.10.10.0/24
  ## Set the ExternalIPs
  # externalIPs:
  ## Set the LoadBalancerIP
  # loadBalancerIP:
  # loadBalancerClass: "mylbclass"
  # Update this port list if additional ports need to be exposed
  ports:
    - name: https
      internal: 8443
      external: 8443
      protocol: TCP
    # - name: management
    #   internal: 9443
    #   external: 9443
    #   protocol: TCP
  # Additional Service annotations, the example below shows configuration for an internal load balancer on GCP
  # See the docs for more ==> https://kubernetes.io/docs/concepts/services-networking/service/
  annotations: {}
    # cloud.google.com/load-balancer-type: "Internal"
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"

  # Uncomment the following section to enable session affinity
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800

  # Internal Traffic Policy - https://kubernetes.io/docs/concepts/services-networking/service-traffic-policy/#using-service-internal-traffic-policy
  # internalTrafficPolicy: Cluster
  # External Traffic Policy - https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  # externalTrafficPolicy: Cluster

# This enables/disables otk install or upgrade.
# Prerequisites.
#  1. OTK DB is installed.
#  2. Restman is enabled for DB backed Gateway. Can be disabled once the install/upgrade is complete (management.restman.enabled: true)
#  Note: In dual gateway installation, restart the pods after OTK install or upgrade.
otk:
  enabled: false
  # OTK installation type - SINGLE, DMZ or INTERNAL
  type: SINGLE

  # Force install or upgrade by uninstalling existing otk solution kit and install.
  forceInstallOrUpgrade: false

  # Not applicable for DMZ and INTERNAL OTK types. Install/Upgrade portal sub solution kits.
  enablePortalIntegration: false
  skipPostInstallationTasks: false
  skipInternalServerTools: false

  # Restman host and port (optional). Valid only for db backed gateways
  # Default - gateway service
  # restmanHost:
  # Default -  8443
  # restmanPort:

  # Specify internal gateway host and port for DMZ OTK type
  # internalGatewayHost:
  # internalGatewayPort:

  # Specify DMZ gateway host and port for internal OTK type
  # dmzGatewayHost:
  # dmzGatewayPort:

  # Network mask and startIP used in the 'Restrict Access to IP Address Range Assertion' to protect the schedule jobs and health checks.
  # The db maintenance and health check services can accessible based on the IP address.
  # https://techdocs.broadcom.com/us/en/ca-enterprise-software/layer7-api-management/api-gateway/10-1/policy-assertions/assertion-palette/service-availability-assertions/restrict-access-to-ip-address-range-assertion.html
  # networkMask: 16
  # startIP: 240.224.2.1

  cert:
    # Specify DMZ gateway certificates that needs to be imported to Internal GW (for ephemeral gateway)
    # dmzGatewayCert:
    # dmzGatewayIssuer:
    # dmzGatewaySerial:
    # dmzGatewaySubject:

    # Specify Internal gateway certificates that needs to be imported for DMZ GW (for ephemeral gateway)
    # internalGatewayCert:
    # internalGatewayIssuer:
    # internalGatewaySerial:
    # internalGatewaySubject:

  # List of comma separated sub solution Kits to install or upgrade.
  # subSolutionKitNames:

  customizations:

    # This mounts one or more bundles that exist as secrets or configmaps in your Kubernetes Cluster.
    # When creating these secrets/configmaps the format should be
    # key: bundle1.bundle value: <xml value>
    # Each bundle that you create as a ConfigMap can not exceed 1MB in size.
    # Ephemeral Gateway: Copies the bundles into Gateways bundle folder (/opt/SecureSpan/Gateway/node/default/etc/bootstrap/bundle/000OTK)
    # DB backed Gateway: Applies bundles to the Gateway using Restman calls (PUT /restman/1.0/bundle)
    existingBundle:
      enabled: false
      configMaps: []
      # - name: otkbundle1
      #   configMap:
      #     defaultMode: 420
      #     optional: false
      #     name: otkbundle1
      # - name: otkbundle1

      secrets: []
      # - name: secretotkbundle1
      #   csi:
      #     driver: secrets-store.csi.k8s.io
      #     readOnly: true
      #     volumeAttributes:
      #       secretProviderClass: "secret-provider-class-name"
      # - name: secretotkbundle2

  job:
    image:
      repository: caapim/otk-install
      tag: 4.7.0
      # OTK 4.6.4 & 4.7.0 are presently the only versions that provides seamless support for Gateway versions 11.2 & greater
      # There are limitations in older versions (< OTK 4.6.4) with respect to Evaluate JSON Path Assertion (V1) assertion & other support limitations
      # This requires specific actions as mentioned in the release notes Chart Version 3.0.41
      pullPolicy: IfNotPresent
    imagePullSecret:
      enabled: false
    # Valid only for ephemeral gateway. Creates cronJobs for each OTK DB maintenance schedule tasks.
    scheduledTasks:
      - name: client
        schedule: "*/31 * * * *"
      - name: idtoken
        schedule: "*/29 * * * *"
      - name: sessions
        schedule: "*/7 * * * *"
      - name: token
        schedule: "*/5 * * * *"
      - name: trl
        schedule: "0 */1 * * *"
      - name: miscellaneous
        schedule: "*/5 * * * *"

    scheduledTasksSuccessfulJobsHistoryLimit: 1
    scheduledTasksFailedJobsHistoryLimit: 1

    labels: {}
    # nodeSelector: {}
    # tolerations: []
    ## Pod Labels for the OTK install Pod
    ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
    podLabels: {}

    # Pod Annotations apply to the OTK install Pod
    ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    podAnnotations: {}

    resources:
      requests: {}
      # memory: 64Mi
      # cpu: 200m
      limits: {}
      # memory: 128Mi
      # cpu: 250m

  database:
    # OTK database type - mysql/oracle/cassandra
    type: mysql
    connectionName: OAuth
    # OTK database dbUpgrade - Enable/Disable auto upgrade of OTK MySQL or Oracle DB
    dbUpgrade: true
    # OTK database useDemoDb - install/upgrade OTK DB on the gateways MySQL container for a quick test deployment. Do not use this in production deployments.
    useDemoDb: true

    # OTK database user name and password used to create Gateway Database/cassandra connection.
    username: otk_user
    password: mypassword

    # existingSecretName: otkDbSecret

    # Database connection properties
    properties: {"maximumPoolSize":15, "minimumPoolSize":3}

    # For Cassandra driverConfig is supported from GW 11.0. Either otk.database.cassandra.driverConfig or otk.database.properties should be provided
    # properties: {"localDataCenterName" : "DC1"}

    # Update database connection properties during helm upgrade.
    updateConnection: true

    sql:

      # If provided, used to create OTK schema and tables.
      # ddlUsername:
      # ddlPassword:

      # jdbcURL: jdbc:mysql://<host>:<port>/<database>
      jdbcURL:
      jdbcDriverClass: com.mysql.jdbc.Driver
      # Oracle database name or MySQL demo db name
      databaseName: otk_db

      # c3p0 connection properties.
      # connectionProperties: {"c3p0.maxConnectionAge":"100","c3p0.maxIdleTime":"1000"}

      # For mysql & oracle setup test clients
      createTestClients: false
      # Test clients redirect Url prefix. Required if createTestClients is true.
      testClientsRedirectUrlPrefix:

    cassandra:
      # connectionPoints:
      # port:
      # keyspace:
      # For Cassandra driverConfig is supported from GW 11.0. Either otk.database.cassandra.driverConfig or otk.database.properties should be provided
      # driverConfig: {"localDataCenterName" : "DC1"}

    # Optionally configure read only database connection for MySQL/Oracle.
    readOnlyConnection:
      enabled: false
      # connectionName: OAuth_ReadOnly
      # existingSecretName: otkReadOnlyDbSecret
      # username: root
      # password: 7layer
      # properties: {"maximumPoolSize":15, "minimumPoolSize":3}
      # connectionProperties: {"c3p0.maxConnectionAge":"100","c3p0.maxIdleTime":"1000"}

      jdbcURL: jdbc:mysql://<host>:<port>/<database>
      jdbcDriverClass: com.mysql.jdbc.Driver
      # Oracle database name
      databaseName:

    # Optionally configure Client read database connection for MySQL/Oracle.
    clientReadConnection:
      enabled: false
      # connectionName: Oauth_Client_Read
      # existingSecretName: otkClientReadSecret
      # username: root
      # password: 7layer
      # properties: {"maximumPoolSize":15, "minimumPoolSize":3}
      # connectionProperties: {"c3p0.maxConnectionAge":"100","c3p0.maxIdleTime":"1000"}

      jdbcURL: jdbc:mysql://<host>:<port>/<database>
      jdbcDriverClass: com.mysql.jdbc.Driver
      # Oracle database name
      databaseName:

  # Install OTK Health check bundle on gateway. Uses config map.
  # Alternatively the bundle can be loaded using config map external to helm (useExisting: true)
  # The bundle content can be found at https://github.com/CAAPIM/apim-charts/blob/stable/charts/gateway/bundles/otk-healthcheck.bundle
  healthCheckBundle:
    enabled: false
    useExisting: false
    name: otk-health-check-bundle-config

  # OTK Specific configuration:
  # - The liveliness probe is not supported for OTK 4.6 & below versions.
  # - Only valid for SINGLE and INTERNAL OTK types. Not be enabled for a DMZ OTK type.
  # - In a dual gateway OTK setup, it is recommended enable liveness probe after the pods restart.
  # - Should be enabled after OTK installation.
  # - otk.livenessProbe.type as httpGet
  # - otk.livenessProbe.path /auth/oauth/health
  # - otk.livenessProbe.port 8443
  # - otk.livenessProbe.scheme https
  livenessProbe:
    enabled: false
    type: httpGet
    httpGet:
      path: /auth/oauth/health
      port: 8443

  # OTK Specific configuration:
  # - The readinessProbe probe is not supported for OTK 4.6 & below versions.
  # - Only valid for SINGLE and INTERNAL OTK types. Not be enabled for a DMZ OTK type.
  # - In a dual gateway OTK setup, it is recommended enable readiness probe after the pods restart.
  # - Should be enabled after OTK installation.
  # - otk.readinessProbe.type as httpGet
  # - otk.readinessProbe.path /auth/oauth/health
  # - otk.readinessProbe.port 8443
  # - otk.readinessProbe.scheme https
  readinessProbe:
    enabled: false
    type: httpGet
    httpGet:
      path: /auth/oauth/health
      port: 8443

# This project does not currently support Google's GCE controller.
# The default way to expose the Gateway is via L4 Load Balancer because it goes far beyond the HTTP(S) limitation ingress currently imposes
# Certificates are not created here, please specify an existing cert secret to use if enabling TLS
ingress:
  # Set to true to create ingress or route object
  enabled: false
  # Set openshift.route.enabled to true if you are using Openshift and would like to use routes
  openshift:
    route:
      enabled: false
      wildcardPolicy: None
    # weight: 100

  # Ingress Class Name
  ingressClassName: nginx
  # Ingress labels (also apply to routes)
  labels: {}
  # Ingress annotations (also apply to routes)
  annotations: {}
  # nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  # nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  # When the ingress is enabled, a host pointing to this will be created
  tls:
  - hosts:
    - dev.ca.com
    secretName: default
  # - hosts:
  #   - dev1.ca.com
  #   secretName: default
  rules:
  - host: dev.ca.com
    path: "/"
    service:
      port:
        name: https
      # number:
    # Per-rule annotations (OpenShift Routes only). Merged with ingress.annotations.
    # annotations:
    #   haproxy.router.openshift.io/timeout: 5m
  # - host: dev1.ca.com
  #   path: "/"
  #   service:
  #     port:
  #       name: https
      # number:
  # - host: dev-pm.ca.com
  #   path: "/"
  #   backend: management
  #   service:
  #     port:
  #       name: management
        # number:

# Kubernetes Gateway API Configuration
# ref: https://gateway-api.sigs.k8s.io/
# NOTE: Gateway API support is EXPERIMENTAL. Support depends on your Gateway controller.
# Contour and EnvoyGateway examples are provided in the examples/ingress directory.
# ref: https://gateway-api.sigs.k8s.io/implementations/
kubernetesGateway:
  # -- Enable Kubernetes Gateway API resources.
  # When enabled, the chart creates routes pointing to the chart's own service.
  # Customize each sub-section as needed.
  enabled: false

  # --- Gateway Resource (gateway.networking.k8s.io/v1) ---
  # Controls the Kubernetes Gateway resource.
  # Set gateway.create: true to create a new Gateway, or leave as false
  # and provide existingRef to attach routes to an existing Gateway.
  gateway:
    # -- Create a new Gateway resource managed by this chart
    create: false
    # -- GatewayClass name (e.g. contour, eg). Required when create: true.
    gatewayClassName: ""
    # -- Optional addresses requested for the Gateway (e.g. static IPs).
    # ref: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.GatewayAddress
    addresses: []
    # - type: IPAddress
    #   value: "1.2.3.4"
    # -- Reference to an existing Gateway resource. Used when create: false.
    # Routes will use this as their parentRef.
    existingRef:
      name: ""
      namespace: ""

    # -- TLS configuration for the Gateway listener(s).
    # Part of the Gateway spec (spec.listeners[].tls).
    # The listener TLS secret is the certificate presented to clients (frontend).
    # Two modes:
    #   1. Reference an existing secret: set existingSecretName
    #   2. Auto-generate: leave existingSecretName empty
    #      A self-signed certificate is generated using Helm built-in functions.
    tls:
      # -- Reference an existing kubernetes.io/tls Secret.
      # When set, no TLS secret is created by this chart.
      existingSecretName: ""

    # -- Additional labels for the Gateway resource
    labels: {}
    # -- Additional annotations for the Gateway resource
    annotations: {}

  # --- HTTPRoute (gateway.networking.k8s.io/v1) ---
  # Used for TLS termination at the Gateway with re-encryption to the backend.
  # parentRefs are auto-resolved from gateway.create or gateway.existingRef.
  httpRoute:
    # -- Enable HTTPRoute resource
    enabled: true
    # -- HTTPRoute rules. Each rule creates a backendRef to the chart's own service.
    # Rules are grouped by hostname - rules with the same hostname become one HTTPRoute.
    # Set hostname on a rule to create a dedicated HTTPRoute for that host.
    # Set backend: management to route to the management service.
    # port is the Layer7 Gateway service port (service.ports[].external
    # or management.service.ports[].external).
    rules:
    # Example: per-hostname routing with management service
      - hostname: dev.ca.com
        port: 8443
        matches:
        - path:
            type: PathPrefix
            value: /
      - hostname: dev-pm.ca.com
        port: 9443
        backend: management
        matches:
        - path:
            type: PathPrefix
            value: /
    # -- Additional labels for the HTTPRoute resource
    labels: {}
    # -- Additional annotations for the HTTPRoute resource
    annotations: {}

  # --- BackendTLSPolicy (gateway.networking.k8s.io/v1) ---
  # Configures TLS from the Gateway to the backend (Layer7 Gateway) pod.
  # Required when using httpRoute since the backend speaks HTTPS and the
  # Gateway API does not support tlsSkipVerify.
  backendTLSPolicy:
    # -- Enable BackendTLSPolicy resource
    enabled: true
    # -- Ports to exclude from BackendTLSPolicy targetRefs.
    # List of external port numbers (from service.ports[].external) that do not
    # speak TLS. By default (empty), the policy applies to all service ports
    # (sectionName is omitted). When set, each non-excluded port gets an
    # explicit targetRef with sectionName.
    excludePorts: []
    # - 8080
    # -- TLS validation configuration for the backend connection.
    # Each sub-field has an intelligent default when left empty:
    #   hostname        -- defaults to <fullname>.<namespace>.svc.cluster.local
    #   caCertificateRefs -- defaults to the auto-generated CA ConfigMap
    # Override individual fields without replacing the entire block.
    validation:
      # -- Hostname for backend TLS validation.
      # If empty, defaults to <fullname>.<namespace>.svc.cluster.local
      hostname: ""
      # -- CA certificate references for backend validation.
      # If empty, defaults to the auto-generated CA ConfigMap (created alongside
      # the backend TLS secret). Override to reference your own ConfigMap, Secret, etc.
      caCertificateRefs: []
      # - name: my-ca-configmap
      #   group: ""
      #   kind: ConfigMap
      # - name: my-ca-secret
      #   group: ""
      #   kind: Secret
      # -- Use well-known CA certificates (e.g. "System").
      # When set, caCertificateRefs is not rendered (they are mutually exclusive per Gateway API spec).
      wellKnownCACertificates: ""

    # -- Backend TLS certificate configuration.
    # This is the certificate that the Layer7 Gateway pod serves to the
    # Kubernetes Gateway controller. This is separate from the listener TLS
    # (kubernetesGateway.gateway.tls) which is presented to clients.
    # Two modes:
    #   1. Auto-generate: leave existingSecretName empty (default)
    #      A self-signed certificate + CA is generated using Helm built-in functions.
    #      The CA is exported as a ConfigMap for BackendTLSPolicy validation.
    #   2. Reference an existing secret: set existingSecretName
    #      You must also set validation.caCertificateRefs or
    #      validation.wellKnownCACertificates so the controller can verify
    #      the backend certificate.

    tls:
      # -- Reference an existing kubernetes.io/tls Secret for the backend certificate.
      # This configuration does not handle key rotation. Bootstrapped configurations only apply during startup.
      # We recommend managing the Gateway's certificate chains externally and only using the validation configuration above for CA validation.
      existingSecretName: ""
      # -- Enable SSL key bootstrap into the Layer7 Gateway pod.
      # When true, the backend TLS secret (auto-generated or existingSecretName) is
      # mounted into the pod and a bootstrap script loads it as the default SSL key.
      # Set to false when you only need the BackendTLSPolicy resource (e.g. you manage
      # the pod's SSL key externally and only provide a CA for validation).
      bootstrap: true
      # -- Force the bootstrap script to run on every helm install/upgrade.
      # By default, on a database-backed gateway the script only runs on initial install
      # (to avoid overwriting keys rotated via Policy Manager or CI/CD).
      # Set true to override this safety check.
      forceBootstrap: false

    # -- Additional labels for the BackendTLSPolicy resource
    labels: {}
    # -- Additional annotations for the BackendTLSPolicy resource
    annotations: {}

  # --- TLSRoute ---
  # Used for TLS passthrough (SNI-based routing, no termination at Gateway).
  # This is an alternative to httpRoute -- typically only one is enabled.
  tlsRoute:
    # -- Enable TLSRoute resource
    enabled: false
    # -- TLSRoute API version. TLSRoute is GA (v1) as of Gateway API 1.5.0.
    # Set to gateway.networking.k8s.io/v1 when your Gateway API CRDs include
    # TLSRoute at v1.
    apiVersion: gateway.networking.k8s.io/v1alpha2
    # -- TLSRoute rules. Each rule creates a backendRef to the chart's own service.
    # Same hostname grouping as httpRoute - rules with the same hostname become one TLSRoute.
    # port is the Layer7 Gateway service port (service.ports[].external
    # or management.service.ports[].external).
    rules:
      - hostname: dev.ca.com
        port: 8443
      - hostname: dev-pm.ca.com
        port: 9443
        backend: management

    # -- Additional labels for the TLSRoute resource
    labels: {}
    # -- Additional annotations for the TLSRoute resource
    annotations: {}

  # -- Labels applied to all Gateway API resources created by this chart
  labels: {}
  # -- Annotations applied to all Gateway API resources created by this chart
  annotations: {}

# Additional Environment variables to be added to the Gateway Configmap
additionalEnv: {}
# key1: value
# key2: value

# Additional Secret variables to be added to the Gateway Secret
additionalSecret: {}
# key1: value
# key2: value

# This mounts one or more bundles that exist as secrets or configmaps in your Kubernetes Cluster.
# When creating these secrets/configmaps the format should be
# key: bundle1.bundle value: <xml value>
# Each bundle that you create as a ConfigMap can not exceed 1MB in size.

# Bundles that contain sensitive information can be mounted using the Kubernetes CSI Driver
existingBundle:
