apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kafka.fullname" . }}-external-svc-creator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
        job: kafka-external-svc-creator
    spec:
      serviceAccountName: {{ include "kafka.serviceAccountName" . }} # Use Kafka's SA or create a specific one
      restartPolicy: Never
      containers:
      - name: create-kafka-external-services
        image: "{{ .Values.externalAccess.discoveryImage.repository }}:{{ .Values.externalAccess.discoveryImage.tag }}"
        imagePullPolicy: "{{ .Values.externalAccess.discoveryImage.pullPolicy }}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -ex

            echo "=== Starting Kafka External Service Creator Job ==="

            {{- $fullName := include "kafka.fullname" . }}
            {{- $replicaCount := int .Values.kafka.replicaCount }}
            {{- $serviceType := .Values.externalAccess.serviceType }}
            {{- $externalPort := .Values.externalAccess.port }}
            {{- $targetPort := .Values.kafka.listeners.external.port }}
            {{- $namespace := .Release.Namespace }}
            {{- $annotations := .Values.externalAccess.annotations }}

            echo "Full Name: {{ $fullName }}, Replicas: {{ $replicaCount }}, Service Type: {{ $serviceType }}, Namespace: {{ $namespace }}"

            {{- range $i := until $replicaCount }}
            {{- $svcName := printf "%s-%d-external" $fullName $i }}
            {{- $podName := printf "%s-%d" $fullName $i }}
            {{- $brokerId := printf "%d" $i }}

            echo "Applying service: {{ $svcName }} for pod: {{ $podName }} (Broker ID: {{ $brokerId }})"

            cat <<EOF | kubectl apply -f -
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $namespace }}
  labels:
    helm.sh/chart: {{ include "kafka.chart" $ }}
    app.kubernetes.io/name: {{ include "kafka.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app: kafka
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    statefulset.kubernetes.io/pod-name: {{ $podName }}
    kafka-broker-id: "{{ $brokerId }}"
  {{- with $.Values.global.additionalLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $serviceType }}
{{- if eq $serviceType "LoadBalancer" }}
  {{- if $.Values.externalAccess.loadBalancerIPs }}
  {{- if gt (len $.Values.externalAccess.loadBalancerIPs) $i }}
  loadBalancerIP: {{ index $.Values.externalAccess.loadBalancerIPs $i }}
  {{- end }}
  {{- end }}
{{- end }}
  ports:
  - name: external
    port: {{ $externalPort }}
    targetPort: {{ $targetPort }}
    protocol: TCP
{{- if eq $serviceType "NodePort" }}
  {{- if $.Values.externalAccess.nodePorts }}
  {{- if gt (len $.Values.externalAccess.nodePorts) $i }}
  nodePort: {{ index $.Values.externalAccess.nodePorts $i }}
  {{- end }}
  {{- end }}
{{- end }}
  selector:
    app.kubernetes.io/name: {{ include "kafka.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app: kafka
    statefulset.kubernetes.io/pod-name: {{ $podName }}
EOF
            {{- end }}
            echo "=== Kafka External Service Creator Job Completed ==="