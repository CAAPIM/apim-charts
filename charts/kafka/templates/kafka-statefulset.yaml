apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.kafka.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "kafka.fullname" . }}
  replicas: {{ .Values.kafka.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
      {{- if  .Values.kafka.podAnnotations }}
      annotations: {{- toYaml .Values.kafka.podAnnotations | nindent 8 }}
      {{- if .Values.kafka.forceRedeploy }}
        timestamp: {{ now | quote }}
      {{- end }}
      {{- end }}
      {{- if not .Values.kafka.podAnnotations }}
      {{- if .Values.kafka.forceRedeploy }}
      annotations:
        timestamp: {{ now | quote }}
      {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kafka.serviceAccountName" . }}
      {{- if .Values.kafka.affinity }}
      affinity: {{- toYaml .Values.kafka.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.kafka.nodeSelector }}
      nodeSelector: {{- toYaml .Values.kafka.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.kafka.tolerations }}
      tolerations: {{- toYaml .Values.kafka.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.kafka.podSecurityContext }}
      securityContext: {{- toYaml .Values.kafka.podSecurityContext | nindent 8 }}
      {{- else if .Values.global.podSecurityContext }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- else }}
      securityContext:
        fsGroup: 1010
      {{- end }}
      {{- if .Values.kafka.kraft.enabled }}
      initContainers:
      {{- if and .Values.externalAccess.enabled .Values.externalAccess.autoAdvertisedListeners (not .Values.externalAccess.hostname) }}
      # Init container to discover LoadBalancer IP/hostname
      - name: kafka-lb-discovery
        image: "{{ .Values.externalAccess.discoveryImage.repository }}:{{ .Values.externalAccess.discoveryImage.tag }}"
        imagePullPolicy: "{{ .Values.externalAccess.discoveryImage.pullPolicy }}"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command:
          - /bin/sh
        args:
          - -c
          - |
            set -ex
            
            echo "=== Discovering LoadBalancer IP/hostname ==="
            
            # Extract node ID from pod name
            NODE_ID="${POD_NAME##*-}"
            echo "Node ID: $NODE_ID"
            
            EXTERNAL_SVC="{{ include "kafka.fullname" . }}-${NODE_ID}-external"
            echo "External service: $EXTERNAL_SVC"
            
            # Check service type and discover external address accordingly
            SERVICE_TYPE=$(kubectl get svc $EXTERNAL_SVC -n $POD_NAMESPACE -o jsonpath='{.spec.type}' 2>/dev/null || echo "")
            echo "Service type: $SERVICE_TYPE"
            
            if [ "$SERVICE_TYPE" = "LoadBalancer" ]; then
              echo "Discovering LoadBalancer IP/hostname..."
              # Wait for LoadBalancer to be assigned (max 30 seconds)
              for i in $(seq 1 6); do
                EXTERNAL_IP=$(kubectl get svc $EXTERNAL_SVC -n $POD_NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
                EXTERNAL_HOSTNAME=$(kubectl get svc $EXTERNAL_SVC -n $POD_NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
                
                if [ -n "$EXTERNAL_IP" ]; then
                  EXTERNAL_ADDRESS="$EXTERNAL_IP"
                  echo "Found LoadBalancer IP: $EXTERNAL_ADDRESS"
                  break
                elif [ -n "$EXTERNAL_HOSTNAME" ]; then
                  EXTERNAL_ADDRESS="$EXTERNAL_HOSTNAME"
                  echo "Found LoadBalancer hostname: $EXTERNAL_ADDRESS"
                  break
                fi
                
                echo "Waiting for LoadBalancer IP/hostname... (attempt $i/6)"
                sleep 5
              done
              
              if [ -z "$EXTERNAL_ADDRESS" ]; then
                echo "WARNING: LoadBalancer IP/hostname not found after 30 seconds"
                echo "Using service name as fallback"
                EXTERNAL_ADDRESS="${EXTERNAL_SVC}"
              fi
              
            elif [ "$SERVICE_TYPE" = "NodePort" ]; then
              echo "Discovering NodePort configuration..."
              # Get NodePort
              NODE_PORT=$(kubectl get svc $EXTERNAL_SVC -n $POD_NAMESPACE -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
              # Get any node IP (we'll use the first ready node)
              NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}' 2>/dev/null || echo "")
              if [ -z "$NODE_IP" ]; then
                NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || echo "")
              fi
              
              if [ -n "$NODE_IP" ] && [ -n "$NODE_PORT" ]; then
                EXTERNAL_ADDRESS="${NODE_IP}"
                EXTERNAL_PORT="$NODE_PORT"
                echo "Found NodePort: ${NODE_IP}:${NODE_PORT}"
              else
                echo "WARNING: Could not determine NodePort configuration"
                echo "Using service name as fallback"
                EXTERNAL_ADDRESS="${EXTERNAL_SVC}"
                EXTERNAL_PORT="{{ .Values.externalAccess.port }}"
              fi
              
            else
              echo "WARNING: Unknown service type: $SERVICE_TYPE"
              echo "Using service name as fallback"
              EXTERNAL_ADDRESS="${EXTERNAL_SVC}"
            fi
            
            # Write external address to shared volume
            mkdir -p /shared
            echo "EXTERNAL_ADDRESS=${EXTERNAL_ADDRESS}" > /shared/lb-address.env
            if [ -n "$EXTERNAL_PORT" ]; then
              echo "EXTERNAL_PORT=${EXTERNAL_PORT}" >> /shared/lb-address.env
            fi
            echo "=== External access discovery complete ==="
            cat /shared/lb-address.env
        volumeMounts:
        - name: shared-config
          mountPath: /shared
      {{- end }}
      # Init container to set node ID and configure advertised listeners
      - name: kafka-init
        image: "{{ .Values.global.portalRepository }}{{ .Values.image.kafka }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
          - /bin/sh
        args:
          - -c
          - |
            set -ex
            
            # Create hostname command wrapper if it doesn't exist
            if ! command -v hostname >/dev/null 2>&1; then
              echo "hostname command not found, creating wrapper..."
              echo '#!/bin/sh' > /tmp/hostname
              echo 'echo $HOSTNAME' >> /tmp/hostname
              chmod +x /tmp/hostname
              export PATH="/tmp:$PATH"
            fi
            
            echo "=== Initializing Kafka KRaft configuration ==="
            
            # Use POD_NAME from environment (injected via downward API)
            echo "Pod name: $POD_NAME"
            
            # Extract node ID from pod name (e.g., kafka-0 -> 0)
            # Using parameter expansion instead of rev command
            NODE_ID="${POD_NAME##*-}"
            echo "Node ID: $NODE_ID"
            
            # Validate NODE_ID is a number
            if ! echo "$NODE_ID" | grep -qE '^[0-9]+$'; then
              echo "ERROR: NODE_ID is not a valid number: $NODE_ID"
              exit 1
            fi
            
            # Create shared directory if it doesn't exist
            mkdir -p /shared
            
            # Write node ID to shared volume
            echo "KAFKA_CFG_NODE_ID=$NODE_ID" > /shared/node-id.env
            echo "Wrote KAFKA_CFG_NODE_ID to /shared/node-id.env"
            
            {{- if and .Values.externalAccess.enabled .Values.externalAccess.autoAdvertisedListeners }}
            echo "Building advertised listeners with external access..."
            INTERNAL_LISTENER="INTERNAL://{{ include "kafka.fullname" . }}-${NODE_ID}.{{ include "kafka.fullname" . }}:{{ .Values.kafka.listeners.internal.port }}"
            echo "Internal listener: $INTERNAL_LISTENER"
            
            CONTROLLER_LISTENER="CONTROLLER://{{ include "kafka.fullname" . }}-${NODE_ID}.{{ include "kafka.fullname" . }}:{{ .Values.kafka.listeners.controller.port }}"
            echo "Controller listener: $CONTROLLER_LISTENER"
            
            {{- if .Values.externalAccess.hostname }}
            # Use provided hostname for external listener
            EXTERNAL_LISTENER="EXTERNAL://{{ .Values.externalAccess.hostname }}:{{ .Values.externalAccess.port }}"
            echo "External listener (hostname): $EXTERNAL_LISTENER"
            {{- else }}
            # Load external address from discovery init container
            if [ -f /shared/lb-address.env ]; then
              echo "Loading external address from discovery..."
              source /shared/lb-address.env
              # Use discovered port if available, otherwise use configured port
              EXTERNAL_PORT_TO_USE="${EXTERNAL_PORT:-{{ .Values.externalAccess.port }}}"
              EXTERNAL_LISTENER="EXTERNAL://${EXTERNAL_ADDRESS}:${EXTERNAL_PORT_TO_USE}"
              echo "External listener: $EXTERNAL_LISTENER"
            else
              echo "WARNING: External address not found, using service name"
              EXTERNAL_LISTENER="EXTERNAL://{{ include "kafka.fullname" . }}-${NODE_ID}-external:{{ .Values.externalAccess.port }}"
              echo "External listener (fallback): $EXTERNAL_LISTENER"
            fi
            {{- end }}
            
            ADVERTISED_LISTENERS="${INTERNAL_LISTENER},${CONTROLLER_LISTENER},${EXTERNAL_LISTENER}"
            echo "KAFKA_CFG_ADVERTISED_LISTENERS=$ADVERTISED_LISTENERS" >> /shared/node-id.env
            {{- else }}
            echo "Building advertised listeners (internal only)..."
            INTERNAL_LISTENER="INTERNAL://{{ include "kafka.fullname" . }}-${NODE_ID}.{{ include "kafka.fullname" . }}:{{ .Values.kafka.listeners.internal.port }}"
            echo "Internal listener: $INTERNAL_LISTENER"
            
            CONTROLLER_LISTENER="CONTROLLER://{{ include "kafka.fullname" . }}-${NODE_ID}.{{ include "kafka.fullname" . }}:{{ .Values.kafka.listeners.controller.port }}"
            echo "Controller listener: $CONTROLLER_LISTENER"
            
            echo "KAFKA_CFG_ADVERTISED_LISTENERS=$INTERNAL_LISTENER,$CONTROLLER_LISTENER" >> /shared/node-id.env
            {{- end }}
            
            echo "=== Configuration written to /shared/node-id.env ==="
            cat /shared/node-id.env
            echo "=== Init container completed successfully ==="
        volumeMounts:
        - name: shared-config
          mountPath: /shared
      {{- end }}
      containers:
      - name: kafka
        image: "{{ .Values.global.portalRepository }}{{ .Values.image.kafka }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        {{- if .Values.kafka.containerSecurityContext }}
        securityContext: {{- toYaml .Values.kafka.containerSecurityContext | nindent 10 }}
        {{- else if .Values.global.containerSecurityContext }}
        securityContext: {{- toYaml .Values.global.containerSecurityContext | nindent 10 }}
        {{- end }}
        {{- if .Values.kafka.kraft.enabled }}
        command:
          - /bin/sh
        args:
          - -c
          - |
            set -e
            
            # Create hostname command wrapper if it doesn't exist
            if ! command -v hostname >/dev/null 2>&1; then
              echo "hostname command not found, creating wrapper..."
              echo '#!/bin/sh' > /tmp/hostname
              echo 'echo $HOSTNAME' >> /tmp/hostname
              chmod +x /tmp/hostname
              export PATH="/tmp:$PATH"
            fi
            
            # Set HOSTNAME if not already set (for compatibility)
            export HOSTNAME=${HOSTNAME:-$(cat /etc/hostname 2>/dev/null || echo "kafka")}
            
            # Source node-specific configuration from init container
            if [ -f /shared/node-id.env ]; then
              echo "Loading node-specific configuration..."
              cat /shared/node-id.env
              source /shared/node-id.env
              export KAFKA_CFG_NODE_ID
              export KAFKA_CFG_ADVERTISED_LISTENERS
            fi
            
            # Start Kafka with the original entrypoint
            exec /opt/ca/start-kafka.sh
        {{- end }}
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- if .Values.kafka.tls.enabled }}
        {{- if .Values.kafka.tls.secretName }}
        - name: KAFKA_CFG_SSL_KEYSTORE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.kafka.tls.secretName }}
              key: {{ .Values.kafka.tls.keystoreKeyKey }}
        - name: KAFKA_CFG_SSL_TRUSTSTORE_CERTIFICATES
          valueFrom:
            secretKeyRef:
              name: {{ .Values.kafka.tls.secretName }}
              key: {{ .Values.kafka.tls.truststoreCertKey }}
        {{- end }}
        {{- if .Values.kafka.tls.passwordSecretName }}
        - name: KAFKA_CFG_SSL_KEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.kafka.tls.passwordSecretName }}
              key: {{ .Values.kafka.tls.passwordSecretKey }}
        {{- end }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "kafka.fullname" . }}-config
        readinessProbe:
          tcpSocket:
            port: {{ .Values.kafka.listeners.internal.port }}
          initialDelaySeconds: 90
          timeoutSeconds: 5
          periodSeconds: 15
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: {{ .Values.kafka.listeners.internal.port }}
          initialDelaySeconds: 120
          timeoutSeconds: 5
          periodSeconds: 15
          successThreshold: 1
          failureThreshold: 3
        {{- if .Values.kafka.resources }}
        resources: {{- toYaml .Values.kafka.resources | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.kafka.listeners.internal.port }}
          name: kafka
        {{- if and .Values.kafka.listeners.external.enabled .Values.externalAccess.enabled }}
        - containerPort: {{ .Values.kafka.listeners.external.port }}
          name: external
        {{- end }}
        {{- if and .Values.kafka.kraft.enabled .Values.kafka.listeners.controller.enabled }}
        - containerPort: {{ .Values.kafka.listeners.controller.port }}
          name: controller
        {{- end }}
        volumeMounts:
        - name: kafka-vol-claim
          mountPath: /opt/ca/kafka/kafka-logs
          subPath: data/kafka/kafka-logs
        {{- if .Values.kafka.kraft.enabled }}
        - name: shared-config
          mountPath: /shared
        {{- end }}
      {{- if .Values.global.pullSecret }}
      imagePullSecrets:
      - name: "{{ .Values.global.pullSecret }}"
      {{- end }}
      volumes:
      {{- if .Values.kafka.kraft.enabled }}
      - name: shared-config
        emptyDir: {}
      {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
  volumeClaimTemplates:
    - metadata:
        name: kafka-vol-claim
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.global.storageClass}}
        storageClassName: "{{ .Values.global.storageClass }}"
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.storage.kafka }}
