# Global values (inherited from parent chart)
global:
  portalRepository: ""
  storageClass: ""
  pullSecret: ""
  podSecurityContext: {}
  containerSecurityContext: {}
  additionalLabels: {}
  # Portal subdomain (used for advertised listeners)
  subdomainPrefix: ""

# Kafka image configuration
image:
  kafka: kafka:latest
  pullPolicy: IfNotPresent

# Override the full name to make Kafka accessible as 'kafka' instead of '<release>-kafka'
fullnameOverride: kafka

# Kafka deployment configuration
kafka:
  # Number of Kafka broker replicas
  replicaCount: 1
  # Ordinals configuration (Kubernetes 1.27+)
  # Set start ordinal for StatefulSet pods
  # Useful for upgrades from Kafka 3.x (Zookeeper) to 4.0 (KRaft)
  # where old meta.properties had broker.id=1
  ordinals:
    # Start ordinal (default: 0, set to 1 for upgrades from single-pod Zookeeper mode)
    start: 1
  
  # Additional labels for Kafka pods
  additionalLabels: {}
  
  # Pod annotations
  podAnnotations: {}
  
  # Force redeploy by adding timestamp annotation
  forceRedeploy: false
  
  # Pod affinity rules
  affinity: {}
  
  # Node selector
  nodeSelector: {}
  
  # Tolerations
  tolerations: []
  
  # Pod security context
  podSecurityContext: {}
  
  # Container security context
  containerSecurityContext: {}
  
  # Resource requests and limits
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 750Mi
    # limits:
    #   cpu: 1000m
    #   memory: 1.5Gi
  
  # KRaft Mode Configuration (Kafka 4.0.0+)
  kraft:
    # Enable KRaft mode (Zookeeper-less)
    enabled: true
    # Cluster ID for KRaft (must be consistent across all brokers)
    # Set to a fixed value or leave empty to auto-generate based on subdomain
    clusterId: ""
    # Node ID (will be set based on pod ordinal if empty)
    # IMPORTANT: Leave empty to use pod ordinal (0, 1, 2) for StatefulSet
    nodeId: ""
    # Process roles (broker, controller, or both)
    processRoles: "broker,controller"
    # Controller quorum voters format: id@host:port
    # For StatefulSet with 3 replicas: "0@kafka-0.kafka:9093,1@kafka-1.kafka:9093,2@kafka-2.kafka:9093"
    controllerQuorumVoters: ""
  
  # Listener Configuration
  listeners:
    # Internal listener for inter-broker and client communication within cluster
    internal:
      enabled: true
      port: 9092
      protocol: PLAINTEXT
    # External listener for clients outside the cluster
    external:
      enabled: true
      port: 9094
      protocol: SSL
    # Controller listener for KRaft mode
    controller:
      enabled: true
      port: 9093
      protocol: PLAINTEXT
    # Inter-broker listener name
    interBrokerListenerName: INTERNAL
  
  # Advertised Listeners Configuration
  # Custom advertised listeners (portal-dist style)
  # Format: "INTERNAL://kafka:9092,EXTERNAL://apim-kafka.subdomain:9094"
  # Leave empty to auto-generate based on externalAccess settings
  advertisedListeners: ""
  
  # Log retention configuration
  logRetentionHours: 6
  
  # TLS/SSL Configuration
  tls:
    # Enable TLS/SSL (required when external listener uses SSL protocol)
    enabled: false
    # TLS type (PEM or JKS)
    type: PEM
    # Client authentication (none, requested, required)
    clientAuth: required
    
    # ============================================
    # Option 1: Kubernetes Secret (Recommended)
    # ============================================
    # Secret containing TLS certificates
    # Should contain: keystore.key, truststore.pem
    # When using Intelligence, set to portal-internal-secret
    secretName: ""
    # Keys in the secret
    keystoreKeyKey: "keystore.key"
    truststoreCertKey: "truststore.pem"
    # Password secret for encrypted keys (required for encrypted private keys)
    # When using Intelligence, set to portal-internal-secret
    passwordSecretName: ""
    passwordSecretKey: "keypass.txt"
    
    # TSSG Certificates (use apim-ssl from internal secret by default)
    # The secret name for TSSG certificates (apim-ssl)
    # Changed to portal-external-secret to support static certificate deployments
    internalSecretName: "portal-external-secret"
    tssgKeyKey: "apim-ssl.p8.key"      # Default to apim-ssl, can be overridden
    tssgCertKey: "apim-ssl.crt"        # Default to apim-ssl, can be overridden
    passwordKey: "keypass.txt"
    
    # ============================================
    # Option 2: Inline Certificates (portal-dist style)
    # ============================================
    # Pass certificates as environment variables
    # These take precedence over secretName if both are set
    # Can be base64 encoded or PEM format
    truststoreCertContent: ""
    keystoreKeyContent: ""
    
    # ============================================
    # Option 3: CA Certificates (analytics_util style)
    # ============================================
    # Alternative certificate format
    caKey: ""
    caCertificate: ""
    caTruststoreCertificate: ""
  
  # SASL Authentication Configuration
  sasl:
    # Enable SASL authentication
    enabled: false
    # SASL mechanisms (PLAIN, SCRAM-SHA-256, SCRAM-SHA-512)
    mechanisms: PLAIN
    # Inter-broker SASL mechanism
    interBrokerProtocol: PLAIN
    # JAAS configuration file path
    jaasConfigPath: /opt/ca/kafka/config/kafka_server_jaas.conf

# Zookeeper configuration
zookeeper:
  hostname: zookeeper
  port: 2181

# Persistence configuration
persistence:
  storage:
    kafka: 10Gi

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Automount service account token
  automountServiceAccountToken: true

# External access configuration for autodiscovery
externalAccess:
  # External access should be enabled only when Intelligence is enabled
  # Analytics (Druid) uses internal Kafka service only
  enabled: false
  # Service type for external access (LoadBalancer or NodePort)
  serviceType: LoadBalancer
  # Port for external access (should match kafka.listeners.external.port)
  port: 9094
  # Hostname/domain for external access (used in advertised listeners)
  # Format: apim-kafka.{subdomain} or specific hostname
  hostname: ""
  # Annotations for external services
  annotations: {}
  # LoadBalancer IPs (optional, for static IPs)
  loadBalancerIPs: []
  # NodePort values (optional, for NodePort service type)
  nodePorts: []
  # Auto-generate advertised listeners based on service IPs
  autoAdvertisedListeners: true
  
  # Discovery configuration for LoadBalancer/NodePort IP detection
  # NOTE: This only applies when externalAccess.enabled is true
  # When intelligence is disabled, Kafka uses internal-only listeners and these settings are ignored
  discovery:
    # Maximum time to wait for LoadBalancer IP (in seconds)
    # Default: 120 seconds (24 retries * 5 seconds)
    timeoutSeconds: 120
    # Retry interval (in seconds)
    retryIntervalSeconds: 5
    # Fail fast: If true, pod will fail when LoadBalancer IP cannot be discovered
    # This prevents Kafka from starting with incorrect advertised listeners
    # If false, falls back to service hostname (NOT RECOMMENDED - causes connection issues)
    # IMPORTANT: Only affects behavior when externalAccess.enabled=true
    failOnDiscoveryFailure: true
  
  # Discovery image for LoadBalancer IP detection (kubectl)
  # Note: When used as a subchart, image.autoDiscovery should be provided by parent chart
  # When used standalone, provide these values during deployment
  discoveryImage:
    repository: "tls-automator"
    tag: "latest"  # Should be overridden with specific version
    pullPolicy: IfNotPresent

