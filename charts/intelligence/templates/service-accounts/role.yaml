{{- if and .Values.intelligenceServer.rbac.create .Values.intelligenceServer.serviceAccount.create (not .Values.global.serviceAccountName) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "intelligence.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "intelligence.name" . }}
    chart: {{ template "intelligence.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  {{- if .Values.intelligenceServer.kafka.autoDiscovery.enabled }}
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
  {{- end }}
{{- end }}