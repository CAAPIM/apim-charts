{{- if .Values.intelligence.kafka.autoDiscovery.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intelligence.fullname" . }}-kafka-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    app: intelligence-server
    component: kafka-discovery
    chart: {{ template "intelligence.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    "helm.sh/hook-weight": "-5"
data:
  KAFKA_EXTERNAL_ADVERTIZED_BROKERS: ""
{{- end }}