apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-server
  labels:
    app: intelligence-server
    chart: {{ template "intelligence.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- range $key, $val := .Values.global.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
    {{- range $key, $val := .Values.intelligenceServer.additionalLabels }}
    {{ $key }}: "{{ $val }}"
    {{- end }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  replicas: {{ .Values.intelligenceServer.replicaCount }}
  selector:
    matchLabels:
      app: intelligence-server
  template:
    metadata:
      labels:
        app: intelligence-server
        release: {{ .Release.Name }}
      {{- if  .Values.intelligenceServer.podAnnotations }}
      annotations: {{- toYaml .Values.intelligenceServer.podAnnotations | nindent 8 }}
      {{- if .Values.intelligenceServer.forceRedeploy }}
        timestamp: {{ now | quote }}
      {{- end }}
      {{- end }}
      {{- if not .Values.intelligenceServer.podAnnotations }}
      {{- if .Values.intelligenceServer.forceRedeploy }}
      annotations:
        timestamp: {{ now | quote }}
      {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "intelligence.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- if .Values.intelligenceServer.affinity }}
      affinity: {{- toYaml .Values.intelligenceServer.affinity | nindent 12 }}
      {{- end }}
      {{- if .Values.intelligenceServer.nodeSelector }}
      nodeSelector: {{- toYaml .Values.intelligenceServer.nodeSelector | nindent 12 }}
      {{- end }}
      {{- if .Values.intelligenceServer.tolerations }}
      tolerations: {{- toYaml .Values.intelligenceServer.tolerations | nindent 12 }}
      {{- end }}
      {{- if .Values.intelligenceServer.podSecurityContext }}
      securityContext: {{- toYaml .Values.intelligenceServer.podSecurityContext | nindent 12 }}
      {{- else if .Values.global.podSecurityContext }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 12 }}
      {{- end }}
      {{- if .Values.intelligenceServer.kafka.autoDiscovery.enabled }}
      {{ template "intelligence.validate" .}}
      initContainers:
        - name: kafka-broker-discovery
          image: "{{ .Values.intelligenceServer.kafka.autoDiscovery.image.repository }}:{{ .Values.intelligenceServer.kafka.autoDiscovery.image.tag }}"
          imagePullPolicy: "{{ .Values.intelligenceServer.kafka.autoDiscovery.image.pullPolicy }}"
          command:
            - /bin/sh
            - -ec
            - |
              # This script discovers the external addresses of Kafka brokers
              # and writes them to a shared volume for the main container to use.
              RELEASE_NAME="{{ .Release.Name }}"
              BROKER_LIST=""

              # Function to retry a command (sh-compatible)
              retry_while() {
                  cmd="${1:?cmd is missing}"
                  retries="${2:-12}"
                  sleep_time="${3:-5}"
                  return_value=1
                  i=1
                  while [ "$i" -le "$retries" ]; do
                      if eval "$cmd"; then
                          return_value=0
                          break
                      fi
                      echo "Retrying in ${sleep_time}s... (${i}/${retries})"
                      sleep "$sleep_time"
                      i=$((i + 1))
                  done
                  return $return_value
              }

              # Function to get NodePort from a service (sh-compatible)
              k8s_svc_node_port() {
                  node_port=$(kubectl get svc "$1" -n "$2" -o jsonpath="{.spec.ports[0].nodePort}" 2>/dev/null || echo "")
                  echo "$node_port"
              }

              # Function to get LoadBalancer IP or Hostname from a service (sh-compatible)
              k8s_svc_lb_ip() {
                  service_ip=$(kubectl get svc "$1" -n "$2" -o jsonpath="{.status.loadBalancer.ingress[0].ip}" 2>/dev/null || echo "")
                  service_hostname=$(kubectl get svc "$1" -n "$2" -o jsonpath="{.status.loadBalancer.ingress[0].hostname}" 2>/dev/null || echo "")
                  if [ -n "$service_ip" ]; then 
                      echo "$service_ip"
                  elif [ -n "$service_hostname" ]; then 
                      echo "$service_hostname"
                  else 
                      return 1
                  fi
              }

              discover_broker() {
                  SVC_NAME=$1
                  BROKER_ENDPOINT=""

                  echo "Discovering broker: ${SVC_NAME}"

                  if ! kubectl get svc "$SVC_NAME" -n "$MY_POD_NAMESPACE" > /dev/null 2>&1; then
                    echo "Service $SVC_NAME not found, skipping."
                    return
                  fi

                  AUTODISCOVERY_SERVICE_TYPE=$(kubectl get svc "$SVC_NAME" -n "$MY_POD_NAMESPACE" -o jsonpath='{.spec.type}' 2>/dev/null || echo "")

                  if [ "$AUTODISCOVERY_SERVICE_TYPE" = "LoadBalancer" ]; then
                      if ! retry_while "kubectl get svc $SVC_NAME -n $MY_POD_NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0]}'" ; then 
                          echo "Timed out waiting for LoadBalancer IP for service $SVC_NAME"
                          exit 1
                      fi
                      EXTERNAL_ADDRESS=$(k8s_svc_lb_ip "$SVC_NAME" "$MY_POD_NAMESPACE")
                      EXTERNAL_PORT=$(kubectl get svc "$SVC_NAME" -n "$MY_POD_NAMESPACE" -o jsonpath="{.spec.ports[0].port}" 2>/dev/null || echo "")
                      BROKER_ENDPOINT="${EXTERNAL_ADDRESS}:${EXTERNAL_PORT}"
                  elif [ "$AUTODISCOVERY_SERVICE_TYPE" = "NodePort" ]; then
                      NODE_PORT=$(k8s_svc_node_port "$SVC_NAME" "$MY_POD_NAMESPACE")
                      NODE_IP=$(kubectl get svc "$SVC_NAME" -n "$MY_POD_NAMESPACE" -o jsonpath="{.spec.clusterIP}" 2>/dev/null || echo "")
                      BROKER_ENDPOINT="${NODE_IP}:${NODE_PORT}"
                  fi

                  if [ -n "$BROKER_ENDPOINT" ]; then
                    if [ -z "$BROKER_LIST" ]; then 
                        BROKER_LIST="$BROKER_ENDPOINT"
                    else 
                        BROKER_LIST="$BROKER_LIST,$BROKER_ENDPOINT"
                    fi
                  fi
              }

              # Discover Kafka broker nodes
              # For custom Kafka subchart
              {{- if and .Values.kafka (hasKey .Values.kafka "kafka") .Values.kafka.kafka .Values.kafka.kafka.replicaCount }}
              BROKER_COUNT={{ .Values.kafka.kafka.replicaCount }}
              for i in $(seq 0 $((BROKER_COUNT - 1))); do
                SVC_NAME="kafka-${i}-external"
                discover_broker "$SVC_NAME"
              done
              {{- else if and .Values.kafka (hasKey .Values.kafka "controller") .Values.kafka.controller }}
              # For Bitnami Kafka chart (backward compatibility)
              {{- if and .Values.kafka.controller.replicaCount (not .Values.kafka.controller.controllerOnly) }}
              CONTROLLER_BROKER_COUNT={{ .Values.kafka.controller.replicaCount }}
              for i in $(seq 0 $((CONTROLLER_BROKER_COUNT - 1))); do
                SVC_NAME="kafka-controller-${i}-external"
                discover_broker "$SVC_NAME"
              done
              {{- end }}

              # Discover dedicated broker nodes
              {{- if and (hasKey .Values.kafka "broker") .Values.kafka.broker .Values.kafka.broker.replicaCount }}
              BROKER_COUNT={{ .Values.kafka.broker.replicaCount }}
              if [ "$BROKER_COUNT" -gt 0 ]; then
                for i in $(seq 0 $((BROKER_COUNT - 1))); do
                  SVC_NAME="kafka-broker-${i}-external"
                  discover_broker "$SVC_NAME"
                done
              fi
              {{- end }}
              {{- else }}
              # Fallback: No Kafka configuration found
              echo "Warning: No Kafka broker configuration found"
              {{- end }}

              echo "Discovered Kafka brokers: ${BROKER_LIST}"
              echo "export KAFKA_EXTERNAL_ADVERTIZED_BROKERS=${BROKER_LIST}" > /shared/kafka.env
          env:
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      {{- end }}
      containers:
        - name: intelligence-server
          image: "{{ .Values.global.portalRepository }}{{ .Values.image.intelligenceServer }}"
          imagePullPolicy: "{{ .Values.intelligenceServer.image.pullPolicy }}"
          {{- if .Values.intelligenceServer.containerSecurityContext }}
          securityContext: {{- toYaml .Values.intelligenceServer.containerSecurityContext | nindent 12 }}
          {{- else if .Values.global.containerSecurityContext }}
          securityContext: {{- toYaml .Values.global.containerSecurityContext | nindent 12 }}
          {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- if .Values.intelligenceServer.kafka.autoDiscovery.enabled }}
              # Source the environment file from the init container
              if [ -f /shared/kafka.env ]; then
                echo "Sourcing KAFKA_EXTERNAL_ADVERTISED_BROKERS from init container..."
                cat /shared/kafka.env
                source /shared/kafka.env
              else
                echo "/shared/kafka.env  not found"
                exit 1
              fi
              {{- else }}
              echo "Sourcing KAFKA_EXTERNAL_ADVERTISED_BROKERS from helm..."
              export KAFKA_EXTERNAL_ADVERTIZED_BROKERS={{ .Values.intelligenceServer.kafka.externalAdvertisedBrokers }}
              {{- end }}
              
              {{- if .Values.intelligenceServer.kafka.kafkaCa.caSecretName }}
              # Load TSSG certificates for intelligence server
              # Certificates are already base64 encoded in the secret, so just read them directly
              echo "Loading TSSG certificates for intelligence server..."
              if [ -f "$KAFKA_CA_CERT_FILE" ]; then
                export KAFKA_CA_CERTIFICATE=$(cat "$KAFKA_CA_CERT_FILE")
                echo "KAFKA_CA_CERTIFICATE loaded"
              fi
              if [ -f "$KAFKA_CA_KEY_FILE" ]; then
                export KAFKA_CA_KEY=$(cat "$KAFKA_CA_KEY_FILE")
                echo "KAFKA_CA_KEY loaded"
              fi
              {{- end }}
              
              echo "Executing original entrypoint for intelligence-server..."
              java -jar /opt/app/intelligence-server.jar
          env:
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.auth.secretName }}
                  key: rabbitmq-password
                  optional: false
            - name: INTELLIGENCE_DATABASE_NAME
              value: {{ template "intelligence-db-name" . }}
            - name: DATABASE_USERNAME
              value: {{ .Values.global.databaseUsername | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.databaseSecret }}
                  {{ if eq .Values.global.databaseType "mysql" }}
                  key: mysql-password
                  {{- end }}
          # TSSG Certificates (always use apim-ssl from internal secret)
          # Intelligence server expects certificate and key content in environment variables
          {{- if .Values.intelligenceServer.kafka.kafkaCa.caSecretName }}
            - name: KAFKA_CA_CERTIFICATE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.intelligenceServer.kafka.kafkaCa.caSecretName }}
                  key: {{ .Values.intelligenceServer.kafka.kafkaCa.caCertKey | default "apim-ssl.crt" }}
                  optional: false
            - name: KAFKA_CA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.intelligenceServer.kafka.kafkaCa.caSecretName }}
                  key: {{ .Values.intelligenceServer.kafka.kafkaCa.caKeyKey | default "apim-ssl.p8.key" }}
                  optional: false
          {{- else }}
            # Provide empty values when using PLAINTEXT Kafka (no SSL)
            - name: KAFKA_CA_CERTIFICATE
              value: ""
            - name: KAFKA_CA_KEY
              value: ""
          {{- end }}
          {{- if .Values.intelligenceServer.kafka.kafkaCa.passwordSecretName }}
            - name: KAFKA_CA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.intelligenceServer.kafka.kafkaCa.passwordSecretName }}
                  key: {{ .Values.intelligenceServer.kafka.kafkaCa.passwordSecretKey | default "keypass.txt" }}
                  optional: false
            - name: TSSG_SSL_KEY_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.intelligenceServer.kafka.kafkaCa.passwordSecretName }}
                  key: {{ .Values.intelligenceServer.kafka.kafkaCa.passwordSecretKey | default "keypass.txt" }}
                  optional: false
          {{- else }}
            # Provide empty values when using PLAINTEXT Kafka (no password needed)
            - name: KAFKA_CA_PASSWORD
              value: ""
            - name: TSSG_SSL_KEY_PASS
              value: ""
          {{- end }}
            # Kafka External Advertised Brokers (for user-facing connections)
          {{- if not .Values.intelligenceServer.kafka.autoDiscovery.enabled }}
          {{- if .Values.intelligenceServer.kafka.externalAdvertisedBrokers }}
            - name: KAFKA_EXTERNAL_ADVERTIZED_BROKERS
              value: {{ .Values.intelligenceServer.kafka.externalAdvertisedBrokers | quote }}
          {{- end }}
          {{- end }}
          {{- $hasPapiHost := false }}
          {{- $hasPapiPort := false }}
          {{- if .Values.intelligenceServer.env }}
          {{- range $key, $value := .Values.intelligenceServer.env }}
            {{- if eq $key "PAPI_PUBLIC_HOST" }}
              {{- $hasPapiHost = true }}
            {{- end }}
            {{- if eq $key "PAPI_PUBLIC_PORT" }}
              {{- $hasPapiPort = true }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          {{- if not $hasPapiHost }}
            # Auto-generate PAPI_PUBLIC_HOST if not provided
            - name: PAPI_PUBLIC_HOST
              value: {{ include "tssg-public-host-for-intelligence" . | quote }}
          {{- end }}
          {{- if not $hasPapiPort }}
            # Auto-generate PAPI_PUBLIC_PORT if not provided
            - name: PAPI_PUBLIC_PORT
              value: {{ include "tssg-public-port-for-intelligence" . | quote }}
          {{- end }}
          envFrom:
          - configMapRef:
              name: intelligence-server-config
          readinessProbe:
            httpGet:
              path: "/health/readiness"
              port: 8282
            initialDelaySeconds: 90
            timeoutSeconds: 1
            periodSeconds: 15
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: "/health/liveness"
              port: 8282
            initialDelaySeconds: 120
            timeoutSeconds: 1
            periodSeconds: 15
            successThreshold: 1
          {{- if .Values.intelligenceServer.resources }}
          resources: {{- toYaml .Values.intelligenceServer.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.intelligenceServer.kafka.autoDiscovery.enabled }}
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          {{- end }}
          ports:
            - containerPort: 8282
      volumes:
      {{- if .Values.intelligenceServer.kafka.autoDiscovery.enabled }}
        - name: shared-data
          emptyDir: {}
      {{- end }}
      {{- if .Values.global.pullSecret }}
      imagePullSecrets:
      - name: "{{ .Values.global.pullSecret }}"
      {{- end }}
      {{- if .Values.intelligenceServer.affinity }}
      affinity: {{- toYaml .Values.intelligenceServer.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.intelligenceServer.nodeSelector }}
      nodeSelector: {{- toYaml .Values.intelligenceServer.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.intelligenceServer.tolerations }}
      tolerations: {{- toYaml .Values.intelligenceServer.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.global.schedulerName }}
      schedulerName: "{{ .Values.global.schedulerName }}"
      {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30