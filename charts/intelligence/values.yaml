# Default values for intelligence.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# Force redeployment of statefulsets and deployments on upgrade
forceRedeploy: false

# Global values that are typically provided by a parent chart.
# These are included here to allow the chart to be deployed standalone.
global:
  portalRepository: caapim/
  pullSecret: "" # Name of an existing image pull secret
  # Database settings for the intelligence service
  databaseType: mysql
  databaseSecret: "intelligence-db-secret" # A secret containing the database password
  databaseUsername: "intelligence_user"
  databaseHost: "mysql"
  databasePort: 3306
  databaseUseSSL: true
  databaseRequireSSL: false
  # Used for constructing database names
  legacyDatabaseNames: false
  subdomainPrefix: "dev-portal"
  # Pod and container security contexts
  podSecurityContext: {}
  # fsGroup: 1001
  containerSecurityContext: {}
  # runAsUser: 1001
  # schedulerName to be applied to pods
  schedulerName: ""
  # Additional labels to be applied to all resources
  additionalLabels: {}

# Configuration for the intelligence deployment (formerly intelligenceServer)
intelligence:
  replicaCount: 1
  image:
    intelligenceServer: "intelligence-server:mr_bitnami_kafka" # Moved from top-level image
    pullPolicy: IfNotPresent # Moved from intelligenceServer.image
  serviceAccount: # Moved from top-level
    create: true
    name: ""
    automountServiceAccountToken: true
  rbac: # Moved from top-level
    create: true
  kafka:
    autoDiscovery:
      # When enabled, an initContainer is used to discover Kafka broker external addresses.
      # This is useful when Kafka is deployed as part of the same release with external access enabled.
      enabled: true
      image:
        repository: "apim-docker-virtual.usw1.packages.broadcom.com/bitnamilegacy/kubectl"
        tag: "1.31"
        pullPolicy: IfNotPresent
      # Resource requests and limits for the auto-discovery init container
      # resources: {}
    externalAdvertisedBrokers: ""
    kafkaCa:
      caSecretName: ""
      passwordSecretName: ""
      passwordSecretKey: "keypass.txt"
      # Keys in the secret for TSSG cert/key (uses apim-ssl certificate with CN=tssg)
      # These can be overridden if using custom certificates
      caCertKey: "apim-ssl.crt"        # Default to apim-ssl, can be overridden
      caKeyKey: "apim-ssl.p8.key"      # Default to apim-ssl.p8.key, can be overridden
  # Additional labels for the intelligence deployment
  additionalLabels: {}
  # Pod affinity, node selector, and tolerations
  affinity: {}
  nodeSelector: {}
  tolerations: []
  # Security contexts for the pod and container
  podSecurityContext: {}
  containerSecurityContext: {}
  # Resource requests and limits
  resources: {}
    # requests:
    #   cpu: 200m
    #   memory: 512Mi
    # limits:
    #   cpu: 500m
    #   memory: 1Gi
  # Service configuration
  # Kafka client TLS settings from secrets

  service:
    type: ClusterIP
    port: 8282
    sessionAffinity: None
    # sessionAffinityConfig:
    #   clientIP:
    #     timeoutSeconds: 10800
    externalTrafficPolicy: ""
    internalTrafficPolicy: ""

# NOTE: When this chart is used as a subchart, it requires Kafka configuration
# for its initContainer to discover brokers. The parent chart must provide these
# values under the 'apim-intelligence.kafka' key.
#
# To avoid duplication, the parent chart's `values.yaml` can use a YAML alias:
#
# kafka: &kafka_config
#   #... kafka subchart values
#
# apim-intelligence:
#   kafka: *kafka_config
