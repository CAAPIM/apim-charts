name: Validate Schemas

on:
  pull_request:
    branches:
      - stable
      - develop/gateway
      - develop/portal
jobs:
  kubeconform-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.13.3
      - name: Run kubeconform
        run: .github/kubeconform.sh
