kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: portal-scc
  namespace: layer7portal
allowPrivilegedContainer: false
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 1000
  uidRangeMax: 1010
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 1010
supplementalGroups:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 1010
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowHostDirVolumePlugin: false
allowHostIPC: false
readOnlyRootFilesystem: false
seccompProfiles:
- runtime/default
volumes:
 - "*"
requiredDropCapabilities:
 - ALL
users:
 - 'system:serviceaccount:*:portal-sa'
allowedCapabilities:
  - NET_BIND_SERVICE
